<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>いくいく！雲紅亭珍光〜すもう編〜</title>
<meta name="description" content="色のバーに合わせてボタンを押して、シコを踏みながらママのもとへ。お漏らししたらトイレへダッシュ！ リズムすもうゲーム。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2A1830">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23D93A2B'/%3E%3Ccircle cx='16' cy='18' r='9' fill='%23F2C29B'/%3E%3Crect x='6' y='6' width='20' height='8' fill='%23D93A2B'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#1B1020; --panel:#2A1830; --line:#4A2A38; --ink:#FFF3E6; --muted:#C9A9B4;
  --red:#E8483A; --green:#3FB86B; --blue:#3F86E8; --gold:#FFD15C; --cap:#D93A2B;
  --body:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
#app{height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;font-size:13px;flex:none}
header a{color:var(--muted);text-decoration:none}
#mute{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:2px 8px;font-size:14px}
#sceneWrap{position:relative;flex:none;width:100%;height:min(44dvh,100vw);margin:0 auto;aspect-ratio:1/1;max-width:100%}
#scene{width:100%;height:100%;image-rendering:pixelated;background:#000;display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:6px 8px;pointer-events:none}
.bar{height:10px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden;border:1px solid rgba(255,255,255,.25)}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFB347,#FF6F61)}
.hudrow{display:flex;justify-content:space-between;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000;margin-bottom:2px}
#leakbar>i{background:linear-gradient(90deg,#6FB8FF,#3F86E8)}
#leakbar{margin-top:5px;height:8px}
#bubble{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:#FFF8EC;color:#3A2418;border:3px solid #3A2418;border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px;text-align:center;max-width:86%;box-shadow:0 3px 0 rgba(0,0,0,.4)}
#bubble::after{content:"";position:absolute;left:62%;bottom:-14px;border:8px solid transparent;border-top-color:#3A2418}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:900;color:#FFF3E6;text-shadow:0 4px 0 #8A2A1E,0 0 18px rgba(0,0,0,.7);pointer-events:none}
#bottom{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#lane{flex:1;min-height:0;width:100%;display:block;touch-action:none}
#btns{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
.btn{height:68px;border:0;border-radius:14px;color:#fff;font-weight:900;font-size:18px;letter-spacing:.05em;box-shadow:0 5px 0 rgba(0,0,0,.45);touch-action:none;user-select:none;-webkit-user-select:none}
.btn small{display:block;font-size:11px;font-weight:700;opacity:.85}
.btn.r{background:var(--red)}.btn.g{background:var(--green)}.btn.b{background:var(--blue)}
.btn.on{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45);filter:brightness(1.3)}
#panel{position:absolute;inset:0;background:rgba(27,16,32,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;overflow:auto}
#panel h1{margin:0;font-size:21px;line-height:1.3}
#panel h1 small{display:block;font-size:13px;color:var(--gold);margin-top:2px}
#panel p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
#panel .rules{text-align:left;background:var(--panel);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--ink)}
#panel .rules b{color:var(--gold)}
.big{border:0;border-radius:14px;background:var(--cap);color:#fff;font-size:18px;font-weight:900;padding:12px 34px;box-shadow:0 5px 0 #7A1F16}
.sub{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font-size:14px;font-weight:700;padding:9px 18px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stats{display:grid;grid-template-columns:auto auto;gap:2px 16px;font-size:14px;font-weight:700}
.stats span:nth-child(odd){text-align:left;color:var(--muted)}
.stats span:nth-child(even){text-align:right}
.badge{font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:0 6px}
</style>
</head>
<body>
<div id="app">
  <header>
    <a href="../">← ちくわゲームズ</a>
    <span><span class="badge" id="ver"></span> <button id="mute" aria-label="音">🔊</button></span>
  </header>

  <div id="sceneWrap">
    <canvas id="scene" width="360" height="360"></canvas>
    <div id="hud">
      <div class="hudrow"><span>雲紅亭珍光</span><span id="pct">0%</span><span>ママ</span></div>
      <div class="bar"><i id="progfill"></i></div>
      <div class="hudrow" style="margin-top:4px"><span>お漏らし💦</span><span id="leaktxt">0% / 35%</span></div>
      <div class="bar" id="leakbar"><i id="leakfill"></i></div>
    </div>
    <div id="bubble" hidden></div>
    <div id="count" hidden></div>
  </div>

  <div id="bottom">
    <canvas id="lane"></canvas>
    <div id="btns">
      <button class="btn r" data-lane="0">あか<small>A / J / 1</small></button>
      <button class="btn g" data-lane="1">みどり<small>S / K / 2</small></button>
      <button class="btn b" data-lane="2">あお<small>D / L / 3</small></button>
    </div>
    <div id="panel"></div>
  </div>
</div>

<script src="../common/v1/core.js"></script>
<script src="../common/v1/share.js"></script>
<script>
'use strict';
/* =====================================================================
   いくいく！雲紅亭珍光〜すもう編〜  β0.1.1
   リズム（3レーン）で「押し出し！／はっけい！／お漏らし💦」を判定し、
   お相撲さんがシコを踏みながらママのもとへ進む。コードの地図は ikuiku-sumo/CLAUDE.md
   ===================================================================== */
const VERSION = 'β0.1.1';
CG.init({ game: 'ikuiku-sumo', title: 'いくいく！雲紅亭珍光〜すもう編〜', version: VERSION });

/* ---- 調整用の数値（バランスはここだけ直す） ---- */
const CFG = {
  BPM: 112,            // 曲の速さ（1拍＝4分音符）
  TRAVEL: 1.5,         // 上から判定線まで落ちる秒数
  LEAD_IN: 2.0,        // 最初のノーツが判定線に来るまでの秒数
  WIN_PERFECT: 0.075,  // 押し出し！になるずれ（秒）
  WIN_GOOD: 0.16,      // はっけい！になるずれ（秒）
  WIN_BAD: 0.26,       // これを超えると押せない／見逃しでお漏らし
  NOTE_PROB: 0.42,     // 8分音符ごとにノーツが出る確率
  GOAL: 100,           // ママに着く距離
  STEP_PERFECT: 3.2,   // 押し出し！で進む距離
  STEP_GOOD: 1.8,      // はっけい！で進む距離
  LEAK_LIMIT: 0.35,    // お漏らしの割合がこれを超えたらゲームオーバー
  LEAK_MIN: 10         // 判定がこの回数に達するまでは割合で終わらない
};
/* ---- セリフと音声（音声は後で吹き込む。ファイルを置いてパスを書けば鳴る） ---- */
const LINES = { success: 'ママ〜！ ぼく、ついたよ〜！', toilet: 'ま、まにあわなかった…！' };
const VOICE = { success: '', toilet: '' };   // 例：'./voice/success.mp3'
const LANES = [
  { name: 'あか', col: '#E8483A', key: ['a', 'j', '1'] },
  { name: 'みどり', col: '#3FB86B', key: ['s', 'k', '2'] },
  { name: 'あお', col: '#3F86E8', key: ['d', 'l', '3'] }
];
const JUDGE = {
  perfect: { text: '押し出し！', col: '#FFD15C' },
  good: { text: 'はっけい！', col: '#7BE39A' },
  leak: { text: 'お漏らし💦', col: '#6FB8FF' }
};
const KEY_MUTE = 'ikuiku-sumo-mute';
const KEY_BEST = 'ikuiku-sumo-best-v1';

const $ = s => document.querySelector(s);
const scene = $('#scene'), c = scene.getContext('2d');
const laneEl = $('#lane'), lc = laneEl.getContext('2d');
let muted = CG.ls.get(KEY_MUTE, '0') === '1';
$('#ver').textContent = VERSION;
$('#mute').textContent = muted ? '🔇' : '🔊';

/* ---------------- 音（Web Audio の簡単な効果音） ---------------- */
let ac = null;
function unlockAudio() {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; }
}
function tone(freq, dur, type = 'square', vol = 0.06, slide = 0) {
  if (muted || !ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) { }
}
const sfx = {
  perfect() { tone(180, .14, 'sawtooth', .09, -110); tone(880, .08, 'square', .05); },
  good() { tone(160, .12, 'sawtooth', .07, -90); tone(660, .06, 'square', .04); },
  leak() { tone(300, .25, 'triangle', .07, -200); },
  beat() { tone(110, .06, 'sine', .05, -40); },
  win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, .18, 'square', .06), i * 130)); },
  run() { tone(140, .07, 'sawtooth', .05, -50); },
  slam() { tone(90, .3, 'sawtooth', .1, -50); }
};
function playVoice(key) {
  if (muted || !VOICE[key]) return;
  try { const a = new Audio(VOICE[key]); a.play().catch(() => { }); } catch (e) { }
}

/* ---------------- ゲームの状態 ---------------- */
const nowSec = () => performance.now() / 1000;
const stepDur = () => 60 / CFG.BPM / 2;           // 8分音符の長さ
let S = null;                                      // 1プレイ分の状態
function fresh() {
  return {
    mode: 'title', t0: 0, notes: [], nextStep: 0, lastBeat: -1,
    prog: 0, shown: 0, judged: 0, leaks: 0, perfect: 0, good: 0, combo: 0, maxCombo: 0,
    parts: [], pops: [], phase: 0, shake: 0, stomp: 0, endAt: 0, hiddenAt: 0, bursts: []
  };
}
S = fresh();

/* ---------------- 画面（パネル） ---------------- */
function showPanel(html) { const p = $('#panel'); p.innerHTML = html; p.hidden = false; }
function hidePanel() { $('#panel').hidden = true; }
function titlePanel() {
  showPanel(`
    <h1>いくいく！雲紅亭珍光<small>〜すもう編〜</small></h1>
    <div class="rules">
      <b>あそびかた</b><br>
      ・上から流れてくる<b>色のバー</b>が下の線に来たら、同じ色のボタンを押す。<br>
      ・<b>押し出し！</b>と<b>はっけい！</b>で前に進む（押し出しのほうが大きく進む）。<br>
      ・<b>お漏らし💦</b>は進めず、塩をまく。割合が増えすぎるとトイレへダッシュ！<br>
      ・ママに着いたらクリア。
    </div>
    <button class="big" id="startBtn">スタート</button>
    <p>ベストの押し出し数：<span id="best">0</span>　／　キーボード：A S D（J K L / 1 2 3）</p>`);
  const b = CG.ls.getJSON(KEY_BEST, null);
  $('#best').textContent = b && b.perfect != null ? b.perfect : 0;
  $('#startBtn').onclick = startGame;
}

function startGame() {
  unlockAudio();
  hidePanel(); $('#bubble').hidden = true;
  S = fresh(); S.mode = 'count'; S.t0 = nowSec() + 3;   // 3・2・1 のあとが曲の 0 秒
  updateHud();
}

/* ---------------- ノーツの生成と判定 ---------------- */
function genNotes(st) {
  const sd = stepDur();
  while (CFG.LEAD_IN + S.nextStep * sd < st + CFG.TRAVEL + 0.6) {
    const t = CFG.LEAD_IN + S.nextStep * sd;
    const first = S.nextStep === 0;
    if (first || Math.random() < CFG.NOTE_PROB) {
      S.notes.push({ lane: Math.floor(Math.random() * 3), t, judged: false, missed: false });
    }
    S.nextStep++;
  }
}
function press(lane) {
  if (S.mode !== 'play') return;
  const st = nowSec() - S.t0;
  let best = null, bd = 9;
  for (const n of S.notes) {
    if (n.judged || n.lane !== lane) continue;
    const d = Math.abs(n.t - st);
    if (d < bd) { bd = d; best = n; }
  }
  if (best && bd <= CFG.WIN_BAD) {
    best.judged = true;
    judge(bd <= CFG.WIN_PERFECT ? 'perfect' : bd <= CFG.WIN_GOOD ? 'good' : 'leak', lane);
  } else {
    judge('leak', lane);      // ノーツが無いのに押した
  }
}
function judge(kind, lane, missed) {
  S.judged++;
  const sx = sumoX(), gy = GY;
  if (kind === 'leak') {
    S.leaks++; S.combo = 0; sfx.leak();
    spawnSalt(sx + 16, gy - 24);
  } else {
    S.prog = Math.min(CFG.GOAL, S.prog + (kind === 'perfect' ? CFG.STEP_PERFECT : CFG.STEP_GOOD));
    S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo);
    kind === 'perfect' ? (S.perfect++, sfx.perfect()) : (S.good++, sfx.good());
    S.phase ^= 1; S.shake = 0.12; S.stomp = 0.18;
    spawnDust(sx + (S.phase ? 4 : 16), gy);
  }
  S.pops.push({ kind, lane, age: 0 });
  updateHud();
  checkEnd();
}
function leakRatio() { return S.judged ? S.leaks / S.judged : 0; }
function checkEnd() {
  if (S.mode !== 'play') return;
  if (S.prog >= CFG.GOAL) { endSuccess(); return; }
  if (S.judged >= CFG.LEAK_MIN && leakRatio() > CFG.LEAK_LIMIT) endToilet();
}
function endSuccess() {
  S.mode = 'success'; S.endAt = nowSec();
  sfx.win(); playVoice('success');
  save();
  setTimeout(() => {
    if (S.mode !== 'success') return;
    $('#bubble').textContent = LINES.success; $('#bubble').hidden = false;
  }, 900);
  setTimeout(() => { if (S.mode === 'success') resultPanel(true); }, 2600);
}
function endToilet() {
  S.mode = 'toilet'; S.endAt = nowSec(); S.fromX = sumoX();
  playVoice('toilet'); save();
  setTimeout(() => { if (S.mode === 'toilet') resultPanel(false); }, 4200);
}
function save() {
  const b = CG.ls.getJSON(KEY_BEST, null) || { perfect: 0 };
  if (S.perfect > (b.perfect || 0)) CG.ls.setJSON(KEY_BEST, { perfect: S.perfect });
}
function resultPanel(ok) {
  showPanel(`
    <h1>${ok ? 'ママに到着！' : 'ゲームオーバー'}<small>${ok ? 'おめでとう！' : 'トイレに駆け込んだ…'}</small></h1>
    <div class="stats">
      <span>押し出し！</span><span>${S.perfect}回</span>
      <span>はっけい！</span><span>${S.good}回</span>
      <span>お漏らし💦</span><span>${S.leaks}回（${Math.round(leakRatio() * 100)}%）</span>
      <span>最大コンボ</span><span>${S.maxCombo}</span>
    </div>
    <div class="row"><button class="big" id="again">もう一回</button></div>
    <div class="row"><button class="sub" id="share">シェアする</button><button class="sub" id="toTitle">タイトルへ</button></div>`);
  $('#again').onclick = startGame;
  $('#toTitle').onclick = () => { S = fresh(); $('#bubble').hidden = true; updateHud(); titlePanel(); };
  $('#share').onclick = () => {
    const msg = ok
      ? `雲紅亭珍光がママのもとへたどり着いた！（押し出し${S.perfect}回・お漏らし${S.leaks}回）`
      : `雲紅亭珍光、トイレに間に合わなかった…（お漏らし${S.leaks}回）`;
    CG.share.open({ msg, tags: ['いくいく雲紅亭珍光'], url: CG.pageUrl() });
  };
}

/* ---------------- パーティクル ---------------- */
function spawnSalt(x, y) {
  for (let i = 0; i < 16; i++) S.parts.push({ x, y, vx: 18 + Math.random() * 40, vy: -45 + Math.random() * 25, g: 120, life: 0.9, col: '#FFFFFF', s: 1 });
  for (let i = 0; i < 4; i++) S.parts.push({ x: x - 8, y: y - 8, vx: -10 - Math.random() * 14, vy: -20 - Math.random() * 15, g: 90, life: 0.7, col: '#8FD0FF', s: 1 });
}
function spawnDust(x, y) {
  for (let i = 0; i < 6; i++) S.parts.push({ x, y: y - 1, vx: (Math.random() - 0.5) * 30, vy: -10 - Math.random() * 14, g: 40, life: 0.4, col: '#E9D3A0', s: 1 });
}
function spawnHeart(x, y) {
  S.parts.push({ x, y, vx: (Math.random() - 0.5) * 10, vy: -16 - Math.random() * 8, g: 0, life: 1.6, col: '#FF6F9C', s: 2, heart: true });
}

/* ---------------- HUD ---------------- */
function updateHud() {
  const pr = Math.round(S.prog / CFG.GOAL * 100);
  $('#progfill').style.width = pr + '%';
  $('#pct').textContent = pr + '%';
  const lr = Math.round(leakRatio() * 100), lim = Math.round(CFG.LEAK_LIMIT * 100);
  $('#leaktxt').textContent = lr + '% / ' + lim + '%';
  $('#leakfill').style.width = Math.min(100, lr / lim * 100) + '%';
}

/* ---------------- 入力 ---------------- */
document.querySelectorAll('.btn').forEach(b => {
  const lane = +b.dataset.lane;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('on'); unlockAudio(); press(lane); });
  const off = () => b.classList.remove('on');
  b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
});
laneEl.addEventListener('pointerdown', e => {   // レーンの上をタップしても押せる
  const r = laneEl.getBoundingClientRect(), lane = Math.min(2, Math.max(0, Math.floor((e.clientX - r.left) / r.width * 3)));
  const b = document.querySelector('.btn[data-lane="' + lane + '"]'); b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 90);
  unlockAudio(); press(lane);
});
addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey) return;
  const k = e.key.toLowerCase(), lane = LANES.findIndex(l => l.key.includes(k));
  if (lane < 0) return;
  const b = document.querySelector('.btn[data-lane="' + lane + '"]'); b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 90);
  unlockAudio(); press(lane);
});
$('#mute').onclick = () => { muted = !muted; CG.ls.set(KEY_MUTE, muted ? '1' : '0'); $('#mute').textContent = muted ? '🔇' : '🔊'; };
document.addEventListener('visibilitychange', () => {   // タブを離れたら時間を止める
  if (document.hidden) S.hiddenAt = nowSec();
  else if (S.hiddenAt) { S.t0 += nowSec() - S.hiddenAt; S.endAt && (S.endAt += nowSec() - S.hiddenAt); S.hiddenAt = 0; }
});

/* ======================= 描画：シーン（120×120 のドットを3倍） ======================= */
const GY = 98;                                   // 足もとの高さ
const sumoX = () => Math.round(10 + S.shown / CFG.GOAL * 62);
function R(x, y, w, h, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }

function drawBg(t) {
  const g = c.createLinearGradient(0, 0, 0, 80); g.addColorStop(0, '#2A1830'); g.addColorStop(1, '#4A2A38');
  c.fillStyle = g; c.fillRect(0, 0, 120, 82);
  for (let i = 0; i < 15; i++) R(i * 8, 34, 8, 40, i % 2 ? '#6E2433' : '#561B28');          // 幕
  R(0, 32, 120, 3, '#2A1218'); R(0, 74, 120, 2, '#2A1218');
  [20, 60, 100].forEach((x, i) => {                                                         // 提灯
    const sw = Math.round(Math.sin(t * 1.5 + i) * 1);
    R(x + 5 + sw, 0, 1, 7, '#8A6A50'); R(x + sw, 7, 11, 11, '#E8483A'); R(x + 1 + sw, 18, 9, 1, '#B02A1E'); R(x + 2 + sw, 10, 7, 1, '#FF8A70'); R(x + 3 + sw, 12, 5, 4, '#FFE0A0');
  });
  R(0, 76, 120, 36, '#C9A468');                                                              // 土俵
  R(0, 76, 120, 2, '#E3C58C'); R(0, 108, 120, 12, '#3A2418');
  for (let i = 0; i < 12; i++) R(i * 10 + 3, 109, 4, 1, '#5A3A28');
  R(44, 100, 6, 1, '#FFFFFF'); R(70, 100, 6, 1, '#FFFFFF');                                  // 仕切り線
  [0, 114].forEach(x => { R(x, 82, 6, 24, '#8A5A2B'); R(x, 82, 6, 2, '#B07A3E'); R(x + 1, 90, 4, 1, '#6B4420'); R(x + 1, 98, 4, 1, '#6B4420'); }); // 俵
}

function drawSumo(x, gy, o) {
  const SK = '#EDBB8E', SH = '#C98F62', MW = '#C9B08A', ph = o.phase | 0, lift = o.lift || 0;
  const yb = gy - 38 + (o.bob || 0);
  const lL = ph === 0 ? lift : 0, lR = ph === 1 ? lift : 0;
  // 足
  R(x + 3, gy - 8 - lL, 6, 8, SK); R(x + 2, gy - 2 - lL, 8, 2, SH);
  R(x + 13, gy - 8 - lR, 6, 8, SK); R(x + 12, gy - 2 - lR, 8, 2, SH);
  // 腕
  const up = o.arms === 'up';
  R(x - 1, up ? yb + 9 : yb + 17, 3, up ? 9 : 10, SK); R(x + 20, up ? yb + 9 : yb + 17, 3, up ? 9 : 10, SK);
  // おなか
  const W = [14, 18, 20, 22, 22, 22, 22, 22, 22, 22, 21, 20, 20, 20, 20, 20];
  W.forEach((w, i) => R(x + (22 - w) / 2, yb + 16 + i, w, 1, SK));
  R(x + 6, yb + 20, 3, 2, '#FFE0C0'); R(x + 11, yb + 24, 1, 2, SH);
  // まわし：チョコチップ迷彩（茶色のまだら＋白い点）
  R(x + 1, yb + 28, 20, 5, MW); R(x + 9, yb + 33, 4, 5, MW);
  [[2, 29, 4, 2], [8, 30, 5, 2], [14, 28, 5, 2], [17, 31, 3, 2], [10, 34, 3, 2], [4, 32, 3, 1]].forEach(([a, b, w, h]) => R(x + a, yb + b, w, h, '#8A6A4A'));
  [[5, 28, 1, 1], [11, 29, 1, 1], [16, 30, 1, 1], [3, 31, 1, 1], [13, 32, 1, 1], [19, 29, 1, 1], [10, 35, 1, 1], [7, 31, 1, 1]].forEach(([a, b, w, h]) => R(x + a, yb + b, w, h, '#F4EFE4'));
  // 頭とキャップ
  // 頭：短い黒髪・黒いキャップ（カラフルなロゴ）・丸い黒縁メガネ・笑顔（モデルの写真をデフォルメ）
  const HAIR = '#1E1A18', FR = '#26262C';
  R(x + 5, yb + 4, 12, 12, SK); R(x + 4, yb + 8, 1, 3, SK); R(x + 17, yb + 8, 1, 3, SK);
  R(x + 4, yb + 6, 2, 4, HAIR); R(x + 16, yb + 6, 1, 3, HAIR);                                     // 耳まわりの短い髪
  R(x + 4, yb, 14, 6, '#2B2F36'); R(x + 16, yb + 5, 6, 2, '#1A1D22'); R(x + 10, yb - 1, 2, 1, '#1A1D22');   // キャップ（つばは右向き）
  R(x + 8, yb + 1, 1, 2, '#F2A33A'); R(x + 9, yb + 1, 2, 2, '#E8483A'); R(x + 11, yb + 1, 1, 2, '#3FB8A8'); R(x + 10, yb + 3, 2, 1, '#F4EFE4'); // ロゴ
  R(x + 7, yb + 12, 2, 1, '#E89A82'); R(x + 14, yb + 12, 2, 1, '#E89A82');                          // ほっぺ
  [6, 12].forEach(gx => { R(x + gx, yb + 8, 4, 1, FR); R(x + gx, yb + 11, 4, 1, FR); R(x + gx, yb + 9, 1, 2, FR); R(x + gx + 3, yb + 9, 1, 2, FR); R(x + gx + 1, yb + 9, 2, 2, 'rgba(255,255,255,.35)'); }); // 丸メガネ
  R(x + 10, yb + 9, 2, 1, FR);                                                                      // ブリッジ
  const E = '#2A1A10';
  if (o.mood === 'happy') { [7, 13].forEach(ex => { R(x + ex, yb + 10, 1, 1, E); R(x + ex + 1, yb + 9, 1, 1, E); R(x + ex + 2, yb + 10, 1, 1, E); }); R(x + 9, yb + 13, 6, 3, '#8A3A2A'); R(x + 9, yb + 13, 6, 1, '#FFFFFF'); R(x + 11, yb + 15, 2, 1, '#E86A6A'); }
  else if (o.mood === 'panic') { R(x + 7, yb + 9, 1, 1, E); R(x + 8, yb + 10, 1, 1, E); R(x + 7, yb + 11, 1, 1, E); R(x + 15, yb + 9, 1, 1, E); R(x + 14, yb + 10, 1, 1, E); R(x + 15, yb + 11, 1, 1, E); R(x + 10, yb + 13, 3, 3, '#8A3A2A'); R(x + 18, yb + 3, 1, 3, '#8FD0FF'); }
  else { R(x + 7, yb + 10, 1, 1, E); R(x + 8, yb + 10, 1, 1, E); R(x + 13, yb + 10, 1, 1, E); R(x + 14, yb + 10, 1, 1, E); R(x + 9, yb + 13, 5, 1, '#FFFFFF'); R(x + 10, yb + 14, 3, 1, '#8A3A2A'); } // にっこり（歯が見える）
}

function drawMama(x, gy, o) {
  const SKN = '#F8D5BE', HR = '#5A3322', DR = '#F28FB0', y0 = gy - 36, t = o.t || 0, wave = o.mood !== 'idle';
  R(x + 1, y0 + 2, 14, 22, HR); R(x, y0 + 14, 3, 14, HR); R(x + 13, y0 + 14, 3, 14, HR);   // ロングヘア
  R(x + 3, y0 + 4, 10, 9, SKN); R(x + 3, y0 + 3, 10, 3, HR); R(x + 3, y0 + 5, 2, 2, HR); R(x + 11, y0 + 5, 2, 2, HR);
  R(x + 5, y0 + 8, 1, 2, '#2A1A10'); R(x + 10, y0 + 8, 1, 2, '#2A1A10'); R(x + 4, y0 + 7, 1, 1, '#2A1A10'); R(x + 11, y0 + 7, 1, 1, '#2A1A10');
  R(x + 4, y0 + 10, 2, 1, '#F2A0A0'); R(x + 10, y0 + 10, 2, 1, '#F2A0A0'); R(x + 7, y0 + 11, 2, 1, '#D8404F');
  R(x + 11, y0 + 1, 4, 3, '#FF7FA8'); R(x + 10, y0 + 2, 1, 1, '#FF7FA8'); R(x + 15, y0 + 2, 1, 1, '#FF7FA8');  // リボン
  R(x + 7, y0 + 13, 2, 2, SKN);
  R(x + 4, y0 + 15, 8, 10, DR);                                                                          // ワンピース
  for (let i = 0; i < 9; i++) { const w = 8 + i; R(x + 8 - w / 2, y0 + 25 + i, w, 1, DR); }
  R(x + 6, y0 + 18, 4, 14, '#FFFFFF'); R(x + 6, y0 + 18, 4, 1, '#E6E6E6');                                 // エプロン
  R(x + 6, y0 + 34, 2, 2, SKN); R(x + 9, y0 + 34, 2, 2, SKN); R(x + 5, y0 + 36, 3, 1, '#8A3A4A'); R(x + 9, y0 + 36, 3, 1, '#8A3A4A');
  R(x + 2, y0 + 16, 2, 8, SKN);                                                                           // 左うで
  const up = wave && Math.floor(t * 4) % 2 === 0;
  R(x + 12, up ? y0 + 8 : y0 + 16, 2, up ? 9 : 8, SKN);                                                     // 右うで（手をふる）
}

function drawParts(dt) {
  S.parts = S.parts.filter(p => (p.life -= dt) > 0);
  S.parts.forEach(p => {
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.heart) { R(p.x, p.y, 1, 1, p.col); R(p.x + 2, p.y, 1, 1, p.col); R(p.x - 1, p.y + 1, 5, 1, p.col); R(p.x, p.y + 2, 3, 1, p.col); R(p.x + 1, p.y + 3, 1, 1, p.col); }
    else R(p.x, p.y, p.s, p.s, p.col);
  });
}

function drawToilet(tt) {
  // 廊下とトイレ
  const g = c.createLinearGradient(0, 0, 0, 82); g.addColorStop(0, '#2C3A50'); g.addColorStop(1, '#46566E'); c.fillStyle = g; c.fillRect(0, 0, 120, 82);
  R(0, 76, 120, 36, '#B8C0CC'); R(0, 76, 120, 2, '#DDE3EA');
  for (let i = 0; i < 12; i++) R(i * 10, 80, 1, 28, '#9AA3B0'); R(0, 108, 120, 12, '#2A3140');
  R(86, 36, 30, 44, '#5C6B84'); R(88, 40, 26, 40, '#2A3140');                                  // 入口
  const open = tt > 1.7 && tt < 2.4;
  R(90, 42, 22, 38, open ? '#10151E' : '#7FB6E8'); if (!open) { R(91, 43, 20, 1, '#A9D2F5'); R(108, 60, 2, 3, '#FFD15C'); }
  R(90, 25, 22, 10, '#FFFFFF'); R(91, 26, 20, 8, '#3F86E8');                                    // 看板
  c.fillStyle = '#FFFFFF'; c.font = 'bold 6px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('トイレ', 101, 30);
}

/* ---------------- 毎フレーム ---------------- */
let last = performance.now() / 1000;
function frame() {
  const now = nowSec(), dt = Math.min(0.05, now - last); last = now;
  const st = now - S.t0;

  // 進行
  if (S.mode === 'count') {
    const left = -st;
    if (left <= 0) { S.mode = 'play'; $('#count').hidden = true; }
    else { const n = Math.ceil(left); const el = $('#count'); el.hidden = false; el.textContent = n; }
  }
  if (S.mode === 'play') {
    genNotes(st);
    for (const n of S.notes) {
      if (!n.judged && st - n.t > CFG.WIN_BAD) { n.judged = true; n.missed = true; judge('leak', n.lane, true); if (S.mode !== 'play') break; }
    }
    const beat = Math.floor((st - CFG.LEAD_IN) / (60 / CFG.BPM));
    if (st >= CFG.LEAD_IN - 1 && beat !== S.lastBeat) { S.lastBeat = beat; sfx.beat(); }
    S.notes = S.notes.filter(n => st - n.t < 1.2);
  }
  S.shown += (S.prog - S.shown) * Math.min(1, dt * 8);
  S.shake = Math.max(0, S.shake - dt); S.stomp = Math.max(0, S.stomp - dt);
  S.pops.forEach(p => p.age += dt); S.pops = S.pops.filter(p => p.age < 0.7);

  drawScene(now, dt);
  drawLane(st);
  requestAnimationFrame(frame);
}

function drawScene(now, dt) {
  c.setTransform(3, 0, 0, 3, 0, 0); c.imageSmoothingEnabled = false;
  c.clearRect(0, 0, 120, 120);
  const tt = S.mode === 'toilet' ? now - S.endAt : 0;
  let sx = 0, sy = 0;
  if (S.shake > 0) { sx = Math.round((Math.random() - 0.5) * 2); sy = Math.round((Math.random() - 0.5) * 2); }
  c.save(); c.translate(sx, sy);

  if (S.mode === 'toilet') {
    drawToilet(tt);
    const gx = 70;                                                                           // トイレの前
    const p = Math.min(1, tt / 1.7), e = p * p * (3 - 2 * p);
    const x = S.fromX + (gx - S.fromX) * e, run = Math.floor(tt * 14) % 2;
    if (tt < 1.9) {
      for (let i = 0; i < 4; i++) R(x - 6 - i * 5 - (Math.floor(tt * 30) % 3) * 2, GY - 30 + i * 7, 8, 1, 'rgba(255,255,255,.55)');   // 走るスピード線
      drawSumo(x, GY, { phase: run, lift: 4, bob: -Math.abs(Math.sin(tt * 14)) * 2, mood: 'panic', arms: run ? 'up' : '' });
      if (Math.floor(tt * 14) !== S.lastRun) { S.lastRun = Math.floor(tt * 14); sfx.run(); }
    } else if (tt < 2.4) {
      const k = (tt - 1.9) / 0.5; drawSumo(x + 18 * k, GY, { phase: 0, mood: 'panic', bob: -2 * k });
      c.globalAlpha = 1;
    } else {
      if (!S.slammed) { S.slammed = true; sfx.slam(); S.shake = 0.3; }
      c.fillStyle = '#FFD15C'; c.font = 'bold 9px sans-serif'; c.textAlign = 'center'; c.fillText('ガチャッ！', 60, 50);
      if (tt > 3 && tt < 4.1) { c.font = 'bold 7px sans-serif'; c.fillStyle = '#FFFFFF'; c.fillText(LINES.toilet, 60, 64); }
    }
    c.restore(); return;
  }

  drawBg(now);
  const x = sumoX();
  const ending = S.mode === 'success';
  const mx = 98;
  drawMama(mx, GY, { t: now, mood: ending ? 'happy' : 'idle' });
  const walking = S.stomp > 0;
  const mood = ending ? 'happy' : (leakRatio() > CFG.LEAK_LIMIT * 0.8 && S.judged >= CFG.LEAK_MIN ? 'panic' : 'normal');
  drawSumo(x, GY, { phase: S.phase, lift: walking ? 4 : 0, bob: walking ? -1 : Math.round(Math.sin(now * 3)), arms: ending ? 'up' : (walking ? 'up' : ''), mood });
  if (ending && Math.random() < 0.15) spawnHeart(mx + 4 + Math.random() * 10, GY - 40);
  drawParts(dt);
  c.restore();
}

/* ======================= 描画：レーン ======================= */
function sizeLane() {
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = laneEl.clientWidth, h = laneEl.clientHeight;
  if (laneEl.width !== Math.round(w * dpr) || laneEl.height !== Math.round(h * dpr)) { laneEl.width = Math.round(w * dpr); laneEl.height = Math.round(h * dpr); }
  lc.setTransform(laneEl.width / w, 0, 0, laneEl.height / h, 0, 0);
  return { w, h };
}
function drawLane(st) {
  const { w, h } = sizeLane(), lw = w / 3, hitY = h - 28, nh = 20;
  lc.fillStyle = '#150C1A'; lc.fillRect(0, 0, w, h);
  LANES.forEach((L, i) => {
    lc.fillStyle = L.col + '22'; lc.fillRect(i * lw, 0, lw, h);
    lc.fillStyle = 'rgba(255,255,255,.08)'; lc.fillRect(i * lw, 0, 1, h);
    lc.strokeStyle = L.col; lc.lineWidth = 3; lc.globalAlpha = .9;
    rr(i * lw + 8, hitY - nh / 2 - 2, lw - 16, nh + 4, 8); lc.stroke(); lc.globalAlpha = 1;
  });
  for (const n of S.notes) {
    const y = hitY - (n.t - st) / CFG.TRAVEL * hitY;
    if (n.judged && !n.missed) continue;
    if (y < -nh || y > h + nh) continue;
    lc.globalAlpha = n.missed ? .3 : 1;
    lc.fillStyle = n.missed ? '#6B6B78' : LANES[n.lane].col;
    rr(n.lane * lw + 12, y - nh / 2, lw - 24, nh, 8); lc.fill();
    if (!n.missed) { lc.fillStyle = 'rgba(255,255,255,.35)'; rr(n.lane * lw + 16, y - nh / 2 + 3, lw - 32, 5, 3); lc.fill(); }
    lc.globalAlpha = 1;
  }
  lc.textAlign = 'center'; lc.textBaseline = 'middle'; lc.font = '800 17px "Hiragino Sans","Noto Sans JP",sans-serif';
  S.pops.forEach(p => {
    const J = JUDGE[p.kind], a = 1 - p.age / 0.7;
    lc.globalAlpha = a; lc.lineWidth = 4; lc.strokeStyle = '#000'; lc.fillStyle = J.col;
    const px = p.lane * lw + lw / 2, py = hitY - 34 - p.age * 40;
    lc.strokeText(J.text, px, py); lc.fillText(J.text, px, py); lc.globalAlpha = 1;
  });
}
function rr(x, y, w, h, r) { lc.beginPath(); lc.moveTo(x + r, y); lc.arcTo(x + w, y, x + w, y + h, r); lc.arcTo(x + w, y + h, x, y + h, r); lc.arcTo(x, y + h, x, y, r); lc.arcTo(x, y, x + w, y, r); lc.closePath(); }

/* ---------------- 起動 ---------------- */
titlePanel(); updateHud(); requestAnimationFrame(frame);
window.__IKU = { get S() { return S; }, CFG, press, startGame, nowSec };   // テスト用（dev/test.py）
</script>
