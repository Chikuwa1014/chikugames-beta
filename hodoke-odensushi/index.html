<style>
:root{--bg:#2a1a10;--panel:#3b2616;--ink:#fbeed7;--sub:#cfae83;--accent:#e9a55b;--accent2:#c9772e;--bad:#e5533d;--cg-accent:#e9a55b}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-touch-callout:none}
button,.modal{-webkit-user-select:none;user-select:none;touch-action:pan-x pan-y}

input,textarea,select{font-size:16px!important}
header{display:flex;align-items:center;gap:8px;padding:6px 12px;height:40px;flex:none}

.btn{border:0;border-radius:12px;padding:11px 18px;font-size:15px;font-weight:700;background:var(--accent);color:#3b2616;cursor:pointer}

<body>
<header><a href="../">← ちくわゲームズ</a><span class="ttl">ほどけ！おでん串</span></header>
<div class="hud">
  <span>スコア <b id="sc">0</b></span>
  <span>Lv <b id="lv">1</b></span>
  <div class="fire" id="fireWrap"><i id="fire"></i></div>
</div>
<div class="stage"><canvas id="cv" width="720" height="1128"></canvas></div>
<div class="bar">
  <button class="btn sub" id="hintBtn">💡 ヒント <span id="hintN">3</span></button>
</div>

<div class="modal" id="mTitle">
  <div class="mbox">
    <h1>ほどけ！おでん串</h1>
    <p>絡まった串をほどいて、鍋にどんどん入れよう。</p>
    <div class="rule">
      ・串をタップすると、持ち手の方向へ引き抜けます（矢印の向き）<br>
      ・上に重なっている串や、進む先にある串があると抜けません<br>
      ・<b>結び目つき</b>（赤いひも）は、どれかと交差しているあいだは動きません<br>
      ・同じ具をつづけて入れる／定番の組み合わせでボーナス<br>
      ・火力ゲージが切れたら終わり。抜けない串をタップすると火力が減ります
    </div>
    <p>ベスト <b id="tBest">0</b> 点</p>
    <div class="row"><button class="btn" id="startBtn">はじめる</button></div>
  </div>
</div>

<div class="modal" id="mOver" hidden>
  <div class="mbox">
    <h2>火が消えちゃった…</h2>
    <div class="big" id="oScore">0</div>
    <p id="oInfo"></p>
    <div class="row">
      <button class="btn" id="againBtn">もう一回</button>
      <button class="btn sub" id="shareBtn">シェア</button>
    </div>
    <div id="move"></div>
    <details><summary>更新履歴</summary>
      <p>β0.1.0（2026-11-01）最初の試作。串・結び目・具のボーナス・終わらない盤面。</p>
    </details>
  </div>
</div>

<script src="../common/v1/core.js"></script>
<script src="../common/v1/share.js"></script>
<script src="../common/v1/save.js"></script>
<script src="../common/v1/move.js"></script>
<script>
(() => {
'use strict';
const VERSION = 'β0.1.0';
const KEY_BEST = 'hodoke-odensushi-best-v1';
CG.init({ game: 'hodoke-odensushi', title: 'ほどけ！おでん串', version: VERSION });
try { CG.move.mount(document.getElementById('move'), { keys: [KEY_BEST] }); } catch (e) {}

/* ---- 画面の拡大を止める（共通ルール 19 章） ---- */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('touchstart', e => { if (e.touches.length > 1 && e.target.closest && e.target.closest('.modal')) e.preventDefault(); }, { passive: false });

/* ---- 調整用の数値 ---- */
const W = 360, H = 564;            // 盤面の論理サイズ
const PLAY_BOTTOM = 506;           // これより下は鍋の帯
const MARGIN = 22;
const R_THIN = 4, R_THICK = 7.5;   // 串の太さ（半径）
const LEN_MIN = 100, LEN_MAX = 190;
const FIRE_PULL = 12, FIRE_MISS = 8;
const PULLS_PER_LEVEL = 10;
const ITEMS = ['大根', '卵', 'こんにゃく', 'ちくわ', 'はんぺん'];
const RECIPES = [
  { a: 0, b: 1, name: '定番の味', pt: 30 },
  { a: 2, b: 3, name: '横丁コンビ', pt: 40 },
  { a: 4, b: 0, name: 'しみしみ', pt: 25 },
];
const targetCount = lv => Math.min(7 + lv, 15);
const drainRate = lv => Math.min(3 + 0.5 * (lv - 1), 9);
const pThick = lv => Math.min(0.12 + 0.05 * lv, 0.45);
const pKnot = lv => lv < 3 ? 0 : Math.min(0.05 + 0.04 * (lv - 3), 0.3);

/* ---- 幾何 ---- */
function cross(ax, ay, bx, by) { return ax * by - ay * bx; }
function ptSegDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}
function segsCross(a, b, c, d) {
  const d1 = cross(b.x - a.x, b.y - a.y, c.x - a.x, c.y - a.y), d2 = cross(b.x - a.x, b.y - a.y, d.x - a.x, d.y - a.y);
  const d3 = cross(d.x - c.x, d.y - c.y, a.x - c.x, a.y - c.y), d4 = cross(d.x - c.x, d.y - c.y, b.x - c.x, b.y - c.y);
  return d1 * d2 < 0 && d3 * d4 < 0;
}
function segDist(a, b, c, d) {
  if (segsCross(a, b, c, d)) return 0;
  return Math.min(ptSegDist(a.x, a.y, c.x, c.y, d.x, d.y), ptSegDist(b.x, b.y, c.x, c.y, d.x, d.y),
    ptSegDist(c.x, c.y, a.x, a.y, b.x, b.y), ptSegDist(d.x, d.y, a.x, a.y, b.x, b.y));
}

/* ---- 串 ---- */
// A：持ち手（ここへ向かって抜ける）、B：具のついた先。z が大きいほど上に重なっている
let uid = 1;
function mk(ax, ay, bx, by, r, z, knot, item) {
  return { id: uid++, A: { x: ax, y: ay }, B: { x: bx, y: by }, r, z, knot, item, born: 0 };
}
function blockers(s, list) {
  const dx = s.A.x - s.B.x, dy = s.A.y - s.B.y, l = Math.hypot(dx, dy) || 1;
  const F = { x: s.A.x + dx / l * 2000, y: s.A.y + dy / l * 2000 };
  const out = [];
  for (const o of list) {
    if (o === s) continue;
    const rr = s.r + o.r;
    if (s.knot && segDist(s.A, s.B, o.A, o.B) < rr) { out.push(o); continue; }       // 結び目：交差があると動かない
    if (segDist(o.A, o.B, s.A, F) < rr + 1) { out.push(o); continue; }               // 進む先に串がある
    if (o.z > s.z && segDist(o.A, o.B, s.B, s.A) < rr) out.push(o);                  // 上に重なっている
  }
  return out;
}
function solvable(list) {
  let rest = list.slice();
  for (;;) {
    if (!rest.length) return true;
    const k = rest.findIndex(s => blockers(s, rest).length === 0);
    if (k < 0) return false;
    rest.splice(k, 1);
  }
}
function randomSkewer(lv, zTop) {
  const L = LEN_MIN + Math.random() * (LEN_MAX - LEN_MIN), ang = Math.random() * Math.PI * 2;
  const cx = MARGIN + Math.random() * (W - 2 * MARGIN), cy = MARGIN + Math.random() * (PLAY_BOTTOM - 2 * MARGIN);
  const hx = Math.cos(ang) * L / 2, hy = Math.sin(ang) * L / 2;
  const ax = cx + hx, ay = cy + hy, bx = cx - hx, by = cy - hy;
  const ok = v => v >= MARGIN - 4;
  if (!ok(ax) || !ok(bx) || ax > W - MARGIN + 4 || bx > W - MARGIN + 4 || !ok(ay) || !ok(by) || ay > PLAY_BOTTOM - 8 || by > PLAY_BOTTOM - 8) return null;
  const thick = Math.random() < pThick(lv);
  return mk(ax, ay, bx, by, thick ? R_THICK : R_THIN, Math.random() * zTop, false, Math.floor(Math.random() * ITEMS.length));
}
/** いまの盤面に、解ける串を足す。足せなければ null */
function genOne(list, lv) {
  for (let n = 0; n < 400; n++) {
    const s = randomSkewer(lv, 1);
    if (!s) continue;
    const touches = list.filter(o => segDist(s.A, s.B, o.A, o.B) < s.r + o.r + 2);
    if (list.length && n < 250 && !touches.length) continue;           // なるべく絡ませる
    if (touches.some(o => Math.abs(o.z - s.z) < 0.02)) continue;
    if (Math.random() < pKnot(lv) && touches.length) s.knot = true;
    if (solvable(list.concat(s))) return s;
  }
  return null;
}

/* ---- ゲームの状態 ---- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const G = { mode: 'title', sk: [], outs: [], pops: [], flash: new Map(), shake: new Map(), score: 0, pulled: 0, level: 1, fire: 100, hints: 3,
  chain: 0, last: -1, pot: [], hint: null, hintT: 0, t: 0, best: parseInt(CG.ls.get(KEY_BEST, '0'), 10) || 0 };

function fill(now) {
  let guard = 0;
  while (G.sk.length < targetCount(G.level) && guard++ < 40) {
    const s = genOne(G.sk, G.level);
    if (!s) break;
    s.born = now;
    G.sk.push(s);
  }
}
function reset() {
  Object.assign(G, { sk: [], outs: [], pops: [], score: 0, pulled: 0, level: 1, fire: 100, hints: 3, chain: 0, last: -1, pot: [], hint: null });
  G.flash.clear(); G.shake.clear();
  fill(G.t - 1);
  hud();
}
function hud() {
  $('sc').textContent = G.score; $('lv').textContent = G.level; $('hintN').textContent = G.hints;
  $('hintBtn').disabled = G.hints <= 0 || G.mode !== 'play';
  const f = Math.max(0, G.fire) / 100;
  $('fire').style.transform = 'scaleX(' + f + ')';
  $('fireWrap').classList.toggle('low', f < 0.25);
}

function pop(x, y, text, col) { G.pops.push({ x, y, text, col, t: G.t }); }
function pull(s) {
  const idx = G.sk.indexOf(s);
  if (idx < 0) return;
  G.sk.splice(idx, 1);
  G.outs.push({ s, t: G.t });
  G.pulled++;
  G.level = 1 + Math.floor(G.pulled / PULLS_PER_LEVEL);
  // 得点：同じ具のつづけて＝連鎖、定番の組み合わせ＝ボーナス
  G.chain = (G.last === s.item) ? G.chain + 1 : 1;
  let pts = (10 + (s.r > R_THIN ? 5 : 0) + (s.knot ? 10 : 0)) * G.chain;
  let msg = G.chain > 1 ? G.chain + '連鎖！' : '';
  const rc = G.last >= 0 && RECIPES.find(r => (r.a === G.last && r.b === s.item) || (r.b === G.last && r.a === s.item));
  if (rc && G.last !== s.item) { pts += rc.pt; msg = rc.name + '！'; }
  G.score += pts;
  pop(s.B.x, s.B.y - 10, '+' + pts, '#ffe08a');
  if (msg) pop(W / 2, 250, msg, '#ffb36b');
  G.last = s.item;
  G.pot.push(s.item); if (G.pot.length > 8) G.pot.shift();
  G.fire = Math.min(100, G.fire + FIRE_PULL);
  G.hint = null;
  fill(G.t);
  hud();
}
function miss(s, bl) {
  G.fire -= FIRE_MISS;
  G.shake.set(s.id, G.t);
  bl.forEach(o => G.flash.set(o.id, G.t));
  G.chain = 0; G.last = -1;
  hud();
}

/* ---- 入力 ---- */
cv.addEventListener('pointerdown', e => {
  if (G.mode !== 'play') return;
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  let best = null;
  for (const s of G.sk) {
    if (ptSegDist(x, y, s.A.x, s.A.y, s.B.x, s.B.y) < s.r + 12 && (!best || s.z > best.z)) best = s;
  }
  if (!best) return;
  const bl = blockers(best, G.sk);
  if (bl.length) miss(best, bl); else pull(best);
});
$('hintBtn').addEventListener('click', () => {
  if (G.mode !== 'play' || G.hints <= 0) return;
  const ok = G.sk.filter(s => blockers(s, G.sk).length === 0);
  if (!ok.length) return;
  G.hint = ok[Math.floor(Math.random() * ok.length)];
  G.hintT = G.t; G.hints--; hud();
});
function start() {
  reset(); G.mode = 'play';
  $('mTitle').hidden = true; $('mOver').hidden = true;
  hud();
}
$('startBtn').addEventListener('click', start);
$('againBtn').addEventListener('click', start);
$('shareBtn').addEventListener('click', () => {
  try { CG.share.open({ msg: 'ほどけ！おでん串で ' + G.score + '点（Lv' + G.level + '）！', tags: ['ほどけおでん串'], url: CG.pageUrl() }); } catch (e) {}
});
function over() {
  G.mode = 'over';
  const rec = G.score > G.best;
  if (rec) { G.best = G.score; CG.ls.set(KEY_BEST, String(G.best)); }
  $('oScore').textContent = G.score;
  $('oInfo').innerHTML = 'Lv' + G.level + ' ／ ' + G.pulled + '本ほどいた<br>' + (rec ? '<span class="new">ベスト更新！</span>' : 'ベスト ' + G.best + '点');
  $('tBest').textContent = G.best;
  $('mOver').hidden = false;
  hud();
}
$('tBest').textContent = G.best;

/* ---- 描画 ---- */
function itemPath(type, x, y, ang, t) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  if (t) ctx.globalAlpha *= t;
  if (type === 0) {            // 大根
    ctx.fillStyle = '#f4ecd8'; ctx.strokeStyle = '#cdb98f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 9, 0, 7); ctx.stroke();
  } else if (type === 1) {     // 卵
    ctx.fillStyle = '#fff8ea'; ctx.strokeStyle = '#d8c6a0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 17, 13, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f2b23a'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill();
  } else if (type === 2) {     // こんにゃく
    ctx.fillStyle = '#5a6070'; ctx.strokeStyle = '#3a3f4c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-14, -14); ctx.lineTo(16, 0); ctx.lineTo(-14, 14); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#8a90a0'; [[-4, -4], [0, 3], [-8, 5]].forEach(([a, b]) => ctx.fillRect(a, b, 2, 2));
  } else if (type === 3) {     // ちくわ
    ctx.fillStyle = '#d99a52'; ctx.strokeStyle = '#a8692a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-17, -9, 34, 18, 9); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4a2a14'; ctx.beginPath(); ctx.ellipse(-12, 0, 3, 5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#f2c98a'; ctx.fillRect(-5, -6, 14, 3);
  } else {                     // はんぺん
    ctx.fillStyle = '#fbf3e6'; ctx.strokeStyle = '#d8c6a0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-14, 13); ctx.lineTo(0, -15); ctx.lineTo(14, 13); ctx.closePath(); ctx.lineJoin = 'round'; ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function drawSkewer(s, off, alpha, flash, hint) {
  const ox = off ? off.x : 0, oy = off ? off.y : 0;
  const ax = s.A.x + ox, ay = s.A.y + oy, bx = s.B.x + ox, by = s.B.y + oy;
  const ang = Math.atan2(by - ay, bx - ax);
  ctx.save(); ctx.globalAlpha = alpha; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = s.r * 2 + 2;
  ctx.beginPath(); ctx.moveTo(ax + 2, ay + 3); ctx.lineTo(bx + 2, by + 3); ctx.stroke();
  ctx.strokeStyle = flash ? '#ff6a55' : (s.r > R_THIN ? '#d79a4a' : '#ecd199'); ctx.lineWidth = s.r * 2;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  if (hint) { ctx.strokeStyle = 'rgba(120,255,160,' + (0.5 + 0.5 * Math.sin(G.t * 9)) + ')'; ctx.lineWidth = s.r * 2 + 6; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); }
  // 持ち手：先が太く、外へ向く矢印
  ctx.fillStyle = flash ? '#ff6a55' : (s.r > R_THIN ? '#b87a34' : '#c9a25f');
  ctx.beginPath(); ctx.arc(ax, ay, s.r + 3, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang + Math.PI); ctx.fillStyle = 'rgba(255,240,200,.85)';
  ctx.beginPath(); ctx.moveTo(s.r + 12, 0); ctx.lineTo(s.r + 5, -4.5); ctx.lineTo(s.r + 5, 4.5); ctx.closePath(); ctx.fill(); ctx.restore();
  // 結び目
  if (s.knot) {
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    ctx.strokeStyle = '#d64a3a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(mx, my, s.r + 4, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.arc(mx, my, s.r + 4, 0, 7); ctx.strokeStyle = '#8f2417'; ctx.lineWidth = 1; ctx.stroke();
  }
  ctx.restore();
  ctx.save(); ctx.globalAlpha = alpha; itemPath(s.item, bx, by, ang, 1); ctx.restore();
}
function draw() {
  const k = cv.width / W;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  // 鍋の中
  const g = ctx.createLinearGradient(0, 0, 0, PLAY_BOTTOM);
  g.addColorStop(0, '#6a4424'); g.addColorStop(1, '#4f3119');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, PLAY_BOTTOM);
  ctx.fillStyle = 'rgba(255,220,160,.05)';
  for (let i = 0; i < 9; i++) { const x = (i * 83 + G.t * 6) % (W + 40) - 20, y = (i * 61) % PLAY_BOTTOM; ctx.beginPath(); ctx.arc(x, y, 14 + (i % 3) * 8, 0, 7); ctx.fill(); }
  // 鍋の帯
  ctx.fillStyle = '#2a1a10'; ctx.fillRect(0, PLAY_BOTTOM, W, H - PLAY_BOTTOM);
  ctx.fillStyle = '#a8692a'; ctx.fillRect(0, PLAY_BOTTOM, W, 3);
  ctx.fillStyle = '#cfae83'; ctx.font = '12px system-ui,sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('鍋', 12, PLAY_BOTTOM + 30);
  G.pot.forEach((it, i) => itemPath(it, 46 + i * 38, PLAY_BOTTOM + 30, 0, 1));
  // 串
  const list = G.sk.slice().sort((a, b) => a.z - b.z);
  for (const s of list) {
    const born = Math.min(1, (G.t - s.born) / 0.4);
    const sh = G.shake.get(s.id), fl = G.flash.get(s.id);
    let off = null;
    if (sh !== undefined && G.t - sh < 0.3) off = { x: Math.sin((G.t - sh) * 70) * 4, y: 0 };
    const flashing = (fl !== undefined && G.t - fl < 0.5) || (sh !== undefined && G.t - sh < 0.3);
    drawSkewer(s, off, born, flashing, G.hint === s && G.t - G.hintT < 4);
  }
  // 抜けていく串
  for (const o of G.outs) {
    const dt = G.t - o.t, s = o.s;
    const dx = s.A.x - s.B.x, dy = s.A.y - s.B.y, l = Math.hypot(dx, dy) || 1, dist = dt * dt * 3200 + dt * 200;
    drawSkewer(s, { x: dx / l * dist, y: dy / l * dist }, Math.max(0, 1 - dt / 0.5), false, false);
  }
  // ポップ
  ctx.textAlign = 'center';
  for (const p of G.pops) {
    const dt = G.t - p.t;
    ctx.globalAlpha = Math.max(0, 1 - dt / 1.1); ctx.fillStyle = p.col; ctx.font = '800 ' + (p.text.length > 5 ? 26 : 20) + 'px system-ui,sans-serif';
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 4; ctx.strokeText(p.text, p.x, p.y - dt * 30); ctx.fillText(p.text, p.x, p.y - dt * 30);
  }
  ctx.globalAlpha = 1;
}

/* ---- ループ ---- */
let prev = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - prev) / 1000 || 0); prev = ts;
  if (!document.hidden) G.t += dt;
  if (G.mode === 'play' && !document.hidden) {
    G.fire -= drainRate(G.level) * dt;
    hud();
    if (G.fire <= 0) { G.fire = 0; hud(); over(); }
  }
  G.outs = G.outs.filter(o => G.t - o.t < 0.5);
  G.pops = G.pops.filter(p => G.t - p.t < 1.1);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// 背景に盤面を出しておく（タイトルの後ろ）
fill(0);

/* 試験用（dev/ のテストが使う） */
window.HODOKE = { G, blockers, solvable, genOne, pull, start, over, W, H };
})();
</script>
