<!doctype html>
<html lang="ja">
<head>
<!-- β版のトップ（ちくわゲームズβ）。号口トップの見た目をもとに、cards.js のβのゲームだけを並べる -->
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ちくわゲームズβ</title>
<meta name="description" content="ちくわゲームズの試作中のゲーム（β版）のあつまり。">
<meta property="og:type" content="website">
<meta property="og:title" content="ちくわゲームズβ">
<meta property="og:description" content="ちくわゲームズの試作中のゲーム（β版）のあつまり。">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23C9772E'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23E9A55B'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23FFF6EA'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=M+PLUS+1:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: 1カラム。ブランド行 → 短いヒーロー → ゲームカードのグリッド → フッター */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --sunk:#E9EBEF; --ink:#111318; --muted:#5C6270; --line:#DFE2E8;
  --accent:#C9772E; --accent-soft:#F6E3CF; --accent-ink:#FFFFFF;
  --f-display:"Bricolage Grotesque","M PLUS 1",system-ui,sans-serif;
  --f-body:"M PLUS 1","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 1px 2px rgba(17,19,24,.05),0 8px 24px rgba(17,19,24,.06);
  --shadow-hi:0 2px 4px rgba(17,19,24,.06),0 18px 40px rgba(17,19,24,.12);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1014; --surface:#171A20; --sunk:#1F232B; --ink:#ECEEF2; --muted:#9BA2AF; --line:#2A2F39;
  --accent:#F0A35A; --accent-soft:#3A2A1B; --accent-ink:#1A1007;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-hi:0 2px 4px rgba(0,0,0,.35),0 18px 44px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1014; --surface:#171A20; --sunk:#1F232B; --ink:#ECEEF2; --muted:#9BA2AF; --line:#2A2F39;
  --accent:#F0A35A; --accent-soft:#3A2A1B; --accent-ink:#1A1007;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-hi:0 2px 4px rgba(0,0,0,.35),0 18px 44px rgba(0,0,0,.45);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* ブランド行 */
.top{padding-block:22px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-body);font-weight:800;font-size:18px;letter-spacing:.02em}
.brand small{display:block;font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.18em;color:var(--muted);line-height:1}
.toplink{font-size:14px;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
.toplink:hover{color:var(--ink);border-color:var(--muted)}

/* ヒーロー */
.hero{padding-block:36px 40px}
.hero h1{font-family:var(--f-body);font-weight:800;font-size:clamp(32px,6.2vw,60px);line-height:1.18;letter-spacing:-.01em;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:16px 0 0;color:var(--muted);font-size:17px;max-width:34em}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;padding:0;list-style:none}
.facts li{font-size:13px;font-weight:500;padding:5px 12px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.facts li b{color:var(--ink);font-family:var(--f-mono);font-weight:500;margin-right:4px}

/* ゲームカード */
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.section-head h2{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.16em;text-transform:uppercase;margin:0}
.section-head span{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:20px;padding-bottom:56px}
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);text-decoration:none;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi);border-color:transparent}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--sunk)}
.thumb canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.ver{position:absolute;top:12px;right:12px;font-family:var(--f-mono);font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(14,16,20,.62);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.body{display:flex;flex-direction:column;gap:10px;padding:20px 22px 22px;flex:1}
.kicker{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.card h3{margin:0;font-size:24px;font-weight:800;line-height:1.3}
.card h3 small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.desc{margin:0;color:var(--muted);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 0;padding:0;list-style:none}
.tags li{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.play{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.play span:first-child{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--bg);transition:background .2s ease,color .2s ease}
.btn svg{width:16px;height:16px;transition:transform .2s ease}
.card:hover .btn{background:var(--accent);color:var(--accent-ink)}
.card:hover .btn svg{transform:translateX(3px)}

/* ベータ版の欄（card.js に beta: true があるゲーム） */
.beta-sec{padding-top:8px}
.beta-note{margin:-6px 0 16px;color:var(--muted);font-size:14px}
.ver.beta{background:var(--accent);color:var(--accent-ink);font-weight:700}
.card.is-beta{border-style:dashed}
.card.is-beta:hover{border-color:transparent}

/* 限定公開（card.js に lock があるカード）。パスワードが合うまでは中身を伏せる */
.card.is-locked{cursor:default}
.card.is-locked:hover{transform:none;box-shadow:var(--shadow);border-color:var(--line)}
.card.is-locked .thumb canvas{filter:blur(6px) saturate(.6);opacity:.55}
.lockmark{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink)}
.lockmark span{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow)}
.lockmark svg{width:16px;height:16px}
/* 開発中（card.js に dev: true があるカード）。中身をぼかし、リンクを貼らない */
.card.is-dev{cursor:default}
.card.is-dev:hover{transform:none;box-shadow:var(--shadow);border-color:var(--line)}
.card.is-dev .thumb canvas{filter:blur(6px) saturate(.6);opacity:.55}
.devmark{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink)}
.devmark span{font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow)}
.unlock{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:8px}
.unlock input{flex:1 1 160px;min-width:0;font:inherit;font-size:15px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.unlock input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.unlock button{font:inherit;font-weight:700;font-size:15px;padding:9px 18px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);cursor:pointer}
.unlock button:hover{background:var(--accent);color:var(--accent-ink)}
.unlock button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.unlock-msg{flex-basis:100%;margin:0;font-size:13px;color:var(--muted);min-height:1.5em}
.unlock-msg.ng{color:#C2412D}

footer{border-top:1px solid var(--line);padding-block:26px 34px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
footer a{text-decoration:none}
.footnav{display:flex;flex-wrap:wrap;gap:6px 18px}
footer a:hover{color:var(--ink)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}.card:hover{transform:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="./" aria-label="ちくわゲームズβ トップ">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#C9772E"/><circle cx="16" cy="16" r="12" fill="#E9A55B"/><path d="M8 11.5c2-.6 3.4-.3 4.6.6M19.5 22c1.6.4 3 .2 4.3-.7" stroke="#B5651F" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="16" cy="16" r="6.2" fill="#FFF6EA"/></svg>
      <span><b>ちくわゲームズβ</b><small>CHIKUWA GAMES BETA</small></span>
    </a>
    <a class="toplink" href="https://chikuwa-games.chikuwa-hookah.workers.dev/">ちくわゲームズへ</a>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <h1>できたて、<em>試作中。</em><br>ちくわゲームズβ。</h1>
      <p>ちくわゲームズで作っている途中のゲームを、ひと足先に試せる場所です。内容が変わったり、セーブが消えたりすることがあります。</p>
      <ul class="facts">
        <li><b id="count">0</b>タイトル</li>
        <li>β版</li>
        <li>スマホ・PC対応</li>
      </ul>
    </div>
  </section>

  <section class="wrap beta-sec" id="beta-sec" aria-labelledby="beta-h">
    <div class="section-head">
      <h2 id="beta-h">Beta</h2>
      <span id="updated"></span>
    </div>
    <div class="grid" id="beta-grid"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 ちくわゲームズ</span>
    <nav class="footnav" aria-label="サイトの情報">
      <a href="https://chikuwa-games.chikuwa-hookah.workers.dev/">ちくわゲームズ（正式版のゲーム）</a>
      <a href="https://chikuwa-games.chikuwa-hookah.workers.dev/about/">運営者情報・お問い合わせ</a>
      <a href="https://chikuwa-games.chikuwa-hookah.workers.dev/privacy/">プライバシーポリシー</a>
      <a href="https://x.com/ChikuwaDev" target="_blank" rel="noopener">X（@ChikuwaDev）</a>
      <a href="https://github.com/Chikuwa1014/chikugames" target="_blank" rel="noopener">ソースコード（GitHub）</a>
    </nav>
  </div>
</footer>

<!-- βのゲームの一覧（号口トップの「Beta」欄と同じ cards.js） -->
<script src="./cards.js"></script>
<script>
(() => {
/* βのゲームの一覧は cards.js（号口トップの「Beta」欄と同じもの）。カードの出し方（鍵・開発中）も号口トップと同じ */
/* 成人向け（adult: true）のゲームはトップに出さない（号口トップと同じ） */
const BETAS = (window.CHIKUWA_GAMES || []).filter(g => !g.adult && g.beta).slice().sort((a, b) => a.order - b.order);

const arrow = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h9M8.5 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const thumbs = [];
/* 版数の表示：正式版は v1.0.0、ベータ版は β0.1.0（version に β が付いていなくても付ける） */
const verText = g => g.beta ? 'β' + String(g.version).replace(/^β/, '') : 'v' + g.version;
//ゆるい限定公開なんだゾ…
/* 限定公開：card.js の lock にパスワードの SHA-256（16進）を書いたカードは、合うまで鍵つきで表示する。
   合ったらその端末に覚える（localStorage）。ゆるい限定公開なので、ゲームの URL を直接開けば遊べる */
const lockIcon = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.6" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" stroke="currentColor" stroke-width="1.6"/></svg>';
const unlockKey = g => 'chikuwa-unlock:' + g.href;
const isUnlocked = g => { try { return localStorage.getItem(unlockKey(g)) === g.lock; } catch (e) { return false; } };
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function addCard(g, grid, before) {
  /* 開発に公開（dev: true）：ぼかして「開発中」。リンクもパスワード欄も出さない */
  const dev = !!g.dev;
  const locked = !dev && g.lock && !isUnlocked(g);
  const a = document.createElement(locked || dev ? 'div' : 'a');
  a.className = (g.beta ? 'card is-beta' : 'card') + (locked ? ' is-locked' : '') + (dev ? ' is-dev' : '');
  if (!locked && !dev) a.href = g.href;
  const mark = dev ? `<div class="devmark"><span>開発中</span></div>` : locked ? `<div class="lockmark"><span>${lockIcon}限定公開</span></div>` : '';
  const head = `
    <div class="thumb"><canvas width="160" height="90" aria-hidden="true"></canvas><span class="${g.beta ? 'ver beta' : 'ver'}">${esc(verText(g))}</span>${mark}</div>`;
  a.innerHTML = dev ? head + `
    <div class="body">
      <span class="kicker">${esc(g.kicker)}</span>
      <h3>${esc(g.title)}<small>${esc(g.sub)}</small></h3>
      <p class="desc">開発中のゲームです。公開されるまでお待ちください。</p>
      <div class="play"><span>準備中</span><span class="btn">開発中</span></div>
    </div>` : locked ? head + `
    <div class="body">
      <span class="kicker">${esc(g.kicker)}</span>
      <h3>${esc(g.title)}<small>${esc(g.sub)}</small></h3>
      <p class="desc">パスワードを知っている人だけが遊べるゲームです。</p>
      <form class="unlock" autocomplete="off">
        <input type="password" id="unlock-${esc(g.href.replace(/\W+/g, '-'))}" aria-label="${esc(g.title)} のパスワード" placeholder="パスワード">
        <button type="submit">ひらく</button>
        <p class="unlock-msg" aria-live="polite"></p>
      </form>
    </div>` : head + `
    <div class="body">
      <span class="kicker">${esc(g.kicker)}</span>
      <h3>${esc(g.title)}<small>${esc(g.sub)}</small></h3>
      <p class="desc">${esc(g.desc)}</p>
      <ul class="tags">${g.tags.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      <div class="play"><span>更新 ${esc(g.updated)}</span><span class="btn">${g.beta ? '試す' : '遊ぶ'} ${arrow}</span></div>
    </div>`;
  grid.insertBefore(a, before || null);
  const c = a.querySelector('canvas');
  const th = { ctx: c.getContext('2d'), draw: g.draw };
  thumbs.push(th);
  if (locked) {
    const form = a.querySelector('form'), input = form.querySelector('input'), msg = form.querySelector('.unlock-msg');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      let h = '';
      try { h = await sha256(input.value.trim()); } catch (err) { msg.textContent = 'このブラウザでは確認できません'; msg.className = 'unlock-msg ng'; return; }
      if (h !== g.lock) { msg.textContent = 'パスワードがちがいます'; msg.className = 'unlock-msg ng'; input.select(); return; }
      try { localStorage.setItem(unlockKey(g), g.lock); } catch (err) {}
      thumbs.splice(thumbs.indexOf(th), 1);
      g.lock = null;                 /* この表示中は鍵を外す（保存できないブラウザでも開ける） */
      addCard(g, grid, a); a.remove();
      if (still) drawAll(0);
    });
  }
}
const bg = document.getElementById('beta-grid');
BETAS.forEach(g => addCard(g, bg));
document.getElementById('count').textContent = BETAS.length;
const latest = BETAS.map(g => g.updated).sort().pop();
if (latest) document.getElementById('updated').textContent = '最終更新 ' + latest;


/* ---------- アニメーション（動きを減らす設定では静止画） ---------- */
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const start = performance.now();
function drawAll(t) { for (const th of thumbs) { try { th.draw(th.ctx, t); } catch (e) {} } }
function loop(now) {
  const t = (now - start) / 1000;
  drawAll(t);
  if (!still) requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
