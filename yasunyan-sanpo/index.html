<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>やすにゃんこんにゃん！散歩チュウ</title>
<meta name="description" content="こんにゃんを連れておでん横丁をひとまわり。激うまアイテムを集めて、こんにゃんを育てよう！">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#C9772E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='%23F7F0DB'/%3E%3Crect x='7' y='12' width='18' height='10' rx='5' fill='%23B8692A'/%3E%3Crect x='9' y='14' width='14' height='4' rx='2' fill='%23E9A55B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/v1/common.css">
<style>
:root{ --ink:#3A2412; --cho:#C9772E; --cho2:#E9A55B; --cream:#FFF4DC; --line:#E3D2A8; --red:#E0473C; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#120c08;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
#stage{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;overflow:hidden;background:#000}
#cv{position:absolute;left:0;top:0;width:360px;height:640px;display:block}
#back{position:absolute;left:8px;top:8px;z-index:6;padding:5px 11px;border-radius:999px;background:rgba(255,244,220,.9);color:var(--ink);font-size:12px;font-weight:800;text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#mute{position:absolute;right:8px;top:8px;z-index:6;padding:5px 11px;border-radius:999px;border:0;background:rgba(255,244,220,.9);font-size:12px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.panel{position:absolute;inset:0;z-index:4}
/* タイトル */
#title h1{position:absolute;left:0;right:0;top:52px;margin:0;text-align:center;font-weight:900;line-height:1.12;color:#fff;font-size:40px;text-shadow:0 3px 0 #8A4E18,0 0 14px rgba(0,0,0,.45);letter-spacing:1px}
#title h1 small{display:block;font-size:20px;letter-spacing:2px;color:#FFE9A8;margin-bottom:2px}
#title h1 span{display:block;font-size:46px;color:#FFD34D}
#title .lead{position:absolute;left:24px;right:24px;top:140px;margin:0;text-align:center;font-weight:800;font-size:13px;line-height:1.6;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
/* 空のところ（建物より上）に性別とスタート、地面のところにそのほかのボタン。キャラの絵とかぶらない */
#title .mid{position:absolute;left:0;right:0;top:196px;display:flex;flex-direction:column;align-items:center;gap:8px}
#title .low{position:absolute;left:0;right:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:7px}
.gl{font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.seg{display:flex;gap:0;border-radius:999px;overflow:hidden;box-shadow:0 3px 0 #B99A63;background:var(--cream)}
.seg button{border:0;background:transparent;padding:8px 22px;font-weight:900;font-size:14px;color:#8A6A44}
.seg button.on{background:var(--cho);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.big{border:0;width:248px;padding:13px 0 15px;border-radius:30px;background:linear-gradient(#F6B866,#C9772E);color:#fff;font-weight:900;font-size:23px;letter-spacing:2px;box-shadow:0 5px 0 #8A4E18,0 8px 14px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #8A4E18}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sm{border:0;padding:8px 13px;border-radius:999px;background:var(--cream);color:var(--ink);font-weight:800;font-size:13px;box-shadow:0 3px 0 #B99A63}
.sm:active{transform:translateY(2px);box-shadow:0 1px 0 #B99A63}
#bestline{margin:0;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#title .ver{position:absolute;right:10px;bottom:4px;margin:0;font-size:10px;color:rgba(255,255,255,.7);font-weight:700}
/* 結果 */
#rank{position:absolute;left:0;right:0;top:44px;display:flex;justify-content:center;align-items:baseline;gap:8px;z-index:5;pointer-events:none}
#rank small{font-size:17px;font-weight:900;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8);letter-spacing:1px}
#rank b{display:block;font-size:64px;line-height:.95;font-weight:900;-webkit-text-stroke:3px #3A2412;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.35);transform-origin:50% 60%}
#rank.pop b{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
#rank.rS b{color:#FFD34D}#rank.rA b{color:#FF6A5C}#rank.rB b{color:#5BA3F0}#rank.rC b{color:#4FD27A}#rank.rD b{color:#C9C9D2}
#result{pointer-events:none}
#card{position:absolute;left:12px;right:12px;bottom:12px;padding:12px 14px 14px;border-radius:22px;background:#FFF4DC;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:auto;animation:slide .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes slide{from{transform:translateY(120%)}to{transform:none}}
#card .pts{display:flex;align-items:baseline;justify-content:center;gap:6px;font-weight:900}
#card .pts b{font-size:42px;line-height:1;color:var(--cho)}
#card .pts span{font-size:15px}
#card .best{text-align:center;font-size:13px;font-weight:800;margin:2px 0 4px}
#card .best em{font-style:normal;color:#fff;background:var(--red);padding:2px 8px;border-radius:999px;margin-left:6px;font-size:12px}
#card .brk{text-align:center;font-size:12px;font-weight:700;color:#7A5A38;margin:0 0 10px}
#card .btns{display:flex;flex-direction:column;align-items:center;gap:8px}
#card .big{width:100%;font-size:20px}
/* 図鑑 */
#zukan{background:#1A100A;display:flex;flex-direction:column;z-index:7}
#zukan header{display:flex;align-items:center;justify-content:space-between;padding:44px 14px 8px;color:#fff}
#zukan h2{margin:0;font-size:20px;font-weight:900}
#ztabs{display:flex;justify-content:center;padding:2px 0 6px}
#zbody .slot[data-k]{cursor:pointer}
#zukan .slot.fav{outline:2px solid #FF7BA8;outline-offset:-2px}
#zukan .slot.fav::before{content:"♥";position:absolute;left:3px;top:0;color:#FF7BA8;font-size:13px;z-index:1;text-shadow:0 0 4px #000}
#zukan .scroll{flex:1;overflow-y:auto;padding:4px 12px 20px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#zukan h3{margin:12px 0 6px;color:#FFD34D;font-size:15px;font-weight:900}
#zukan .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
#zukan .slot{aspect-ratio:3/5;border-radius:8px;background:#3A2A1E;color:#7A6350;display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden;position:relative}
#zukan .slot img{width:100%;height:100%;object-fit:contain;display:block}
#zukan .slot.s::after{content:"★";position:absolute;right:2px;top:0;color:#FFD34D;font-size:12px;text-shadow:0 0 4px #FFD34D}
/* ダイアログ */
#modal{background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:8}
#modal .box{width:100%;max-height:100%;overflow-y:auto;background:var(--cream);border-radius:20px;padding:16px;box-shadow:0 8px 28px rgba(0,0,0,.6);touch-action:pan-y}
#modal h2{margin:0 0 8px;font-size:18px;font-weight:900}
#modal p,#modal li{font-size:13px;line-height:1.65;margin:0 0 6px;font-weight:700}
#modal ul{margin:0 0 8px;padding-left:18px}
#modal .row{margin-top:10px}
#modal table{width:100%;border-collapse:collapse;font-size:12px;font-weight:700;margin-bottom:8px}
#modal td,#modal th{padding:2px 4px;border-bottom:1px solid var(--line);text-align:left}
#modal .mm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
#modal .mm .sm{width:100%}
#modal .dimg{text-align:center;background:#2A1A10;border-radius:12px;padding:6px;margin-bottom:8px}
#modal .dimg img{height:300px;max-width:100%;object-fit:contain}
/* 一時停止 */
#btnPause{position:absolute;right:8px;top:40px;z-index:6;width:34px;height:34px;padding:0;border-radius:50%;border:0;background:rgba(255,244,220,.78);font-size:14px;font-weight:900;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#btnPause i{display:inline-block;width:4px;height:14px;margin:0 2px;border-radius:1px;background:var(--ink);vertical-align:middle}
#pausep{background:rgba(18,12,8,.86);z-index:6;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#pausep .in{display:flex;flex-direction:column;align-items:center;gap:12px;padding:84px 24px 28px}
#pausep h2{margin:0 0 4px;color:#fff;font-size:24px;font-weight:900;letter-spacing:2px}
#pausep .big{width:100%}
#pausep .big.alt{background:linear-gradient(#FFF4DC,#E9D5A8);color:var(--ink);text-shadow:none;box-shadow:0 5px 0 #B99A63,0 8px 14px rgba(0,0,0,.35)}
#pausep .ghost{border:0;background:transparent;color:rgba(255,255,255,.55);font-size:12px;font-weight:700;text-decoration:underline;padding:6px 10px;margin-top:2px}
#pdbg{width:100%;margin-top:14px;padding:12px;border-radius:14px;background:#FFF4DC;--cg-ink:#3A2412;--cg-sub:#7A5A38;--cg-card:#fff;--cg-line:#C9B58A;--cg-ok:#2e8b57;--cg-ng:#c23a3a;font-size:13px;font-weight:700;-webkit-user-select:text;user-select:text}
#pdbg .cg-dbg-meta{font-size:11px;color:var(--cg-sub)}
/* お気に入りと会話（ホットモック） */
#talk{pointer-events:none;z-index:5}
#talk>*{pointer-events:auto}
#talk .tinfo{position:absolute;left:8px;top:44px;width:226px;padding:8px 12px;border-radius:14px;background:rgba(20,12,8,.72);color:#fff}
#talk .tinfo b{font-size:17px;font-weight:900}
#talk .tinfo span{display:block;font-size:11px;font-weight:700;color:#E9D5B0;margin-top:1px}
#talk .love{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:12px;font-weight:900;color:#FF9DBD}
#talk .love i{display:block;flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
#talk .love i em{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF7BA8,#FFB3CC);transition:width .5s}
#talk .tback{position:absolute;right:8px;top:44px}
#talk .tbox{position:absolute;left:10px;right:10px;bottom:12px;padding:14px 14px 12px;border-radius:16px;background:rgba(18,10,6,.88);border:1px solid rgba(255,214,150,.35);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#talk .tnm{position:absolute;left:12px;top:-13px;padding:3px 12px;border-radius:999px;background:var(--cho);font-size:12px;font-weight:900}
#talk .ttx{margin:4px 0 10px;min-height:48px;font-size:14px;line-height:1.65;font-weight:700}
#talk .tch{display:flex;flex-direction:column;gap:6px}
#talk .tch button{border:1px solid rgba(255,214,150,.5);background:rgba(255,244,220,.1);color:#FFF4DC;border-radius:10px;padding:9px 10px;font-size:13px;font-weight:800;text-align:left}
#talk .tch button:active{background:rgba(255,244,220,.28)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <a id="back" href="../">← ちくわゲームズ</a>
  <button id="mute" type="button">おと：ON</button>
  <button id="btnPause" type="button" aria-label="一時停止" hidden><i></i><i></i></button>

  <section id="title" class="panel">
    <h1><small>やすにゃんこんにゃん！</small><span>散歩チュウ</span></h1>
    <p class="lead">こんにゃんを連れて、おでん横丁をひとまわり。<br>激うまアイテムを集めて、こんにゃんを育てよう！</p>
    <div class="mid">
      <span class="gl">こんにゃんの性別</span>
      <div class="seg" id="gseg"><button type="button" id="gF">♀ メス</button><button type="button" id="gM">♂ オス</button></div>
      <button class="big" id="btnStart" type="button">さんぽにでる</button>
    </div>
    <div class="low">
      <div class="row">
        <button class="sm" id="btnZukan" type="button">図鑑 <span id="zcount"></span></button>
        <button class="sm" id="btnTalkTop" type="button">♥ お気に入りと会話</button>
      </div>
      <div class="row">
        <button class="sm" id="btnHow" type="button">あそびかた</button>
        <button class="sm" id="btnLog" type="button">更新履歴</button>
      </div>
      <p id="bestline"></p>
    </div>
    <p class="ver" id="ver"></p>
  </section>

  <div id="rank" hidden><small>スコアランク：</small><b id="rankLetter">D</b></div>
  <section id="result" class="panel" hidden>
    <div id="card">
      <div class="pts"><b id="rPts">0</b><span>ポイント</span></div>
      <div class="best" id="rBest"></div>
      <p class="brk" id="rBrk"></p>
      <div class="btns">
        <button class="big" id="btnAgain" type="button">もういちど</button>
        <div class="row">
          <button class="sm" id="btnShare" type="button">共有</button>
          <button class="sm" id="btnZukan2" type="button">図鑑</button>
          <button class="sm" id="btnTop" type="button">タイトル</button>
        </div>
      </div>
    </div>
  </section>

  <section id="zukan" class="panel" hidden>
    <header><h2>図鑑 <span id="zcount2"></span></h2><button class="sm" id="btnZclose" type="button">もどる</button></header>
    <div id="ztabs"><div class="seg"><button type="button" id="zF">♀ 女性</button><button type="button" id="zM">♂ 男性</button></div></div>
    <div class="scroll" id="zbody"></div>
  </section>

  <section id="pausep" class="panel" hidden>
    <div class="in">
      <h2>一時停止</h2>
      <button class="big" id="btnResume" type="button">再開</button>
      <button class="big alt" id="btnRestart" type="button">リスタート</button>
      <button class="ghost" id="btnQuit" type="button">スタート画面へ戻る</button>
      <div id="pdbg"></div>
    </div>
  </section>

  <section id="talk" class="panel" hidden>
    <div class="tinfo"><b id="tName"></b><span id="tSub"></span><div class="love">♥<i><em id="tLove"></em></i><span id="tLoveN" style="margin:0;color:#FF9DBD"></span></div></div>
    <button class="sm tback" id="btnTback" type="button">もどる</button>
    <div class="tbox"><div class="tnm" id="tNm"></div><p class="ttx" id="tText"></p><div class="tch" id="tChoices"></div></div>
  </section>

  <section id="modal" class="panel" hidden><div class="box" id="mbox"></div></section>
</div>

<script src="../common/v1/core.js"></script>
<script src="../common/v1/share.js"></script>
<script src="../common/v1/debug.js"></script>
<script>
'use strict';
/* =====================================================================
   やすにゃんこんにゃん！散歩チュウ（yasunyan-sanpo）
   共通ルールは号口リポジトリの CLAUDE.md。ここは 1 ファイルにまとめている。
   ===================================================================== */
const VERSION = 'β0.3.0';
CG.init({ game: 'yasunyan-sanpo', title: 'やすにゃんこんにゃん！散歩チュウ', version: VERSION });
// デバッグ（共通部品 debug.js）：操作とエラーを端末に残し、一時停止メニューから送る。送り先は worker の DEBUG_GAMES（β はまだ未設定。未実装タスク）
CG.debug.init({ snap: () => ({ st: state, pts, x: Math.round(P.x), y: Math.round(P.y), sec: secIdx, g: SAVE.gender }) });
['startRun', 'startGoal', 'showResult', 'hitObs', 'showTitle', 'setGender', 'openZukan', 'openTalk', 'pauseGame', 'resumeGame', 'restartGame', 'quitToTitle'].forEach(n => CG.debug.wrap(n));

/* ---------- 調整用の数値（バランスはここだけを直す） ---------- */
const CFG = {
  speed: 130,            // 歩く速さ（px/秒）
  gravity: 1400,         // 重力
  jumpV: 600,            // ジャンプの初速（タップ）
  holdGravity: 0.55,     // 長押し中（上昇中）の重力の倍率
  holdMax: 0.3,          // 長押しが効く時間（秒）
  slowRate: 0.55,        // ぶつかったあとの速さの倍率
  slowTime: 1.5,         // 遅くなる時間（秒）
  invuln: 1.2,           // ぶつかったあとのむてき時間（秒）
  hitLoss: 20,           // 障害物にぶつかって落とすポイント
  sectionLen: 4500,      // 1 区間の長さ（px）
  tail: 1000,            // 最後の区間のあと、ゴールまでの長さ（px）
  crowSpeed: 30,         // カラスが近づく速さ（px/秒）
  rank: { C: 300, B: 500, A: 700 },   // ランクの境目（以上）。D は C 未満
  sChance: 0.10,         // A のうち S になる確率
  // 1 周ぶんの出現数
  nNormalCluster: [3, 3, 2, 2],       // ふつうのかたまり（1 かたまり 4 個）の区間ごとの数
  nRare: [3, 3, 3, 3],
  nNanami: [2, 2, 2, 2],
  nKarashi: [1, 1, 1, 1],
  nBomb: [1, 2],         // ばくだんの数（どちらかをランダム）
  obsWeights: [[3, 2, 2], [2, 3, 2], [3, 1, 3], [2, 2, 3]]   // 区間ごとの [水たまり, 自転車, カラス]
};

/* ---------- アイテム ---------- */
const ITEMS = {
  chikuwa:   { name: 'ちくわ',         tier: 'normal', pt: 10 },
  daikon:    { name: 'だいこん',       tier: 'normal', pt: 10 },
  konnyaku:  { name: 'こんにゃく',     tier: 'normal', pt: 10 },
  hanpen:    { name: 'はんぺん',       tier: 'normal', pt: 10 },
  tamago:    { name: 'たまご',         tier: 'rare',   pt: 30 },
  gyusuji:   { name: '牛すじ',         tier: 'rare',   pt: 30 },
  kinchaku:  { name: 'もち巾着',       tier: 'rare',   pt: 30 },
  kinchikuwa:{ name: '金のちくわ',     tier: 'super',  pt: 100 },
  misokushi: { name: 'とろとろ味噌串', tier: 'super',  pt: 100 },
  nanami:    { name: '七味とうがらし', tier: 'bad',    pt: -10 },
  karashi:   { name: '和からし',       tier: 'bad',    pt: -60 },
  bomb:      { name: 'ばくだん',       tier: 'bad',    pt: -150 }
};
const KINDS = { normal: ['chikuwa', 'daikon', 'konnyaku', 'hanpen'], rare: ['tamago', 'gyusuji', 'kinchaku'], super: ['kinchikuwa', 'misokushi'] };
const TIER_LABEL = { normal: 'ふつう', rare: 'レア', super: '超レア', bad: '減点' };

/* ---------- コンカフェ嬢（絵は img/concafe/<キャラ>-<衣装>.png を読み込む） ---------- */
// 性別 g：'f'＝メス（女性のキャラに成長）、'm'＝オス（男性のキャラに成長）。S は A のキャラに演出を足す。
// B〜D は、男性の絵ができるまで、女性・男性とも同じ仮の絵を使う（未実装タスク【要確認】）
const RANKS = {
  A: { f: ['af1', 'af2', 'af3', 'af4', 'af5'], m: ['am1', 'am2', 'am3', 'am4', 'am5'] },
  B: { f: ['b1', 'b2'], m: ['b1', 'b2'] }, C: { f: ['c1'], m: ['c1'] }, D: { f: ['d1', 'd2'], m: ['d1', 'd2'] }
};
const COSTUMES_A = ['maid', 'police', 'pirate', 'formal', 'kyonshi', 'gothic', 'maid2', 'pastel', 'loli', 'dogear', 'neon'];   // A・S の衣装（11 種）
const COSTUMES_OLD = ['maid', 'gothic', 'police', 'marine', 'idol', 'pirate'];                                                  // B〜D の仮の衣装（6 種）
const RANK_ORDER = ['S', 'A', 'B', 'C', 'D'];

function genWorld() {

  for (let s = 0; s < 4; s++) {

    if (superSecs.includes(s)) tokens.push('S');
    for (let i = 0; i < CFG.nNanami[s]; i++) tokens.push('n');
    for (let i = 0; i < CFG.nKarashi[s]; i++) tokens.push('k');
    if (bombSecs.includes(s)) tokens.push('b');
    const w = CFG.obsWeights[s];
    ['puddle', 'bike', 'crow'].forEach((tp, j) => { for (let i = 0; i < w[j]; i++) tokens.push(tp); });
    shuffle(tokens);
    const a = s * L + (s === 0 ? 700 : 220), b = (s + 1) * L - 220, slot = (b - a) / tokens.length;
    tokens.forEach((tk, i) => {
      const x = a + (i + 0.5) * slot + rnd(-slot * 0.14, slot * 0.14);
      if (tk === 'N') {
        const arc = Math.random() < 0.4, kind = pick(KINDS.normal);
        for (let j = 0; j < 4; j++) items.push({ k: kind, x: x + (j - 1.5) * 34, y: arc ? [42, 84, 98, 84][j] : 28, got: false, ph: Math.random() * 6 });
      } else if (tk === 'R') items.push({ k: pick(KINDS.rare), x, y: Math.random() < 0.5 ? 28 : 96, got: false, ph: Math.random() * 6 });
      else if (tk === 'S') items.push({ k: pick(KINDS.super), x, y: 225, got: false, ph: Math.random() * 6 });
      else if (tk === 'n') items.push({ k: 'nanami', x, y: 24, got: false, ph: Math.random() * 6 });
      else if (tk === 'k') items.push({ k: 'karashi', x, y: 24, got: false, ph: Math.random() * 6 });
      else if (tk === 'b') items.push({ k: 'bomb', x, y: 26, got: false, ph: Math.random() * 6 });
      else if (tk === 'puddle') obs.push({ t: 'puddle', x, x0: x, w: 54, bot: 0, top: 8 });
      else if (tk === 'bike') obs.push({ t: 'bike', x, x0: x, w: 40, bot: 0, top: 44 });

  const sp = state === 'play'; if (sp !== pauseShown) { pauseShown = sp; $('#btnPause').hidden = !sp; }

}

  $('#title').hidden = true; $('#result').hidden = true; $('#rank').hidden = true; $('#zukan').hidden = true; $('#modal').hidden = true; $('#talk').hidden = false;
  $('#tName').textContent = NAMES[k.ch]; $('#tSub').textContent = `${RARITY[k.r]}／${COSTUME_NAMES[k.co]}`; $('#tNm').textContent = NAMES[k.ch];
  talkNode('hello');
}
function talkSay(text) { $('#tText').textContent = text; }
function talkLove(d) {
  TK.love = clamp(TK.love + d, 0, 100); SAVE.love[TK.key] = TK.love; writeSave();
  $('#tLove').style.width = TK.love + '%'; $('#tLoveN').textContent = TK.love;
  if (d > 0) for (let i = 0; i < 5; i++) parts.push({ ty: 's', x: 180 + rnd(-60, 60), y: rnd(150, 300), vx: rnd(-20, 20), vy: rnd(-70, -30), life: rnd(0.6, 1.1), max: 1.1, col: '#FF9DBD', r: rnd(3, 5) });
}
// 台本（仮）。choices：[表示, 好感度の増え方, 返事]
function talkNode(id) {
  const t = TK, nm = NAMES[t.k.ch], cos = COSTUME_NAMES[t.k.co], box = $('#tChoices');
  const choices = c => { box.innerHTML = ''; c.forEach(([label, fn]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = fn; box.appendChild(b); }); };
  talkLove(0);
  if (id === 'hello') {
    talkSay(t.love >= 60 ? `あっ、来てくれたんだ！ ……待ってたよ。今日は「${cos}」なんだ。` : t.love > 0 ? `いらっしゃい、また会えたね。今日は「${cos}」だよ。` : `いらっしゃいませ。${nm}です。今日は「${cos}」で来てみたよ。`);
    choices([['その衣装、似合ってるね', () => reply(8, 'ほんと？ うれしい。選んだかいがあったな。')], ['おすすめは何？', () => reply(3, 'ちくわとこんにゃくかな。あったかいのをゆっくり食べるのが好き。')], ['こんにゃんだったころの話、おぼえてる？', () => reply(6, 'えへへ、ちょっと恥ずかしいな。でも、あの散歩はたのしかったよ。')]]);
  } else if (id === 'second') {
    talkSay('ねえ、ほかにも聞きたいことある？');
    choices([['最近どう？', () => reply(4, 'ぼちぼちかな。お店がにぎやかだと、それだけでうれしいよ。')], ['また会いに来ていい？', () => reply(8, 'もちろん。来てくれたら、きっと顔に出ちゃうから。')], ['今日はもう帰るね', () => bye()]]);
  } else if (id === 'bye') {
    choices([['もどる', leaveTalk]]);
  }
  function reply(d, txt) {
    talkLove(d); talkSay(txt); t.turn++;
    choices([['つづける', () => t.turn >= 3 ? bye() : talkNode('second')]]);
  }
  function bye() {
    talkSay(t.love >= 60 ? 'もう帰っちゃうの？ ……また、すぐ来てね。' : t.love >= 20 ? 'ありがとう、たのしかった。また来てね。' : 'ありがとうございました。またお待ちしています。');
    choices([['もどる', leaveTalk]]);
  }
}
function leaveTalk() { TK = null; parts = []; $('#talk').hidden = true; showTitle(); }
function drawTalk(c) {
  c.imageSmoothingEnabled = false; c.drawImage(tkBg, 0, 0, W, H);
  TALK_OBJ.forEach(o => { if (!o.img) { o.img = new Image(); o.img.src = o.src; } if (o.img.complete && o.img.naturalWidth) c.drawImage(o.img, o.x, o.y, o.w, o.w * o.img.naturalHeight / o.img.naturalWidth); });
  const t = TK; if (!t) return;
  if (t.ok) {   // 立ち絵：カウンターのうしろに立つ（足もとはカウンターにかくれる）
    const hh = 340, ww = hh * t.img.naturalWidth / t.img.naturalHeight, by = Math.sin(T * 1.6) * 1.5;
    c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high'; c.globalAlpha = 1;
    c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(180, 458, ww * 0.42, 9, 0, 0, 6.3); c.fill();
    c.drawImage(t.img, 180 - ww / 2, 468 - hh + by, ww, hh); c.imageSmoothingEnabled = false;
  }
  if (tkBg instanceof HTMLCanvasElement) {   // 仮の背景のときだけ：カウンターを手前に重ねて足もとをかくし、グラスとお皿を置く
    const cy = 112 / 160 * H;
    c.drawImage(tkBg, 0, 112, 90, 48, 0, cy, W, H - cy);
    c.fillStyle = 'rgba(255,255,255,.55)'; c.fillRect(268, cy - 22, 14, 22); c.fillStyle = 'rgba(255,200,120,.6)'; c.fillRect(270, cy - 12, 10, 12); c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(272, cy - 22, 2, 18);
    c.fillStyle = '#E8DCC0'; c.beginPath(); c.ellipse(80, cy - 2, 20, 5, 0, 0, 6.3); c.fill(); c.fillStyle = '#B8692A'; rr(c, 68, cy - 12, 24, 9, 4); c.fill();
  }
  drawParts(c, 0);
  const vg = c.createLinearGradient(0, 0, 0, H); vg.addColorStop(0, 'rgba(0,0,0,.35)'); vg.addColorStop(.25, 'rgba(0,0,0,0)'); vg.addColorStop(.7, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)'); c.fillStyle = vg; c.fillRect(0, 0, W, H);
}
