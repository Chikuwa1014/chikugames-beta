<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>ちくわでるでる！ドーパミン</title>
<style>
:root{--bg:#1b1030;--panel:#2b1b4a;--ink:#fff6e8;--sub:#c7b5e8;--accent:#ffb03b;--pink:#ff5fa2;--good:#4ee38a;--bad:#ff5a4e;--cg-accent:#ffb03b}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#3a1f63 0%,var(--bg) 60%);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-touch-callout:none}
button,.modal{-webkit-user-select:none;user-select:none;touch-action:pan-x pan-y}
.mbox,.mbox *,.scroll,.scroll *{touch-action:pan-y}
input,textarea,select{font-size:16px!important}
header{display:flex;align-items:center;gap:8px;padding:6px 12px;height:42px;flex:none}
header a,header button.back{color:var(--sub);text-decoration:none;font-size:13px;background:none;border:0;padding:0;cursor:pointer}
header .ttl{margin-left:auto;font-weight:800;font-size:14px;color:var(--accent)}
#app{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.screen[hidden]{display:none}
.scroll{overflow:auto;padding:4px 14px calc(16px + env(safe-area-inset-bottom))}
.logo{text-align:center;margin:6px 0 14px}
.logo h1{margin:0;font-size:28px;line-height:1.2;background:linear-gradient(90deg,#ffb03b,#ff5fa2,#8f7bff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 6s linear infinite}
.logo p{margin:4px 0 0;font-size:13px;color:var(--sub)}
@keyframes hue{50%{filter:hue-rotate(40deg)}}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:440px;margin:0 auto}
.gcard{border:0;border-radius:18px;padding:14px 10px;background:var(--panel);color:var(--ink);text-align:center;cursor:pointer;box-shadow:0 4px 0 #160b28;transition:transform .08s}
.gcard:active{transform:translateY(3px);box-shadow:0 1px 0 #160b28}
.gcard .ic{font-size:40px;display:block;margin-bottom:4px}
.gcard b{display:block;font-size:15px}
.gcard small{display:block;color:var(--sub);font-size:11px;margin-top:4px;line-height:1.4}
.gcard .best{color:var(--accent);font-size:12px;margin-top:6px;font-weight:700}
.hud{display:flex;align-items:center;gap:10px;padding:0 14px 6px;flex:none;font-size:13px;color:var(--sub)}
.hud b{font-size:20px;color:var(--ink)}
.hud .combo{color:var(--pink);font-weight:800;min-width:60px}
.tbar{flex:1;height:10px;border-radius:5px;background:#120a22;overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#4ee38a,#ffb03b);transform-origin:left}
.tbar.low i{background:var(--bad)}
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-size:17px;font-weight:800;background:var(--accent);color:#2b1300;cursor:pointer;box-shadow:0 4px 0 #a8650f}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8650f}
.btn.sub{background:#46307a;color:var(--ink);box-shadow:0 4px 0 #24164a}
.btn:disabled{opacity:.4}
.msg{font-size:15px;color:var(--sub);text-align:center;min-height:24px;margin:6px 0}
.big{font-size:34px;font-weight:900;text-align:center}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:8}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
/* 麻雀 */
.hand{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:100%;max-width:420px}
.tile{position:relative;aspect-ratio:3/4;border-radius:8px;border:0;background:#f7f1e1;box-shadow:inset 0 -2px 0 #e2d6b8,0 3px 0 #d9ccaa,0 6px 0 #2f8a58,0 8px 0 #1c5a39,0 10px 8px rgba(0,0,0,.35);cursor:pointer;padding:0;overflow:hidden;transition:transform .1s}
.tile svg,.tile img{display:block;width:100%;height:100%}
.tile:active{transform:translateY(-6px)}
.tile.ok{box-shadow:0 0 0 3px var(--good),0 3px 0 #d9ccaa,0 6px 0 #2f8a58,0 0 18px 4px var(--good)}
.tile.cut{opacity:.25;transform:translateY(-10px)}
.tsumo{display:flex;align-items:center;gap:10px;margin:14px 0 4px;min-height:80px}
.tsumo .tile{width:56px;cursor:default}
.hand{gap:6px 5px}
.arc{display:block;width:100%;max-width:440px;margin:0 auto 12px;border:0;border-radius:20px;padding:16px 12px;cursor:pointer;color:#2b1300;text-align:center;background:linear-gradient(100deg,#ffb03b,#ff5fa2 55%,#8f7bff);box-shadow:0 5px 0 #6a2a6a;font-weight:900;font-size:22px;animation:hue 6s linear infinite}
.arc:active{transform:translateY(4px);box-shadow:0 1px 0 #6a2a6a}
.arc small{display:block;font-size:12px;font-weight:700;margin-top:4px;color:#3a1530}
.arc .best{font-size:13px;margin-top:4px;color:#fff}
.steps{display:flex;justify-content:center;gap:6px;margin:10px 0}
.steps span{width:46px;height:46px;border-radius:12px;background:#1b1030;display:flex;align-items:center;justify-content:center;font-size:24px;opacity:.45}
.steps span.done{opacity:1;background:#46307a}.steps span.now{opacity:1;background:var(--accent);animation:pop .5s}
.brk{text-align:left;margin:10px auto 0;max-width:260px;font-size:14px;line-height:1.9}
.brk div{display:flex;justify-content:space-between}
/* スロット */
.slot{background:linear-gradient(#ffcf5a,#e08a00);padding:12px;border-radius:22px;box-shadow:0 6px 0 #8a4b00;width:100%;max-width:360px}
.lamps{display:flex;justify-content:space-around;margin-bottom:8px}
.lamp{width:34px;height:34px;border-radius:50%;background:#5a2d00;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:16px}
.lamp.on{background:#fff36a;box-shadow:0 0 18px 6px #fff36a;color:#7a3a00}
.lamp.on.rev{background:#ff6a6a;box-shadow:0 0 18px 6px #ff6a6a;color:#fff}
.reels{display:flex;gap:6px;background:#1a0d00;padding:8px;border-radius:12px}
.reel{flex:1;height:110px;background:linear-gradient(#ddd,#fff 30%,#fff 70%,#ccc);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;overflow:hidden}
.reel.spin span{filter:blur(2px);transform:scaleY(1.3)}
.reel .seven{color:#e10000;text-shadow:0 3px 0 #7a0000;font-family:Impact,"Arial Black",sans-serif}
.reel .bar{font-size:26px;background:#222;color:#fff;padding:4px 8px;border-radius:4px}
.stops{display:flex;gap:6px;margin-top:10px}
.stops button{flex:1;padding:14px 0;border:0;border-radius:50px;background:#d40000;color:#fff;font-weight:900;font-size:15px;box-shadow:0 5px 0 #6a0000;cursor:pointer}
.stops button:active{transform:translateY(4px);box-shadow:0 1px 0 #6a0000}
.stops button:disabled{background:#7a3030;box-shadow:0 2px 0 #3a0000}
.coins{font-size:28px;font-weight:900;color:#ffd84a;text-shadow:0 2px 0 #7a4a00;margin-top:8px}
/* 結果 */
.modal{position:fixed;inset:0;background:rgba(12,5,24,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:7}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border-radius:20px;padding:22px 18px;max-width:380px;width:100%;max-height:92dvh;overflow:auto;text-align:center}
.mbox h2{margin:0 0 6px;font-size:22px}
.mbox .score{font-size:48px;font-weight:900;color:var(--accent)}
.mbox p{font-size:14px;line-height:1.7;margin:8px 0}
.mbox .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.new{color:var(--pink);font-weight:900}
.mbox details{text-align:left;margin-top:12px;font-size:13px;color:var(--sub)}
canvas.play{display:block;touch-action:none;max-width:100%;max-height:100%;width:auto;height:100%;aspect-ratio:360/520;border-radius:16px}
</style>
</head>
<body>
<header><button class="back" id="backBtn">← ちくわゲームズ</button><span class="ttl" id="ttl">ちくわでるでる！ドーパミン</span></header>
<div id="app">
  <div class="screen" id="sMenu">
    <div class="scroll">
      <div class="logo"><h1>ちくわでるでる！<br>ドーパミン</h1><p>手軽でテンポよく、気持ちいいミニゲーム集</p></div>
      <button class="arc" id="arcBtn">🎮 アーケード<small>4つのゲームを連続で！合計点で勝負</small><div class="best" id="arcBest"></div></button>
      <div class="cards" id="cards"></div>
      <details style="max-width:440px;margin:16px auto 0;font-size:13px;color:var(--sub)"><summary>セーブの引っ越し・更新履歴</summary>
        <div id="move"></div>
        <p>β0.2.0（2026-11-03）アーケード（4つ連続）を追加。麻雀牌の絵を描き直した。<br>β0.1.0（2026-11-03）最初の試作。麻雀「あと1手」・777揃え・空き缶プレス・ゴミ箱スローの4つ。</p>
      </details>
    </div>
  </div>
  <div class="screen" id="sGame" hidden>
    <div class="hud"><span>スコア <b id="hSc">0</b></span><span class="combo" id="hCombo"></span><div class="tbar" id="hTbar"><i id="hT"></i></div></div>
    <div class="stage" id="stage"></div>
  </div>
</div>
<div class="modal" id="mResult" hidden>
  <div class="mbox">
    <h2 id="rTitle"></h2>
    <div class="score" id="rScore">0</div>
    <p id="rInfo"></p>
    <div class="row"><button class="btn" id="rAgain">もう一回</button><button class="btn sub" id="rMenu">ほかのゲーム</button></div>
    <div class="row"><button class="btn sub" id="rShare">シェア</button></div>
  </div>
</div>
<div class="modal" id="mStage" hidden>
  <div class="mbox">
    <h2 id="sTitle"></h2>
    <div class="steps" id="sSteps"></div>
    <p id="sInfo"></p>
    <div class="row"><button class="btn" id="sNext">次へ</button></div>
  </div>
</div>
<div id="flash"></div>
<canvas id="fx"></canvas>

<script src="../common/v1/core.js"></script>
<script src="../common/v1/share.js"></script>
<script src="../common/v1/save.js"></script>
<script src="../common/v1/move.js"></script>
<script>
(() => {
'use strict';
const VERSION = 'β0.2.0';
const KEY = 'chikuwa-dopamine-v1';
CG.init({ game: 'chikuwa-dopamine', title: 'ちくわでるでる！ドーパミン', version: VERSION });
try { CG.move.mount(document.getElementById('move'), { keys: [KEY] }); } catch (e) {}

/* ---- 画面の拡大を止める（共通ルール 19 章） ---- */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('touchstart', e => { if (e.touches.length > 1 && e.target.closest && e.target.closest('.modal')) e.preventDefault(); }, { passive: false });

const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---- 保存 ---- */
const save = (() => { try { return Object.assign({ best: {} }, JSON.parse(CG.ls.get(KEY, '{}'))); } catch (e) { return { best: {} }; } })();
const persist = () => CG.ls.set(KEY, JSON.stringify(save));

/* ---- 効果音（WebAudio。読み込むファイルはない） ---- */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = false; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type = 'square', vol = 0.08, when = 0, slide = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, vol = 0.2, when = 0, lp = 1200) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + when, len = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = lp; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
}
const SFX = {
  tap() { tone(660, 0.05, 'square', 0.05); },
  good(n = 0) { const b = 520 * Math.pow(1.06, Math.min(n, 12)); tone(b, 0.08, 'square', 0.07); tone(b * 1.5, 0.12, 'square', 0.06, 0.07); },
  bad() { tone(200, 0.25, 'sawtooth', 0.08, 0, 0.5); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'square', 0.07, i * 0.08)); tone(1568, 0.4, 'triangle', 0.06, 0.32); },
  jackpot() { for (let i = 0; i < 14; i++) tone(pick([1047, 1319, 1568, 2093]), 0.08, 'square', 0.05, i * 0.06); [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.3, 'triangle', 0.07, 0.1 + i * 0.1)); },
  coin() { tone(1319, 0.05, 'square', 0.04); tone(1976, 0.12, 'square', 0.04, 0.05); },
  crush() { noise(0.25, 0.45, 0, 900); tone(90, 0.25, 'sine', 0.3, 0, 0.4); },
  swish() { noise(0.18, 0.12, 0, 3000); },
  rim() { tone(420, 0.12, 'triangle', 0.1); tone(380, 0.18, 'triangle', 0.08, 0.1); },
  thud() { tone(120, 0.15, 'sine', 0.2, 0, 0.5); },
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---- 演出：粒・文字・フラッシュ・ゆれ ---- */
const fx = $('fx'), fc = fx.getContext('2d');
let parts = [], texts = [];
function fitFx() { const d = window.devicePixelRatio || 1; fx.width = innerWidth * d; fx.height = innerHeight * d; fc.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', fitFx); fitFx();
const PAL = ['#ffb03b', '#ff5fa2', '#8f7bff', '#4ee38a', '#fff36a', '#5fd3ff'];
function burst(x, y, n = 30, cols = PAL, spd = 7, kind = 'sq') {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random()); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, life: 1, c: pick(cols), s: 4 + Math.random() * 6, r: Math.random() * 6, kind }); }
}
function fountain(x, y, n = 60) { for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - 0.5) * 9, vy: -8 - Math.random() * 10, life: 1.6, c: pick(['#ffd84a', '#ffe98a', '#f2b23a']), s: 9 + Math.random() * 5, r: Math.random() * 6, kind: 'coin' }); }
function floatText(x, y, t, col = '#fff', size = 30) { texts.push({ x, y, t, col, size, life: 1 }); }
function elXY(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
function flash(a = 0.6) { const f = $('flash'); f.style.transition = 'none'; f.style.opacity = a; requestAnimationFrame(() => { f.style.transition = 'opacity .35s'; f.style.opacity = 0; }); }
function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
let lastFx = 0;
function fxLoop(ts) {
  const dt = Math.min(0.05, (ts - lastFx) / 1000 || 0); lastFx = ts;
  fc.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => (p.life -= dt * 0.9) > 0);
  for (const p of parts) {
    p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.r += 0.2;
    fc.globalAlpha = Math.min(1, p.life * 1.5); fc.fillStyle = p.c;
    fc.save(); fc.translate(p.x, p.y); fc.rotate(p.r);
    if (p.kind === 'coin') { fc.scale(Math.abs(Math.cos(p.r)), 1); fc.beginPath(); fc.arc(0, 0, p.s, 0, 7); fc.fill(); fc.fillStyle = '#b07a00'; fc.fillRect(-1.5, -p.s * 0.5, 3, p.s); }
    else fc.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
    fc.restore();
  }
  texts = texts.filter(t => (t.life -= dt * 0.8) > 0);
  fc.textAlign = 'center'; fc.textBaseline = 'middle';
  for (const t of texts) {
    const k = 1 + Math.max(0, (t.life - 0.85)) * 4;
    fc.globalAlpha = Math.min(1, t.life * 2); fc.font = '900 ' + Math.round(t.size * k) + 'px system-ui,sans-serif';
    fc.lineWidth = 6; fc.strokeStyle = 'rgba(30,10,50,.85)'; fc.strokeText(t.t, t.x, t.y - (1 - t.life) * 50);
    fc.fillStyle = t.col; fc.fillText(t.t, t.x, t.y - (1 - t.life) * 50);
  }
  fc.globalAlpha = 1;
  requestAnimationFrame(fxLoop);
}
requestAnimationFrame(fxLoop);

/* ---- ゲームの進行（共通） ---- */
const H = { game: null, score: 0, combo: 0, time: 0, total: 0, running: false, timer: 0, ended: false };
function setScore(v) { H.score = Math.max(0, Math.round(v)); $('hSc').textContent = H.score; $('hSc').classList.remove('pop'); void $('hSc').offsetWidth; $('hSc').classList.add('pop'); }
function addScore(v) { setScore(H.score + v); }
function setCombo(n) { H.combo = n; $('hCombo').textContent = n >= 2 ? n + ' COMBO!' : ''; }
function setTime(t) { H.time = Math.max(0, t); const f = H.total ? H.time / H.total : 1; $('hT').style.transform = 'scaleX(' + f + ')'; $('hTbar').classList.toggle('low', f < 0.25); }
function startTimer(sec, onEnd) {
  H.total = sec; setTime(sec); let prev = performance.now();
  clearInterval(H.timer);
  H.timer = setInterval(() => { if (!H.running || document.hidden) { prev = performance.now(); return; } const n = performance.now(); setTime(H.time - (n - prev) / 1000); prev = n; if (H.time <= 0) { clearInterval(H.timer); onEnd(); } }, 50);
}
function hideTimer(h) { $('hTbar').style.visibility = h ? 'hidden' : 'visible'; }
function play(g) {
  $('mStage').hidden = true;
  H.game = g; H.running = true; H.ended = false; setScore(0); setCombo(0); hideTimer(false);
  $('sMenu').hidden = true; $('sGame').hidden = false; $('mResult').hidden = true; $('ttl').textContent = H.arc ? 'STAGE ' + (H.arc.i + 1) + '/' + GAMES.length + '　' + g.title : g.title; $('backBtn').textContent = '← もどる';
  const st = $('stage'); st.innerHTML = '';
  g.start(st);
}
function finish(info) {
  if (H.ended) return; H.ended = true; H.running = false; clearInterval(H.timer);
  const g = H.game; if (g.stop) g.stop();
  const best = save.best[g.id] || 0, rec = H.score > best;
  if (rec) { save.best[g.id] = H.score; persist(); }
  if (H.arc) { H.arc.scores[H.arc.i] = H.score; return setTimeout(arcStage, 600); }
  H.shareMsg = 'ちくわでるでる！ドーパミンの「' + g.title + '」で ' + H.score + '点！';
  setTimeout(() => {
    $('rTitle').textContent = g.title; $('rScore').textContent = H.score;
    $('rInfo').innerHTML = (info || '') + '<br>' + (rec && H.score > 0 ? '<span class="new">ベスト更新！</span>' : 'ベスト ' + Math.max(best, H.score));
    $('mResult').hidden = false;
    if (rec && H.score > 0) { const [x, y] = elXY($('rScore')); burst(x, y, 60); SFX.win(); }
  }, 600);
}
/* アーケード：GAMES を順に遊び、合計点で勝負 */
function startArcade() { H.arc = { i: 0, scores: [] }; H.arcDone = false; play(GAMES[0]); }
function steps(now) { return GAMES.map((g, i) => '<span class="' + (i < now ? 'done' : i === now ? 'now' : '') + '">' + g.icon + '</span>').join(''); }
function arcStage() {
  const a = H.arc, total = a.scores.reduce((x, y) => x + y, 0), g = GAMES[a.i];
  if (a.i < GAMES.length - 1) {
    const nx = GAMES[a.i + 1];

const MJ = (() => {

        if (Math.random() < (one ? 0.7 : 0.65)) { const s = one ? suit : rnd(3) * 9, n = rnd(7); add(s + n); add(s + n + 1); add(s + n + 2); }
        else { const t = tileOf(); add(t); add(t); add(t); }

const SLOT = (() => {
  const SYM = ['🍒', '🔔', '🍋', 'BAR', '🍉'];
  let root, reels, lamps, stops, coinsEl, msg, spinT = 0, round = 0, order = [], step = 0, accepting = false, coins = 0, lives = 3, rev = false, alive = false;
  const symHtml = s => s === '7' ? '<span class="seven">7</span>' : s === 'BAR' ? '<span class="bar">BAR</span>' : '<span>' + s + '</span>';
  function spinAll() {
    reels.forEach(r => { r.classList.add('spin'); r.dataset.stop = ''; });
    clearInterval(spinT);
    spinT = setInterval(() => reels.forEach(r => { if (!r.dataset.stop) r.innerHTML = symHtml(pick(SYM.concat('7'))); }), 60);
  }
  function stopReel(i, s) { const r = reels[i]; r.dataset.stop = '1'; r.classList.remove('spin'); r.innerHTML = symHtml(s); r.firstChild.classList.add('pop'); }
  function setCoins(v) { coins = v; coinsEl.textContent = '🪙 ' + coins; setScore(coins); }
  async function roundStart() {
    if (!alive) return;
    round++; step = 0; accepting = false;
    rev = round >= 5 && Math.random() < 0.45;
    const len = 3;
    order = shuffle([0, 1, 2]).slice(0, len);
    stops.forEach(b => b.disabled = true);
    msg.innerHTML = '確変 ' + round + ' 回目　<b style="color:#ffd84a">ランプを見て！</b>';

      lamps[i].classList.add('on'); lamps[i].classList.toggle('rev', rev); lamps[i].textContent = ''; tone(880 + i * 220, 0.1, 'square', 0.06);
      await wait(sp); lamps[i].classList.remove('on', 'rev'); await wait(sp * 0.35);
    }
    if (!alive) return;
    if (rev) order.reverse();
    msg.innerHTML = rev ? '<b style="color:#ff8a8a">赤は逆の順番！</b> STOPを押せ！' : '<b style="color:#fff36a">光った順に</b> STOPを押せ！';
    stops.forEach(b => b.disabled = false); accepting = true;
  }
  async function press(i) {
    if (!accepting || reels[i].dataset.stop) return;
    if (order[step] === i) {
      stopReel(i, '7'); step++; SFX.good(step); buzz(15);
      const [x, y] = elXY(reels[i]); burst(x, y, 14, ['#ff3030', '#ffd84a']);
      if (step === 3) {
        accepting = false; stops.forEach(b => b.disabled = true);
        setCombo(H.combo + 1);

        flash(0.8); SFX.jackpot(); buzz([60, 40, 120]);
        const [cx, cy] = elXY(root.querySelector('.reels'));

        for (let k = 0; k < 10; k++) { setTimeout(() => { if (alive) { setCoins(coins + Math.round(win / 10)); SFX.coin(); } }, 150 + k * 70); }
        setTime(H.time + 3);
        await wait(1700); roundStart();
      }

      accepting = false; stops.forEach(b => b.disabled = true);
      reels.forEach((r, k) => { if (!r.dataset.stop) stopReel(k, pick(SYM)); });
      SFX.bad(); shake(root.querySelector('.slot')); buzz([40, 40, 40]); setCombo(0); lives--;
      floatText(innerWidth / 2, elXY(root.querySelector('.reels'))[1] - 80, 'ハズレ…', '#ff5a4e', 38);
      msg.innerHTML = 'のこり ' + '❤️'.repeat(Math.max(0, lives));

    id: 'slot', title: '777揃え', icon: '🎰', desc: '光った順にSTOP！777を揃えろ',
    start(st) {

    test: () => ({ order, accepting, round, lives }),
  };
})();

/* ---- canvas のゲームの共通（論理 360×520） ---- */
function makeCanvas(st) {
  const cv = document.createElement('canvas'); cv.className = 'play'; cv.width = 720; cv.height = 1040; st.appendChild(cv);
  const g = cv.getContext('2d'); g.setTransform(2, 0, 0, 2, 0, 0);
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 360, y: (e.clientY - r.top) / r.height * 520 }; };
  const toScreen = (x, y) => { const r = cv.getBoundingClientRect(); return [r.left + x / 360 * r.width, r.top + y / 520 * r.height]; };
  return { cv, g, pos, toScreen };
}

  function drawBottle(g, x, y, rot) {
    g.save(); g.translate(x, y); g.rotate(rot);
    g.fillStyle = 'rgba(120,220,170,.75)'; g.beginPath(); g.roundRect(-11, -10, 22, 34, 5); g.fill(); g.fillRect(-5, -26, 10, 18);
    g.fillStyle = '#795548'; g.fillRect(-5, -30, 10, 5); g.fillStyle = 'rgba(255,255,255,.5)'; g.fillRect(-7, -6, 3, 24);
    g.restore();
  }
  function tap(e) {
    if (!alive) return; e.preventDefault();
    const p = C.pos(e);
    if (p.y > 380 && p.x > 240) return doPress();
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i]; if (it.fly) continue;
      if (Math.abs(p.x - it.x) < 26 && Math.abs(p.y - it.y) < 32) {
        if (it.kind === 'bottle') {
          items.splice(i, 1); SFX.bad(); setCombo(0); addScore(-30); setTime(H.time - 2); buzz([30, 30]);
          const [x, y] = C.toScreen(it.x, it.y); floatText(x, y, 'びんは分別！', '#ff5a4e', 22); burst(x, y, 16, ['#9fe8c8', '#ffffff'], 5);
          return;
        }
        if (hopper.length >= CAP) { const [x, y] = C.toScreen(it.x, it.y); floatText(x, y, 'いっぱい！プレス！', '#ffb03b', 20); SFX.thud(); return; }
        it.fly = { t: 0, sx: it.x, sy: it.y };
        SFX.good(hopper.length);
        return;
      }
    }
  }
  function doPress() {
    if (pressing || !hopper.length) return;
    pressing = { t: 0, n: hopper.length, gold: hopper.filter(h => h.kind === 'gold').length };
  }
  function frame(ts) {
    if (!alive) return;
    const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
    if (!document.hidden) {
      spawnT -= dt; if (spawnT <= 0) { spawn(); spawnT = Math.max(0.35, 0.9 - crushed * 0.01); }
      for (const it of items) {
        if (it.fly) { it.fly.t += dt * 2.6; const f = Math.min(1, it.fly.t); it.x = it.fly.sx + (150 - it.fly.sx) * f; it.y = it.fly.sy + (420 - hopper.length * 2 - it.fly.sy) * f - Math.sin(f * Math.PI) * 90; it.a += 0.3; if (f >= 1) { it.done = true; hopper.push(it); } }
        else { it.t += dt; it.life -= dt; }
      }
      items = items.filter(it => !it.done && it.life > 0);
      if (pressing) {
        pressing.t += dt;
        const down = pressing.t < 0.18 ? pressing.t / 0.18 : pressing.t < 0.45 ? 1 : Math.max(0, 1 - (pressing.t - 0.45) / 0.25);
        plate = down;
        if (pressing.t >= 0.18 && !pressing.hit) {
          pressing.hit = true;
          const n = pressing.n, pts = (n * n * 10 + pressing.gold * 120) * Math.max(1, Math.min(H.combo + 1, 6)) / (n >= CAP ? 1 : 1);
          SFX.crush(); buzz(n >= CAP ? [80, 30, 80] : 50); tShake = 0.35;
          setCombo(H.combo + 1); addScore(pts); crushed += n;
          const [x, y] = C.toScreen(150, 430);
          burst(x, y, 20 + n * 8, ['#cfd8dc', '#ffffff', '#ffb03b'], 8);
          floatText(x, y - 70, n >= CAP ? 'MAXプレス！' : n + '缶プレス！', n >= CAP ? '#ffd84a' : '#fff', n >= CAP ? 36 : 26);
          floatText(x + 40, y - 30, '+' + Math.round(pts), '#ffd84a', 22);
          if (n >= CAP) { flash(0.5); setTime(H.time + 2); }
          flats.push({ n, col: hopper[0].col, t: 0 }); hopper = [];
        }
        if (pressing.t > 0.7) pressing = null;
      }
      flats.forEach(f => f.t += dt); flats = flats.filter(f => f.t < 1.2);
      if (tShake > 0) tShake -= dt;
    }
    draw();
    raf = requestAnimationFrame(frame);
  }
  function draw() {
    const g = C.g; g.save();
    if (tShake > 0) g.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
    g.fillStyle = '#2e2a3a'; g.fillRect(-10, -10, 380, 540);
    g.fillStyle = '#3a3550'; for (let i = 0; i < 8; i++) g.fillRect(0, 40 + i * 44, 360, 2);
    g.fillStyle = '#c7b5e8'; g.font = '700 13px system-ui,sans-serif'; g.textAlign = 'center'; g.fillText('缶をタップ → プレス機へ　（びんはさわらない！）', 180, 26);
    for (const it of items) {
      const fade = it.fly ? 1 : Math.min(1, it.life * 2), wob = it.fly ? 0 : Math.sin(it.t * 8) * 0.08;
      g.globalAlpha = fade;
      if (it.kind === 'bottle') drawBottle(g, it.x, it.y, wob + it.a * 0.05);
      else { drawCan(g, it.x, it.y, it.kind === 'gold' ? '#ffd54f' : it.col, 1, 0, wob + (it.fly ? it.a : 0)); if (it.kind === 'gold' && !it.fly) { g.fillStyle = 'rgba(255,240,150,' + (0.4 + 0.3 * Math.sin(it.t * 10)) + ')'; g.beginPath(); g.arc(it.x, it.y, 30, 0, 7); g.fill(); } }
      g.globalAlpha = 1;
    }
    // プレス機
    const bx = 90, by = 360, bw = 120, bh = 120;
    g.fillStyle = '#546e7a'; g.fillRect(bx - 16, by - 70, 12, bh + 70); g.fillRect(bx + bw + 4, by - 70, 12, bh + 70);
    g.fillStyle = '#263238'; g.fillRect(bx, by + 10, bw, bh - 10);
    g.fillStyle = '#37474f'; g.fillRect(bx, by + bh - 8, bw, 8);
    hopper.forEach((h, i) => { const col = i % 3, row = Math.floor(i / 3); drawCan(g, bx + 22 + col * 38, by + bh - 30 - row * 42, h.kind === 'gold' ? '#ffd54f' : h.col, 0.9); });
    flats.forEach(f => { g.globalAlpha = Math.max(0, 1 - f.t / 1.2); for (let i = 0; i < f.n; i++) drawCan(g, bx + 20 + (i % 3) * 40, by + bh - 14 - Math.floor(i / 3) * 6, f.col, 1, 1); g.globalAlpha = 1; });
    const py = by - 60 + plate * (bh - 26);
    g.fillStyle = '#90a4ae'; g.fillRect(bx - 4, py, bw + 8, 22); g.fillStyle = '#607d8b'; g.fillRect(bx + bw / 2 - 8, by - 120, 16, py - (by - 120));
    g.fillStyle = '#ffb03b'; g.fillRect(bx - 4, py + 16, bw + 8, 6);
    // 満タンの目盛り
    g.fillStyle = '#c7b5e8'; g.font = '700 12px system-ui,sans-serif'; g.fillText(hopper.length + ' / ' + CAP, bx + bw / 2, by + bh + 18);
    // プレスボタン
    const ready = hopper.length > 0 && !pressing, full = hopper.length >= CAP;
    g.fillStyle = ready ? (full ? '#ff3d3d' : '#e53935') : '#6d4c4c';
    g.beginPath(); g.arc(300, 440, 46 + (full ? Math.sin(performance.now() / 90) * 4 : 0), 0, 7); g.fill();
    g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.arc(300, 446, 46, 0, Math.PI); g.fill();
    g.fillStyle = '#fff'; g.font = '900 18px system-ui,sans-serif'; g.fillText('プレス', 300, 446);
    g.restore();
  }
  return {
    id: 'can', title: '空き缶プレス', icon: '🥫', desc: '缶を集めてまとめてプレス！',
    start(st) {
      C = makeCanvas(st); items = []; hopper = []; plate = 0; pressing = null; spawnT = 0.3; crushed = 0; alive = true; flats = []; last = performance.now(); tShake = 0;
      C.cv.addEventListener('pointerdown', tap);
      startTimer(35, () => finish(crushed + '缶つぶした'));
      raf = requestAnimationFrame(frame);
    },
    stop() { alive = false; cancelAnimationFrame(raf); },
  };
})();

/* =====================================================================
   4. ゴミ箱スロー：ゲージが「ちょうどいい」所でタップ
   ===================================================================== */
const THROW = (() => {
  let C, raf, alive, last, st, needle, dir, binX, binW, zone, ball, shots, miss, streak, wind, msgT, msgS;
  const GX = 30, GW = 300, GY = 470;               // ゲージの位置
  const PX = 50, PY = 400;                          // 投げる位置
  function newShot() {
    binX = 170 + Math.random() * 150; binW = Math.max(34, 62 - shots * 2.2);
    wind = shots >= 5 ? (Math.random() - 0.5) * Math.min(1, (shots - 4) * 0.25) : 0;
    // パワー p（0〜1）で着地点 x = PX + 40 + p*280 + wind*60。ゴミ箱に入る p の幅がゾーン
    const land = x => (x - PX - 40 - wind * 60) / 280;
    zone = [land(binX - binW / 2 + 6), land(binX + binW / 2 - 6)];
    needle = 0; dir = 1; ball = null;
  }
  function speed() { return 0.9 + shots * 0.09; }
  function tap(e) {
    if (!alive) return; e.preventDefault();
    if (ball) return;
    const p = needle, landX = PX + 40 + p * 280 + wind * 60;
    const inBin = Math.abs(landX - binX) <= binW / 2 - 6, rim = !inBin && Math.abs(landX - binX) <= binW / 2 + 6;
    const center = 1 - Math.abs(landX - binX) / (binW / 2);
    ball = { t: 0, landX, inBin, rim, center, rot: 0 };
    SFX.swish();
  }
  function result() {
    const b = ball; shots++;
    if (b.inBin || (b.rim && Math.random() < 0.5)) {
      streak++; setCombo(streak);
      const perfect = b.inBin && b.center > 0.72;
      const pts = (perfect ? 150 : b.inBin ? 100 : 60) * Math.min(streak, 8);
      addScore(pts);
      const [x, y] = C.toScreen(binX, 380);
      if (b.rim) SFX.rim(); setTimeout(() => (perfect ? SFX.win() : SFX.good(streak)), b.rim ? 150 : 0);
      burst(x, y, perfect ? 50 : 24, perfect ? PAL : ['#ffffff', '#ffb03b']); buzz(perfect ? [30, 30, 60] : 25);
      if (perfect) flash(0.35);
      floatText(x, y - 60, perfect ? 'スウィッシュ！' : b.rim ? 'ガコン…イン！' : 'ナイス！', perfect ? '#ffd84a' : '#fff', perfect ? 34 : 26);
      floatText(x, y - 25, '+' + pts, '#ffd84a', 22);
    } else {
      miss++; streak = 0; setCombo(0); SFX.thud(); buzz([40, 40, 40]);
      const [x, y] = C.toScreen(b.landX, 420); floatText(x, y - 40, b.rim ? 'ガコン…はずれ' : 'おしい！', '#ff5a4e', 26);
    }
    if (miss >= 3) return setTimeout(() => alive && finish(shots + '投 ／ ' + (shots - miss) + '回 入った'), 600);
    setTimeout(() => { if (alive) newShot(); }, 700);
  }
  function frame(ts) {
    if (!alive) return;
    const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
    if (!document.hidden) {
      if (!ball) { needle += dir * speed() * dt; if (needle > 1) { needle = 1; dir = -1; } if (needle < 0) { needle = 0; dir = 1; } }
      else { ball.t += dt * 1.5; ball.rot += dt * 12; if (ball.t >= 1 && !ball.ended) { ball.ended = true; result(); } }
    }
    draw();
    raf = requestAnimationFrame(frame);
  }
  function draw() {
    const g = C.g;
    const sky = g.createLinearGradient(0, 0, 0, 520); sky.addColorStop(0, '#2a2350'); sky.addColorStop(1, '#4a3a6a');
    g.fillStyle = sky; g.fillRect(0, 0, 360, 520);
    g.fillStyle = '#5b4a3a'; g.fillRect(0, 430, 360, 90); g.fillStyle = '#6d5a48'; g.fillRect(0, 430, 360, 4);
    g.fillStyle = '#c7b5e8'; g.font = '700 13px system-ui,sans-serif'; g.textAlign = 'center';
    g.fillText('のこり ' + '🧻'.repeat(3 - miss) + '　　' + shots + '投目', 180, 24);
    if (wind) { g.fillText('風 ' + (wind > 0 ? '→' : '←').repeat(Math.ceil(Math.abs(wind) * 3)), 180, 44); }
    // ゴミ箱
    const bh = 64, top = 430 - bh;
    g.fillStyle = '#90a4ae'; g.beginPath(); g.moveTo(binX - binW / 2, top); g.lineTo(binX + binW / 2, top); g.lineTo(binX + binW / 2 - 6, 430); g.lineTo(binX - binW / 2 + 6, 430); g.closePath(); g.fill();
    g.fillStyle = '#607d8b'; for (let i = 1; i < 4; i++) g.fillRect(binX - binW / 2 + i * binW / 4 - 1, top + 6, 2, bh - 12);
    g.fillStyle = '#cfd8dc'; g.fillRect(binX - binW / 2 - 3, top - 4, binW + 6, 6);
    // 投げる人（ちくわくん）
    g.fillStyle = '#d99a52'; g.beginPath(); g.roundRect(PX - 14, PY - 6, 28, 36, 12); g.fill();
    g.fillStyle = '#4a2a14'; g.beginPath(); g.ellipse(PX, PY - 2, 5, 3, 0, 0, 7); g.fill();
    g.fillStyle = '#2a1a10'; g.fillRect(PX - 7, PY + 8, 3, 3); g.fillRect(PX + 4, PY + 8, 3, 3);
    // 玉
    if (ball) {
      const f = Math.min(1, ball.t), sx = PX + 10, sy = PY - 10, ex = ball.landX, ey = top + 4;
      const peak = 120 + (ex - sx) * 0.35;
      let x = sx + (ex - sx) * f, y = sy + (ey - sy) * f - Math.sin(f * Math.PI) * peak;
      if (ball.ended && ball.inBin) { y = ey + 20; }
      drawBall(g, x, y, ball.rot);
    } else drawBall(g, PX + 10, PY - 10, 0);
    // ゲージ
    g.fillStyle = '#1b1030'; g.beginPath(); g.roundRect(GX, GY, GW, 22, 11); g.fill();
    const z0 = Math.max(0, zone[0]), z1 = Math.min(1, zone[1]);
    if (z1 > z0) { g.fillStyle = '#4ee38a'; g.fillRect(GX + z0 * GW, GY + 2, (z1 - z0) * GW, 18); g.fillStyle = '#b6ffd2'; const zc = (z0 + z1) / 2; g.fillRect(GX + zc * GW - 3, GY + 2, 6, 18); }
    const nx = GX + needle * GW;
    g.fillStyle = '#fff'; g.beginPath(); g.moveTo(nx, GY - 2); g.lineTo(nx - 7, GY - 12); g.lineTo(nx + 7, GY - 12); g.closePath(); g.fill(); g.fillRect(nx - 2, GY, 4, 22);
    g.fillStyle = '#c7b5e8'; g.font = '700 12px system-ui,sans-serif'; g.fillText(ball ? '' : '緑のところでタップ！', 180, GY + 40);
  }
  function drawBall(g, x, y, r) {
    g.save(); g.translate(x, y); g.rotate(r);
    g.fillStyle = '#f5f5f5'; g.beginPath(); for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2, rr = 10 + (i % 2) * 2; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.closePath(); g.fill();
    g.strokeStyle = '#bdbdbd'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(-6, -3); g.lineTo(4, 2); g.moveTo(-2, 6); g.lineTo(5, -5); g.stroke();
    g.restore();
  }
  return {
    id: 'throw', title: 'ゴミ箱スロー', icon: '🗑️', desc: 'ちょうどいい所でタップ！',
    start(s) {
      st = s; C = makeCanvas(s); alive = true; last = performance.now(); shots = 0; miss = 0; streak = 0;
      hideTimer(true); newShot();
      C.cv.addEventListener('pointerdown', tap);
      raf = requestAnimationFrame(frame);
    },
    stop() { alive = false; cancelAnimationFrame(raf); },
  };
})();

/* ---- メニュー ---- */
const GAMES = [MJ, SLOT, CAN, THROW];
function renderMenu() {
  $('arcBest').textContent = 'ベスト ' + (save.best.arcade || 0);
  const c = $('cards'); c.innerHTML = '';
  GAMES.forEach(g => {
    const b = document.createElement('button'); b.className = 'gcard';
    b.innerHTML = '<span class="ic">' + g.icon + '</span><b>' + g.title + '</b><small>' + g.desc + '</small><div class="best">ベスト ' + (save.best[g.id] || 0) + '</div>';
    b.onclick = () => { ac(); SFX.tap(); play(g); };
    c.appendChild(b);
  });
}
renderMenu();

/* 試験用（dev/ のテストが使う） */
window.DOPA = { H, MJ, SLOT, CAN, THROW, play, finish, toMenu, startArcade, GAMES };
})();
