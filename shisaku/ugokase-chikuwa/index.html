<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>うごかせ！ちくわくん｜ちくわゲームズ</title>
<meta name="description" content="ぽんこつちくわ君ロボに指示ピースを組んで、製品を出荷ヤードへ運ばせよう。ちくわいんだすとりーずの社長になって、自己肯定感ボロボロのちくわ君を立ち直らせつつ大金持ちをめざす、パズル×プログラミングゲーム。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../common/v1/common.css">
<style>
:root {
  --bg: #F6EEDD; --ink: #3B2A1C; --sub: #7A6450; --card: #FFFDF7; --line: #E3D4B8;
  --chikuwa: #C9772E; --chikuwa2: #E9A55B; --chikuwa3: #F3DDB2;
  --run: #3E9A51; --stop: #D0473C; --build: #3E8ED0;
  --hp: #E0604E; --mp: #6C8FE0;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'M PLUS Rounded 1c', system-ui, sans-serif; overflow: hidden; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
.hide { display: none !important; }

/* ---------- タイトル ---------- */
#title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; overflow-y: auto; touch-action: pan-y; background: linear-gradient(#5F7F74, #3D5A50 55%, #2B3F38); color: #FFF8EA; padding: 14px 18px 28px; }
#title .back { align-self: flex-start; color: #FFE7C2; text-decoration: none; font-size: 13px; opacity: .9; }
#title h1 { margin: 16px 0 2px; font-size: 30px; font-weight: 800; letter-spacing: .02em; text-shadow: 0 3px 0 #1E2C27; text-align: center; line-height: 1.15; }
#title h1 small { display: block; font-size: 13px; font-weight: 500; opacity: .85; margin-bottom: 4px; letter-spacing: .1em; }
#titleCv { width: 220px; height: 160px; image-rendering: pixelated; margin: 6px 0; }
.story { max-width: 400px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; line-height: 1.75; }
.story b { color: #FFD48A; }
.tbtns { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; margin-top: 16px; }
.big { padding: 14px; border-radius: 14px; font-size: 18px; font-weight: 800; background: var(--chikuwa2); color: #3B2A1C; box-shadow: 0 4px 0 #9A5A20; }
.big:active { transform: translateY(2px); box-shadow: 0 2px 0 #9A5A20; }
.big.sub { background: #FFF2DC; box-shadow: 0 4px 0 #B7A27E; font-size: 15px; }
.ver { margin-top: 14px; font-size: 11px; opacity: .7; }

/* ---------- ゲーム画面 ---------- */
#game { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; }
#top { display: flex; align-items: center; gap: 8px; padding: 6px 10px 4px; font-size: 12.5px; background: #3D5A50; color: #FFF8EA; }
#top a { color: #FFE7C2; text-decoration: none; white-space: nowrap; }
#top .ttl { flex: 1; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#top button { background: rgba(255,255,255,.14); border-radius: 8px; padding: 3px 8px; color: #fff; }
#info { display: flex; align-items: center; gap: 6px; padding: 5px 10px; background: #FFF8EA; border-bottom: 1px solid var(--line); font-size: 13px; }
#clock { flex: 1; font-size: 12px; letter-spacing: -.02em; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#coin { font-weight: 800; color: #9A5A20; white-space: nowrap; }
#speed { display: flex; gap: 2px; position: relative; }
#spdTip { position: absolute; top: calc(100% + 10px); right: 0; z-index: 30; width: max-content; max-width: 230px; background: #FFF8EA; color: #3A2A1A; border: 2px solid var(--chikuwa); border-radius: 12px; padding: 7px 10px; font-size: 12px; font-weight: 700; line-height: 1.45; box-shadow: 0 4px 12px rgba(0,0,0,.25); animation: tipBob 1.2s ease-in-out infinite; pointer-events: none; }
#spdTip::before { content: ''; position: absolute; top: -9px; right: 74px; border: 8px solid transparent; border-top: 0; border-bottom-color: var(--chikuwa); }
body.mopen #spdTip { display: none; }
/* 好景気・不景気のカットイン */
#cutin { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; overflow: hidden; pointer-events: auto; animation: ciBg 2.8s ease forwards; }
#cutin.up { background: radial-gradient(circle, rgba(255,214,90,.55), rgba(214,60,40,.55)); }
#cutin.down { background: radial-gradient(circle, rgba(70,90,120,.6), rgba(20,25,40,.75)); }
#cutin .band { width: 140%; transform: rotate(-8deg); padding: 18px 0; text-align: center; color: #fff; animation: ciIn 2.8s cubic-bezier(.2,.9,.2,1) forwards; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
#cutin.up .band { background: linear-gradient(90deg, #C62828, #F9A825, #C62828); }
#cutin.down .band { background: linear-gradient(90deg, #1E2A3A, #4A5D78, #1E2A3A); }
#cutin .ci-ic { font-size: 40px; line-height: 1; }
#cutin .ci-big { font-size: 34px; font-weight: 800; letter-spacing: .08em; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
#cutin .ci-sm { font-size: 13px; font-weight: 700; margin-top: 4px; opacity: .95; }
#cutin.down::before { content: ''; position: absolute; inset: -20%; background: repeating-linear-gradient(105deg, transparent 0 14px, rgba(200,220,255,.25) 14px 16px); animation: ciRain .6s linear infinite; }
#cutin.up::before { content: ''; position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.18) 0 8deg, transparent 8deg 20deg); animation: ciSpin 6s linear infinite; }
@keyframes ciIn { 0% { transform: translateX(110%) rotate(-8deg); } 15%, 80% { transform: translateX(0) rotate(-8deg); } 100% { transform: translateX(-110%) rotate(-8deg); } }
@keyframes ciBg { 0%, 85% { opacity: 1; } 100% { opacity: 0; } }
@keyframes ciRain { to { transform: translateY(16px); } }
@keyframes ciSpin { to { transform: rotate(360deg); } }
@keyframes tipBob { 50% { transform: translateY(3px); } }
#speed button { background: #EFE3CB; border-radius: 6px; padding: 3px 4px; font-size: 10px; min-width: 24px; }
#speed button.on { background: var(--chikuwa); color: #fff; }
#bases { display: flex; gap: 4px; padding: 4px 8px 0; overflow-x: auto; }
#bases button { background: #EFE3CB; border-radius: 8px 8px 0 0; padding: 4px 10px; font-size: 12px; white-space: nowrap; }
#bases button.on { background: var(--chikuwa); color: #fff; }
#robots { display: flex; gap: 6px; padding: 6px 8px; overflow-x: auto; background: #FBF4E6; border-bottom: 1px solid var(--line); }
.rchip { flex: 1 0 150px; max-width: 240px; background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 4px 8px; text-align: left; font-size: 11.5px; }
.rchip.on { border-color: var(--chikuwa); box-shadow: 0 0 0 2px rgba(201,119,46,.2); }
.rchip .nm { display: flex; justify-content: space-between; font-weight: 800; font-size: 12.5px; }
.rchip .st { font-weight: 500; font-size: 11px; color: var(--sub); }
.bar { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.bar i { font-style: normal; width: 34px; font-size: 10px; color: var(--sub); }
.bar span { flex: 1; height: 7px; background: #EDE2CE; border-radius: 4px; overflow: hidden; }
.bar span b { display: block; height: 100%; border-radius: 4px; }
.bar em { font-style: normal; width: 22px; text-align: right; font-size: 10px; }
#viewWrap { position: relative; flex: 1; min-height: 0; background: #2B3F38; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
#hud { position: absolute; left: 6px; top: 6px; right: 6px; display: flex; justify-content: space-between; pointer-events: none; gap: 6px; }
#hud div { background: rgba(30,40,36,.72); color: #FFF8EA; border-radius: 8px; padding: 4px 8px; font-size: 11.5px; line-height: 1.45; }
#placeBar { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: rgba(30,40,36,.88); color: #fff; border-radius: 12px; padding: 6px 8px 6px 12px; font-size: 12.5px; display: flex; align-items: center; gap: 8px; white-space: nowrap; max-width: calc(100% - 56px); }
#placeTx { overflow: hidden; text-overflow: ellipsis; }
#placeBar button:disabled, #editBar button:disabled { opacity: .45; }
#editBar { position: absolute; left: 8px; right: 50px; bottom: 8px; background: rgba(30,40,36,.9); color: #fff; border-radius: 12px; padding: 6px 8px; font-size: 12.5px; }
#editBar .eb { display: flex; gap: 6px; margin-top: 5px; }
#editBar button { flex: 1; background: #fff; color: var(--ink); border-radius: 8px; padding: 5px 4px; font-weight: 800; font-size: 12.5px; white-space: nowrap; }
#editBar button.on { background: #FFE066; }
#zoom button.on { background: #FFE066; }
#placeBar button { background: #fff; color: var(--ink); border-radius: 8px; padding: 4px 10px; font-weight: 800; }
#zoom { position: absolute; right: 6px; bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
#zoom button { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,248,234,.9); font-size: 18px; font-weight: 800; }
#ctrl { padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); background: #FFF8EA; border-top: 1px solid var(--line); }
.row { display: flex; gap: 6px; }
.row + .row { margin-top: 6px; }
.cbtn { flex: 1; border-radius: 12px; padding: 10px 4px; font-weight: 800; font-size: 15px; color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.22); }
.cbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.22); }
.cbtn.build { background: var(--build); } .cbtn.run { background: var(--run); } .cbtn.stop { background: var(--stop); }
.cbtn.run.going { background: #8BC79A; }
.sbtn { flex: 1; border-radius: 10px; padding: 7px 2px; font-size: 12.5px; font-weight: 800; background: #EFE3CB; }
.sbtn.hot { background: #CFE8F7; }

/* ---------- ダイアログ ---------- */
#modal { position: fixed; inset: 0; background: rgba(20,14,8,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
#modal .box { width: 100%; max-width: 560px; max-height: 88vh; background: var(--card); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; }
#modal .hd { display: flex; align-items: center; padding: 12px 14px 8px; gap: 8px; }
#modal .hd h2 { flex: 1; margin: 0; font-size: 17px; }
#modal .hd button { background: #EFE3CB; border-radius: 10px; padding: 5px 12px; font-weight: 800; }
#modal .bd { overflow-y: auto; padding: 0 14px 18px; touch-action: pan-y; font-size: 13.5px; line-height: 1.6; }
.tabs { display: flex; gap: 4px; margin: 0 0 10px; flex-wrap: wrap; }
.tabs button { background: #EFE3CB; border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 800; }
.tabs button.on { background: var(--chikuwa); color: #fff; }
.tabs button.lock { opacity: .55; }
.steps.reg { flex-wrap: wrap; background: #EAF5E6; }
.steps.reg label { font-size: 12px; display: flex; align-items: center; gap: 4px; }
.steps.err { background: #FBE3E0; color: #A3261B; }
.item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.item .tx { flex: 1; }
.item .tx b { display: block; font-size: 14px; }
.item .tx small { color: var(--sub); font-size: 12px; }
.item button, .pbtn { background: var(--chikuwa2); border-radius: 10px; padding: 7px 10px; font-weight: 800; white-space: nowrap; font-size: 13px; }
.item .bb { display: flex; flex-direction: column; gap: 4px; }
.item button:disabled, .pbtn:disabled { background: #E7DCC8; color: #A5927A; }
.pbtn.red { background: #F3B6AE; }
.note { background: #FFF4DE; border-radius: 10px; padding: 8px 10px; font-size: 12.5px; color: #6A5038; margin: 6px 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; }
.kv dt { color: var(--sub); } .kv dd { margin: 0; font-weight: 800; }
table.kb { width: 100%; border-collapse: collapse; font-size: 13px; }
table.kb td, table.kb th { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: left; }
table.kb .ok { color: var(--run); font-weight: 800; } table.kb .ng { color: var(--stop); font-weight: 800; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { background: #EFE3CB; border-radius: 10px; padding: 6px 10px; font-weight: 800; font-size: 12.5px; }
.seg button.on { background: var(--chikuwa); color: #fff; }

/* ---------- 指示書（BUILD） ---------- */
.prog { display: flex; flex-wrap: wrap; gap: 8px 3px; min-height: 64px; background: #F4ECDC; border-radius: 12px; padding: 8px 8px 8px 12px; --hole: #F4ECDC; }
/* 指示ピースはパズルのピース（と、ピース＝平和✌ のダブルミーニング）。右の出っぱりが、次のピースの左のへこみにはまる */
.piece { position: relative; width: 52px; height: 52px; border-radius: 8px; color: #fff; background: var(--c); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 19px; box-shadow: 0 3px 0 rgba(0,0,0,.25); line-height: 1; margin-right: 6px; }
.piece::before { content: ''; position: absolute; left: -8px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--hole, #FFFDF7); z-index: 1; }
.piece::after { content: ''; position: absolute; right: -7px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--c); z-index: 2; }
.piece > * { position: relative; z-index: 3; }
.piece small { font-size: 8.5px; margin-top: 3px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
.piece .no { position: absolute; left: 7px; top: 2px; font-size: 9px; opacity: .8; }
.piece .pz { position: absolute; right: 2px; bottom: 1px; font-size: 9px; opacity: .55; }
.piece.start { cursor: default; border-radius: 14px 8px 8px 14px; }
.piece.start::before { display: none; }
.piece.stop::after { display: none; }
.piece.stop { margin-right: 0; }
.steps { display: flex; align-items: center; gap: 6px; background: #E3F0FA; border-radius: 10px; padding: 6px 10px; margin: 8px 0; font-weight: 800; font-size: 13px; }
.steps select { font: inherit; padding: 4px 6px; border-radius: 8px; border: 2px solid #3E8ED0; background: #fff; }
.piece.bad { outline: 3px dashed #D0473C; outline-offset: 1px; }
.piece.sel { outline: 3px solid #3B2A1C; outline-offset: 1px; }
.piece.now { box-shadow: 0 0 0 4px #FFE066, 0 3px 0 rgba(0,0,0,.25); }
.prog .empty { color: var(--sub); font-size: 12.5px; align-self: center; padding: 0 6px; }
.palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px 10px; justify-items: center; margin-top: 8px; padding-left: 8px; --hole: #FFFDF7; }
.palette .piece { width: 100%; max-width: 60px; margin-right: 0; }
.edrow { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
.edrow button { background: #EFE3CB; border-radius: 10px; padding: 6px 10px; font-weight: 800; font-size: 12.5px; }
.cnt { font-size: 12px; color: var(--sub); margin: 4px 0; }

/* データ初期化（長押し） */
.hold { position: relative; overflow: hidden; background: #D0473C !important; color: #fff; }
.hold i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255,255,255,.35); }
#toastBox { position: fixed; left: 50%; bottom: calc(130px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; max-width: 94vw; }
#toastBox div { white-space: normal !important; text-align: center; }
#toastBox div { background: rgba(30,40,36,.9); color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 13px; white-space: nowrap; animation: tin .25s; }
body.mopen #toastBox { top: 12px; bottom: auto; }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } }
</style>
</head>
<body>

<!-- タイトル -->
<section id="title">
  <a class="back" href="../">← ちくわゲームズ</a>
  <h1><small>ちくわいんだすとりーず</small>うごかせ！<br>ちくわくん</h1>
  <canvas id="titleCv" width="110" height="80"></canvas>
  <div class="story">
    全日本ロボットカンパニー謹製、<b>ぽんこつちくわ君ロボ</b>。<br>
    良い上司に巡り会えず、自己肯定感はボロボロです。<br>
    転職も<b>108回</b>をこえて、あなたの元にやってきました。<br><br>
    <b>ちくわいんだすとりーず</b>の社長となったあなたは、ちくわ君へ上手く指示をして、
    ボロボロメンタルのちくわ君の自己肯定感を回復させつつ、<b>大金持ち</b>を目指しましょう。
  </div>
  <div class="tbtns">
    <button class="big" id="btnNew">はじめから</button>
    <button class="big sub hide" id="btnCont">つづきから</button>
    <button class="big sub" id="btnHow">あそびかた</button>
  </div>
  <div class="ver" id="verT"></div>
</section>

<!-- ゲーム -->
<section id="game" class="hide">
  <div id="top">
    <a href="../">← ちくわゲームズ</a>
    <span class="ttl">うごかせ！ちくわくん</span>
    <button id="btnSet">⚙</button>
  </div>
  <div id="info">
    <span id="clock"></span>
    <span id="coin"></span>
    <span id="speed">
      <button data-s="0">⏸</button><button data-s="1" class="on">▶</button><button data-s="2">▶▶</button><button data-s="4">▶▶▶</button>
      <div id="spdTip" class="hide">いまは時間が止まっています。<br>▶ で時間がすすみ、▶▶・▶▶▶ で速くなるよ</div>
    </span>
  </div>
  <div id="bases" class="hide"></div>
  <div id="robots"></div>
  <div id="viewWrap">
    <canvas id="view"></canvas>
    <div id="hud"><div id="hudL"></div><div id="hudR"></div></div>
    <div id="placeBar" class="hide"><span id="placeTx"></span><button id="placeRot">↻</button><button id="placeUndo">↶ 取り消し</button><button id="placeEnd">おわる</button></div>
    <div id="editBar" class="hide"><span id="editTx"></span><div class="eb"><button id="edRot">↻ 90°</button><button id="edMove">✥ 移動</button><button id="edDel">🗑 撤去</button><button id="edEnd">おわる</button></div></div>
    <div id="zoom"><button id="btnEdit" title="きかいの移動・撤去・向き">🔧</button><button id="rotL" title="視点を左へ回す">⟲</button><button id="rotR" title="視点を右へ回す">⟳</button><button id="zin">＋</button><button id="zout">－</button></div>
  </div>
  <div id="ctrl">
    <div class="row">
      <button class="cbtn build" id="btnBuild">BUILD</button>
      <button class="cbtn run" id="btnRun">RUN</button>
      <button class="cbtn stop" id="btnStop">緊急停止</button>
    </div>
    <div class="row">
      <button class="sbtn" id="btnShop">💼 コンサル</button>
      <button class="sbtn" id="btnShift">🗓 シフト</button>
      <button class="sbtn" id="btnKanban">📋 かんばん</button>
      <button class="sbtn" id="btnFridge">🧊 れいぞうこ</button>
    </div>
  </div>
</section>

<div id="modal" class="hide"><div class="box"><div class="hd"><h2 id="mTitle"></h2><button id="mClose">とじる</button></div><div class="bd" id="mBody"></div></div></div>
<div id="cutin" class="hide"><div class="band"><div class="ci-ic"></div><div class="ci-big"></div><div class="ci-sm"></div></div></div>
<div id="toastBox"></div>

<script src="../../common/v1/core.js"></script>
<script src="../../common/v1/save.js"></script>
<script src="../../common/v1/move.js"></script>
<script src="../../common/v1/debug.js"></script>
<script src="js/data.js"></script>
<script src="js/vox.js"></script>
<script src="js/sim.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
