<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ちいさなお店 - 商品販売シミュレーター</title>
<style>
/* 見た目（色・レイアウト）。ダークモードは :root の変数を上書きして対応 */
:root {
  --bg:#e6efe9;
  --card:#fff;
  --ink:#12332e;
  --sub:#5b7770;
  --line:#c9d9d1;
  --tag:#ffd23f;
  --tagink:#3a2d00;
  --red:#e63946;
  --ok:#1f9d6b;
  --bar:#d6e4dc;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg:#0e1c19;
    --card:#173029;
    --ink:#e4f3ec;
    --sub:#8fb0a5;
    --line:#27473e;
    --red:#ff6b76;
    --ok:#3ed39a;
    --bar:#0f2420;
  }
}

:root[data-theme="dark"] {
  --bg:#0e1c19;
  --card:#173029;
  --ink:#e4f3ec;
  --sub:#8fb0a5;
  --line:#27473e;
  --red:#ff6b76;
  --ok:#3ed39a;
  --bar:#0f2420;
}

* {
  box-sizing:border-box;
}

body {
  margin:0 auto;
  background:var(--bg);
  color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:15px;
  line-height:1.5;
  max-width:560px;
  padding:0 12px 40px;
}

.awning {
  height:14px;
  margin:0 -12px;
  background:repeating-linear-gradient(90deg,var(--red) 0 22px,#fff 22px 44px);
  border-radius:0 0 10px 10px;
}

.money {
  font-size:34px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.5px;
  margin-top:10px;
}

.money small {
  font-size:15px;
  font-weight:600;
  color:var(--sub);
  margin-right:2px;
}

.money.neg {
  color:var(--red);
}

.money {
  padding:0;
  margin:0;
  font-size:24px;
  flex:none;
}

#top {
  flex:none;
  position:relative;
  z-index:30;
  background:var(--bg);
  margin:0 -12px;
  padding:2px 12px 6px;
  box-shadow:0 3px 8px rgba(0,0,0,.18);
}

#tabs button {
  padding:6px 0;
  font-size:13px;
}

html,body {
  overflow:hidden;
}

body {
  height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
  padding-bottom:0;
}

.awning {
  flex:none;
}

#scr {
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:10px 0 40px;
  -webkit-overflow-scrolling:touch;
}

#mny .card {
  border:0;
  border-top:1px solid var(--line);
  border-radius:0;
  background:transparent;
  padding:8px 0;
  margin:0;
}

.meta {
  color:var(--sub);
  font-size:13px;
}

.steps {
  display:flex;
  gap:6px;
  margin:10px 0;
}

.steps span {
  flex:1;
  text-align:center;
  font-size:13px;
  font-weight:700;
  padding:6px 0;
  border-radius:8px;
  background:var(--bar);
  color:var(--sub);
}

.steps span.on {
  background:var(--ink);
  color:var(--bg);
}

.card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:8px;
}

.row {
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:8px;
  font-size:13px;
}

.bar {
  height:10px;
  background:var(--bar);
  border-radius:5px;
  overflow:hidden;
  margin:6px 0 2px;
}

.bar i {
  display:block;
  height:100%;
  background:var(--ok);
  transition:width .9s linear;
}

.bar.g i {
  background:linear-gradient(90deg,#4cc9f0,#ffd23f,#e63946);
}

.bar.low i {
  background:var(--red);
}

.boost {
  color:var(--red);
  font-weight:800;
}

.hint {
  font-size:13px;
  color:var(--sub);
  margin:4px 0 8px;
}

.log {
  font-size:13px;
  line-height:1.5;
  color:var(--ink);
  font-weight:600;
  /* 4行分の枠でスクロール（v1.4.0〜）。行が増えてもほかの表示は動かない */
  height:calc(4 * 1.5em + 8px);
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:4px 8px;
  margin-bottom:8px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--card);
}

.log div {
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.log div.sale {
  color:var(--sub);
  font-weight:400;
}

.card.off {
  opacity:.5;
}

h2 {
  font-size:16px;
  margin:16px 0 8px;
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.shelf {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.shelf.empty {
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--sub);
  border-style:dashed;
  min-height:132px;
  text-align:center;
  font-size:13px;
  background:transparent;
}

.top {
  display:flex;
  align-items:center;
  gap:8px;
}

.emo {
  font-size:30px;
  line-height:1;
}

.nm {
  font-weight:700;
}

.price {
  display:inline-block;
  background:var(--tag);
  color:var(--tagink);
  font-weight:800;
  font-size:12px;
  padding:1px 7px;
  border-radius:3px 8px 8px 3px;
}

.cnt {
  font-size:12px;
  color:var(--sub);
  display:flex;
  justify-content:space-between;
  font-variant-numeric:tabular-nums;
}

.btns {
  display:flex;
  gap:6px;
  margin-top:8px;
}

button {
  font:inherit;
  font-weight:700;
  border:0;
  border-radius:8px;
  padding:8px 6px;
  background:var(--ink);
  color:var(--bg);
  flex:1;
  cursor:pointer;
  touch-action:manipulation;
}

button.alt {
  background:transparent;
  color:var(--ink);
  border:1.5px solid var(--ink);
}

button.big {
  width:100%;
  padding:14px;
  font-size:17px;
  background:var(--tag);
  color:var(--tagink);
  margin-bottom:8px;
}

button:disabled {
  opacity:.3;
  cursor:default;
}

button:focus-visible {
  outline:3px solid var(--tag);
  outline-offset:2px;
}

.up {
  display:flex;
  gap:10px;
  align-items:center;
}

.up .tx {
  flex:1;
  min-width:0;
}

.up .d {
  font-size:12px;
  color:var(--sub);
}

.up button {
  flex:0 0 96px;
  font-variant-numeric:tabular-nums;
}

.fc {
  display:flex;
  align-items:center;
  gap:12px;
}

.fc .emo {
  font-size:40px;
}

.over {
  background:var(--red);
  color:#fff;
  text-align:center;
  font-weight:700;
}

.ver {
  margin-top:16px;
  color:var(--sub);
  font-size:11px;
  line-height:1.6;
}

/* ヘルプ（？アイコンとフロート） */
button.hp {
  flex:none;
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:14px;
  height:14px;
  margin-left:5px;
  padding:0;
  border:1px solid var(--sub);
  border-radius:50%;
  background:transparent;
  color:var(--sub);
  font-size:9px;
  font-weight:700;
  line-height:1;
  vertical-align:2px;
}

button.hp::before {
  content:"";
  position:absolute;
  inset:-10px;
}

#hlp {
  position:fixed;
  z-index:45;
  max-width:min(280px, calc(100vw - 16px));
  padding:8px 10px;
  border-radius:8px;
  background:var(--ink);
  color:var(--bg);
  font-size:13px;
  line-height:1.5;
  white-space:pre-line;
  box-shadow:0 6px 20px rgba(0,0,0,.3);
}

#hlp[hidden] {
  display:none;
}

/* セーブデータ欄 */
.svpend {
  margin-top:10px;
  padding:10px;
  border:1.5px dashed var(--line);
  border-radius:8px;
}

.svwarn {
  color:var(--red);
}

.svok {
  color:var(--ok);
  word-break:break-all;
}

/* 倒産ポップアップ */
#ovm {
  position:fixed;
  inset:0;
  z-index:40;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
  animation:ovin .25s ease-out;
}

#ovm[hidden], #ama[hidden] {
  display:none;
}

#ama {
  position:fixed;
  inset:0;
  z-index:45;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
  animation:ovin .25s ease-out;
}

.ovbox.amabox {
  display:flex;
  flex-direction:column;
  height:min(560px, 100%);
  padding:12px;
  border-top-color:#c8a45a;
  overflow:hidden;
}

.amatop {
  flex:7 1 0;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.amahd {
  display:flex;
  justify-content:space-between;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}

#amacv {
  flex:1 1 0;
  min-height:0;
  width:100%;
  object-fit:contain;
  image-rendering:pixelated;
  border-radius:8px;
  margin:6px 0;
  background:#e6ecf1;
}

.amanum {
  text-align:center;
  font-size:22px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}

.amanum small {
  font-size:13px;
  color:var(--sub);
  margin-left:6px;
}

.amabot {
  flex:3 1 0;
  min-height:0;
  display:flex;
}

.amabtn {
  flex:1;
  font-size:28px;
  font-weight:900;
  border-radius:14px;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}

.amabtn:active {
  transform:scale(.97);
}

.amares {
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  gap:6px;
}

.amares b {
  font-size:20px;
}

.ovbox {
  width:100%;
  max-width:440px;
  max-height:100%;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background:var(--card);
  color:var(--ink);
  border-radius:14px;
  border-top:6px solid var(--red);
  padding:16px;
  box-shadow:0 12px 40px rgba(0,0,0,.4);
  animation:ovpop .3s cubic-bezier(.2,1.4,.4,1);
}

.ovhd {
  font-size:24px;
  font-weight:900;
  color:var(--red);
  text-align:center;
}

.ovmsg {
  margin:6px 0 10px;
  text-align:center;
  font-weight:700;
}

.ovimg {
  display:block;
  width:100%;
  border-radius:8px;
  margin-bottom:12px;
}

.ovbox .share {
  margin-bottom:12px;
}

@keyframes ovin {
  from { opacity:0; }
}

@keyframes ovpop {
  from { transform:scale(.85); opacity:0; }
}

@media (prefers-reduced-motion:reduce) {
  #ovm, .ovbox { animation:none; }
}

.share textarea {
  display:block;
  width:100%;
  font:inherit;
  font-size:14px;
  padding:8px;
  margin:8px 0 6px;
  border-radius:8px;
  border:1.5px solid var(--line);
  background:var(--bg);
  color:var(--ink);
  resize:none;
  word-break:break-all;
}

select {
  font:inherit;
  padding:8px;
  border-radius:8px;
  border:1.5px solid var(--line);
  background:var(--card);
  color:var(--ink);
  flex:1;
  margin-right:6px;
}

.sd {
  display:flex;
  gap:6px;
  margin-bottom:8px;
}

.sd button {
  padding:3px 0;
  font-size:13px;
}

.gr {
  display:grid;
  grid-template-columns:64px 1fr auto;
  align-items:center;
  gap:8px;
  font-size:13px;
  margin:4px 0;
}

.gr b {
  display:inline-flex;
  align-items:center;
  gap:2px;
  white-space:nowrap;
}

.pw {
  float:right;
  font-size:12px;
  font-weight:700;
  color:var(--sub);
  line-height:22px;
}

.gr .bar {
  margin:0;
}

.gr span {
  font-variant-numeric:tabular-nums;
  text-align:right;
}

details summary {
  cursor:pointer;
  color:var(--sub);
  font-size:12px;
  margin-top:6px;
}

details .meta {
  margin-top:4px;
}

.foot {
  margin-top:24px;
  text-align:center;
}

.foot button {
  flex:none;
  background:transparent;
  color:var(--sub);
  font-weight:500;
  font-size:12px;
  text-decoration:underline;
}

/* ---- v1.2.0：セーブコード ---- */
.svsub {
  margin-top:10px;
  font-weight:700;
  font-size:14px;
}

textarea.svcode {
  width:100%;
  box-sizing:border-box;
  margin:6px 0;
  font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;
  padding:6px;
  border-radius:8px;
  border:1.5px solid var(--line);
  background:var(--bg);
  color:var(--ink);
  word-break:break-all;
  resize:vertical;
}

/* ---- v1.2.0：最初からやり直す（目立たせる） ---- */
.rst {
  border:1.5px solid var(--red);
}

.rst b {
  color:var(--red);
}

button.big.rstb {
  margin:8px 0 0;
  background:transparent;
  color:var(--red);
  border:2px solid var(--red);
}

button.big.rstb.arm {
  background:var(--red);
  color:#fff;
}

/* ---- v1.2.0：横画面（スマホを横にしたとき）は左に店の様子、右にタブの中身 ---- */
@media (orientation:landscape) and (max-height:560px) {
  body {
    max-width:none;
    display:grid;
    grid-template-columns:minmax(260px,42%) minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr);
    column-gap:14px;
    padding-left:max(12px,env(safe-area-inset-left,0px));
    padding-right:max(12px,env(safe-area-inset-right,0px));
  }

  .awning {
    grid-column:1 / -1;
    margin:0 calc(-1 * max(12px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(12px,env(safe-area-inset-right,0px)));
  }

  #top {
    grid-column:1;
    grid-row:2;
    margin:0;
    padding:2px 0 8px;
    box-shadow:none;
    overflow-y:auto;
    min-height:0;
  }

  #scr {
    grid-column:2;
    grid-row:2;
    padding-top:6px;
  }

  #px {
    max-height:42vh;
    object-fit:contain;
  }
}

/* ---- v1.3.0：実績 ---- */
.achn {
  font-weight:800;
  font-variant-numeric:tabular-nums;
}

.achg {
  margin-top:10px;
}

.achgh {
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:8px;
  font-weight:700;
  font-size:13px;
}

.achgh .meta {
  font-weight:400;
  font-variant-numeric:tabular-nums;
  text-align:right;
  min-width:0;
  overflow-wrap:anywhere;
}

.achl {
  display:grid;
  gap:4px;
  margin-top:4px;
}

.ach {
  display:grid;
  grid-template-columns:22px minmax(0,1fr) auto;
  align-items:center;
  gap:6px;
  padding:5px 8px;
  border-radius:8px;
  border:1px solid var(--line);
  font-size:13px;
  color:var(--sub);
}

.ach.on {
  border-color:var(--tag);
  background:color-mix(in srgb, var(--tag) 18%, transparent);
  color:var(--ink);
  font-weight:700;
}

.achi {
  text-align:center;
}

.achd {
  font-size:11px;
  font-weight:400;
  color:var(--sub);
  white-space:nowrap;
}

.achp {
  width:64px;
  height:6px;
  border-radius:3px;
  background:var(--bar);
  overflow:hidden;
}

.achp i {
  display:block;
  height:100%;
  background:var(--ok);
}

/* ---- v1.4.0：所持金の行の実績バッジ・実績のポップアップ・タブの倍速・更新履歴 ---- */
.mrow {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.mrow .money {
  min-width:0;
}

button.achb {
  flex:none;
  width:auto;
  padding:3px 10px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}

#achm {
  position:fixed;
  inset:0;
  z-index:40;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
  animation:ovin .25s ease-out;
}

#achm[hidden] {
  display:none;
}

.ovbox.achbox {
  display:flex;
  flex-direction:column;
  height:min(620px, 100%);
  padding:12px 14px;
  overflow:hidden;
}

.achtop {
  display:flex;
  align-items:center;
  gap:8px;
  padding-bottom:6px;
  border-bottom:1px solid var(--line);
}

.achtop .achn {
  margin-left:auto;
}

button.achx {
  flex:none;
  width:34px;
  padding:4px 0;
}

.achbody {
  flex:1;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding-bottom:4px;
}

button.achr {
  width:100%;
  margin-top:10px;
}

.achask {
  margin-top:10px;
}

.achask .btns {
  margin-top:8px;
}

#tabs .spd {
  flex:none;
  display:flex;
  gap:3px;
}

#tabs .spd button {
  width:36px;
  flex:none;
  font-variant-numeric:tabular-nums;
}

#tabs {
  gap:5px;
}

.chg {
  font-size:13px;
  color:var(--sub);
}

.chg b {
  color:var(--ink);
}

.chg ul {
  margin:6px 0 0;
  padding-left:1.2em;
}

.chg li {
  margin:2px 0;
}

.chg details summary {
  cursor:pointer;
  color:var(--ink);
  font-weight:700;
  margin-top:6px;
}

.achask button.rstb {
  background:var(--red);
  color:#fff;
}

.ovbox.achbox {
  border-top-color:#c8a45a;
}

/* ---- v1.4.1：営業中の現在時刻（購買欲ゲージの上） ---- */
.clk {
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px;
  padding:6px 12px;
  margin-bottom:8px;
  border-radius:12px;
  background:var(--ink);
  color:var(--bg);
}

.clk[hidden] {
  display:none;
}

.clkt {
  font-size:28px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
  letter-spacing:.5px;
  line-height:1.2;
}

.clkr {
  font-size:12px;
  font-weight:700;
  opacity:.8;
  text-align:right;
}
</style>

<!-- ちくわゲームズ共通部品（common/v1）。build.py・make-artifact.py が中に埋め込む -->
<script>
/**
 * ちくわゲームズ 共通部品 v1 — core.js（いちばん最初に読み込む）
 *
 * どのゲームでも使う小さな道具をまとめたもの。ほかの共通部品（share・save・debug・room）はこれを前提にする。
 * すべて window.CG（ちくわゲームズ）の下に置き、ゲームの変数や関数と名前がぶつからないようにする。
 *
 *   読み込み：ゲームの HTML で script タグの src に ../common/v1/core.js を書く（ほかの共通部品より先）
 *   ※ 共通部品のコメントには閉じタグ（スラッシュ＋script）を書かない。1 ファイルに埋め込んだとき、そこで script が終わってしまう
 *   CG.init({ game: 'shop-sim', title: 'ちいさなお店', version: '1.2.0' });
 *
 * 仕様を変えて古いゲームが動かなくなるときは v1 を直さず、common/v2/ を作る（公開済みのゲームを壊さない）。
 * 使い方の全体はリポジトリ直下の CLAUDE.md「14. 共通部品」と common/README.md。
 */
(function () {
    const CG = window.CG || (window.CG = {});
    CG.LIB = 'v1';

    /** ゲームの情報（init で決める）。game はフォルダ名＝URL、デバッグ送信・マルチの宛先にも使う */
    CG.info = { game: '', title: '', version: '' };
    CG.init = function (o) {
        Object.assign(CG.info, o || {});
        return CG;
    };

    /** localStorage の読み書き（失敗しても止まらない。プライベートモードなど） */
    CG.ls = {
        get(k, d = null) {
            try {
                const v = localStorage.getItem(k);
                return v === null ? d : v;
            }
            catch (e) {
                return d;
            }
        },
        set(k, v) {
            try {
                localStorage.setItem(k, v);
                return true;
            }
            catch (e) {
                return false;
            }
        },
        del(k) {
            try {
                localStorage.removeItem(k);
            }
            catch (e) { }
        },
        getJSON(k, d = null) {
            const v = CG.ls.get(k, null);
            if (v === null)
                return d;
            try {
                return JSON.parse(v);
            }
            catch (e) {
                return d;
            }
        },
        setJSON(k, v) {
            return CG.ls.set(k, JSON.stringify(v));
        }
    };

    /** HTML に埋め込むときの書き換え（< と & と "） */
    CG.esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

    /** 2桁ゼロ埋め */
    CG.p2 = n => String(n).padStart(2, '0');

    /** いま開いているゲームの公開 URL（? と # は付けない） */
    CG.pageUrl = () => location.origin + location.pathname;

    /**
     * 文字列をコピーする。成功なら true。
     * 新しい方法（clipboard）がだめなら、見えない入力欄を使う昔の方法を試す。prompt() は使わない（アーティファクトで働かない）
     */
    CG.copy = async function (text) {
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(text);
                return true;
            }
        }
        catch (e) { }
        const t = document.createElement('textarea');
        t.value = text;
        t.setAttribute('readonly', '');
        t.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
        document.body.append(t);
        t.select();
        let ok = false;
        try {
            ok = document.execCommand('copy');
        }
        catch (e) { }
        t.remove();
        return ok;
    };

    /** ファイルとして保存（ダウンロード）。data は文字列か Blob */
    CG.download = function (name, data, type = 'application/json') {
        const blob = data instanceof Blob ? data : new Blob([data], { type });
        const u = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = u;
        a.download = name;
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(u), 10000);
    };

    /** ファイルを文字列で読む（Promise） */
    CG.readText = file => new Promise((ok, ng) => {
        const r = new FileReader();
        r.onload = () => ok(String(r.result));
        r.onerror = () => ng(new Error('ファイルを読み取れませんでした。'));
        r.readAsText(file);
    });

    /** 画面の下に短いお知らせを出す（ms ミリ秒で消える） */
    let toastTimer = 0;
    CG.toast = function (msg, ms = 2200) {
        let el = document.getElementById('cg-toast');
        if (!el) {
            el = document.createElement('div');
            el.id = 'cg-toast';
            el.setAttribute('role', 'status');
            el.style.cssText = 'position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9999;' +
                'max-width:calc(100vw - 32px);padding:10px 16px;border-radius:12px;background:rgba(30,30,30,.92);color:#fff;font-size:14px;' +
                'line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.3);transition:opacity .2s;pointer-events:none;text-align:center';
            document.body.append(el);
        }
        el.textContent = msg;
        el.style.opacity = '1';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.style.opacity = '0', ms);
    };
})();
</script>
<script>
/**
 * ちくわゲームズ 共通部品 v1 — share.js（SNS 共有）。core.js の後に読む。
 *
 * 共通ルール「5. SNS 共有」をそのまま形にしたもの。#ちくわげーむず は必ず付く（書き忘れても足す）。
 *
 *   const s = { msg: 'ちいさなお店を開いたけど倒産しちゃった！', tags: ['ちいさなお店'], url: CG.pageUrl() };
 *   CG.share.text(s)         // 文面（URL 込み）。コピー用の窓などに
 *   CG.share.open(s, file)   // 端末の共有メニュー（画像 file があれば添付）。使えなければ X の投稿画面
 *   CG.share.links(s)        // { x, line, facebook } のリンク先
 *   CG.share.copy(s)         // 文面をコピー（成功なら true）
 *
 * tags は # を付けずに書く。ゲーム固有のタグを先に、ちくわげーむず が最後に来る。
 */
(function () {
    const CG = window.CG;
    const SITE_TAG = 'ちくわげーむず';

    /** タグの並び（# なし、重複なし、ちくわげーむず を最後に） */
    function tagList(s) {
        const t = (s.tags || []).map(x => String(x).replace(/^#/, '')).filter(x => x && x !== SITE_TAG);
        return [...new Set(t), SITE_TAG];
    }
    const urlOf = s => s.url || CG.pageUrl();

    CG.share = {
        TAG: SITE_TAG,
        tags: tagList,

        /** 文面（本文・ハッシュタグ・URL を改行でつなぐ） */
        text(s) {
            return s.msg + '\n' + tagList(s).map(t => '#' + t).join(' ') + '\n' + urlOf(s);
        },

        /** 各 SNS の投稿画面の URL。Facebook は文面を渡せないので hashtag に #ちくわげーむず */
        links(s) {
            const e = encodeURIComponent, u = urlOf(s);
            return {
                x: 'https://x.com/intent/tweet?text=' + e(s.msg) + '&url=' + e(u) + '&hashtags=' + e(tagList(s).join(',')),
                line: 'https://social-plugins.line.me/lineit/share?url=' + e(u) + '&text=' + e(s.msg + '\n' + tagList(s).map(t => '#' + t).join(' ')),
                facebook: 'https://www.facebook.com/sharer/sharer.php?u=' + e(u) + '&hashtag=' + e('#' + SITE_TAG)
            };
        },

        /** X の投稿画面を開く */
        x(s) {
            window.open(CG.share.links(s).x, '_blank', 'noopener');
        },

        /**
         * 共有する。端末の共有メニューが使えればそれ（file があれば画像付き）、だめなら X の投稿画面。
         * 結果は 'shared'（共有メニュー）・'cancel'（とじた）・'x'（X を開いた）
         */
        async open(s, file) {
            const text = CG.share.text(s);
            const withFile = file ? { text, files: [file] } : null;
            const plain = { title: s.title || CG.info.title || document.title, text: s.msg + '\n' + tagList(s).map(t => '#' + t).join(' '), url: urlOf(s) };
            const data = withFile && navigator.canShare && navigator.canShare(withFile) ? withFile : (navigator.share && !file ? plain : null);
            if (data) {
                try {
                    await navigator.share(data);
                    return 'shared';
                }
                catch (e) {
                    if (e && e.name === 'AbortError')
                        return 'cancel';
                }
            }
            CG.share.x(s);
            return 'x';
        },

        /** 文面をコピー */
        copy(s) {
            return CG.copy(CG.share.text(s));
        }
    };
})();
</script>
<script>
/**
 * ちくわゲームズ 共通部品 v1 — save.js（セーブデータのファイルとセーブコード）。core.js の後に読む。
 *
 * ゲームの自動保存（localStorage）はゲームごとに書く。ここは「端末をまたいで持ち運ぶ」ための部品。
 * 中身は どちらも同じ「包み」{ game, v, at, data } で、game がちがうデータは読み込めない。
 *
 *   const box = CG.save.wrap(state, 2);              // 包み（v はゲームのセーブ形式の版）
 *   CG.save.toFile(box, 'ちいさなお店_….json');       // ファイルに書き出す
 *   const box2 = await CG.save.fromFile(file);       // ファイルから読む（だめなら Error。message は日本語）
 *   const code = await CG.save.toCode(box);          // セーブコード（文字列）にする
 *   const box3 = await CG.save.fromCode(code);       // セーブコードを読む（だめなら Error）
 *
 * セーブコードの形：CK1.<本体>.<チェック値>
 *   CK1 … 本体は JSON を deflate で縮めて base64url にしたもの
 *   CK0 … 縮める仕組みが無いブラウザ用（JSON をそのまま base64url）
 *   チェック値はゲーム名を混ぜたハッシュ。書き換えたコード・別のゲームのコードははじく（共通ルール 7 章）
 * 読み込み側は、v がゲームの今の版より新しいときは「ゲームを最新にして」とエラーにすること（box.v を見る）。
 */
(function () {
    const CG = window.CG;
    const err = t => new Error(t);

    /** ハッシュ（FNV-1a。つくれ！おでん横丁の checksum と同じ式。塩はゲーム名） */
    function checksum(str, game) {
        let h = 0x811c9dc5;
        for (const ch of 'chikuwa-' + game + str) {
            h ^= ch.charCodeAt(0);
            h = Math.imul(h, 0x01000193) >>> 0;
        }
        return h.toString(36);
    }

    /** バイト列 ⇔ base64url */
    function b64e(bytes) {
        let s = '';
        for (let i = 0; i < bytes.length; i += 0x8000)
            s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function b64d(t) {
        const s = atob(t.replace(/-/g, '+').replace(/_/g, '/'));
        const b = new Uint8Array(s.length);
        for (let i = 0; i < s.length; i++)
            b[i] = s.charCodeAt(i);
        return b;
    }

    /** deflate（使えるブラウザだけ） */
    const canZip = typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
    async function pipe(bytes, stream) {
        const out = new Response(new Blob([bytes]).stream().pipeThrough(stream));
        return new Uint8Array(await out.arrayBuffer());
    }

    /** 包みが正しい形か（game が合っているか）。だめなら Error */
    function check(box) {
        if (!box || typeof box !== 'object' || typeof box.game !== 'string')
            throw err('セーブデータの形ではありません。');
        // 共通部品より前の ちいさなお店（v1.1.x）は中身を state に入れていた。読めるようにそろえる
        if (!box.data && box.state && typeof box.state === 'object')
            box.data = box.state;
        if (box.game !== CG.info.game)
            throw err('このゲームのセーブデータではありません。');
        if (typeof box.v !== 'number' || !box.data || typeof box.data !== 'object')
            throw err('セーブデータが壊れています。');
        return box;
    }

    CG.save = {
        checksum,

        /** 包む（at は保存した日時） */
        wrap(data, v) {
            return { game: CG.info.game, v, at: new Date().toISOString(), data };
        },

        /** ファイルに書き出す */
        toFile(box, name) {
            CG.download(name, JSON.stringify(box), 'application/json');
        },

        /** ファイルから読む */
        async fromFile(file) {
            if (!file)
                throw err('ファイルが選ばれていません。');
            const t = await CG.readText(file);
            let box;
            try {
                box = JSON.parse(t);
            }
            catch (e) {
                throw err('ファイルを読み取れませんでした（JSONではありません）。');
            }
            return check(box);
        },

        /** セーブコードにする */
        async toCode(box) {
            const raw = new TextEncoder().encode(JSON.stringify(box));
            let head = 'CK0', body = raw;
            if (canZip) {
                try {
                    body = await pipe(raw, new CompressionStream('deflate-raw'));
                    head = 'CK1';
                }
                catch (e) {
                    body = raw;
                }
            }
            const p = head + '.' + b64e(body);
            return p + '.' + checksum(p, CG.info.game);
        },

        /** セーブコードを読む（前後の空白・改行は無視） */
        async fromCode(code) {
            const t = String(code || '').replace(/\s+/g, '');
            const m = t.match(/^(CK[01])\.([A-Za-z0-9_-]+)\.([0-9a-z]+)$/);
            if (!m)
                throw err('セーブコードの形ではありません。全部コピーできているか確かめてください。');
            if (checksum(m[1] + '.' + m[2], CG.info.game) !== m[3])
                throw err('セーブコードが正しくありません（途中が欠けている・書き換えた・別のゲームのコード）。');
            let bytes;
            try {
                bytes = b64d(m[2]);
                if (m[1] === 'CK1') {
                    if (!canZip)
                        throw err('このブラウザではこのセーブコードを読めません。ブラウザを新しくしてください。');
                    bytes = await pipe(bytes, new DecompressionStream('deflate-raw'));
                }
                return check(JSON.parse(new TextDecoder().decode(bytes)));
            }
            catch (e) {
                throw e && /セーブ|ブラウザ/.test(e.message) ? e : err('セーブコードを読み取れませんでした。');
            }
        }
    };
})();
</script>
<script>
/**
 * ちくわゲームズ 共通部品 v1 — debug.js（デバッグ報告）。core.js の後に読む。
 *
 * 遊んでいる人の端末で「操作・出来事・エラー」を直近 max 件だけ localStorage に残し、
 * 不具合が起きたらメモを付けて開発者に送る。サーバーは worker/index.js の /<フォルダ>/debug（D1 chikuwa-debug）。
 * 新しいゲームで使うときは worker/index.js の DEBUG_GAMES にフォルダ名を足す。
 *
 *   CG.debug.init({ snap: () => ({ d: state.day }) });  // snap：1件ごとに付ける「いまの状態」の要約（任意）
 *   CG.debug.add('open', { m: 100 });                    // 1件記録
 *   CG.debug.wrap('buy', { before: () => state.money, after: (m0) => ({ dm: state.money - m0 }) });
 *                                                        // window.buy を包んで、呼ばれたことを記録
 *   const r = await CG.debug.send(note, { state });      // 送信 → { ok:true, code } か { ok:false, t }
 *   CG.debug.mount(el);                                  // 送信欄（メモ・ボタン・受付番号）を el に作る（自前の見た目にしたいゲームは使わない）
 *
 * エラー（error・unhandledrejection）は init だけで自動的に記録される。
 * アーティファクト版からは送れない（公開サイトのみ）。そのときは「公開サイトから送って」と表示する。
 */
(function () {
    const CG = window.CG;
    let opt = { key: '', max: 300, url: 'debug', snap: null };
    let log = [];
    let started = false;

    function persist() {
        CG.ls.setJSON(opt.key, log);
    }

    const D = CG.debug = {
        /** 記録の一覧（古い順） */
        get log() {
            return log;
        },

        init(o) {
            opt = Object.assign(opt, o || {});
            if (!opt.key)
                opt.key = CG.info.game + '-debuglog';
            const v = CG.ls.getJSON(opt.key, []);
            log = Array.isArray(v) ? v : [];
            if (!started) {
                started = true;
                addEventListener('error', e => D.add('error', {
                    msg: String(e.message), src: (e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno,
                    st: e.error && e.error.stack ? String(e.error.stack).slice(0, 800) : undefined
                }));
                addEventListener('unhandledrejection', e => D.add('error', { msg: 'promise: ' + String(e.reason).slice(0, 300) }));
            }
            D.add('boot', { v: CG.info.version });
            return D;
        },

        /** 1件記録する（t：時刻、ev：何が起きたか、＋ snap の結果、＋ extra） */
        add(ev, extra) {
            let s = {};
            try {
                s = opt.snap ? opt.snap() || {} : {};
            }
            catch (e) { }
            log.push(Object.assign({ t: Date.now(), ev }, s, extra || {}));
            if (log.length > opt.max)
                log = log.slice(-opt.max);
            persist();
        },

        /**
         * グローバル関数 window[name] を包んで、呼ばれたことを記録する（ゲームの動きは変えない）。
         * before() の戻り値が after(前の値, 引数, 戻り値) に渡り、after の戻り値（オブジェクト）が記録に足される。
         */
        wrap(name, h) {
            const f = window[name];
            if (typeof f !== 'function')
                return;
            h = h || {};
            window[name] = function (...args) {
                let b;
                try {
                    b = h.before ? h.before() : undefined;
                }
                catch (e) { }
                const r = f.apply(this, args);
                let x = {};
                try {
                    x = h.after ? h.after(b, args, r) || {} : {};
                }
                catch (e) { }
                D.add(name, Object.assign({ a: args.length ? args : undefined }, x));
                return r;
            };
        },

        /** 記録を消す */
        clear() {
            log = [];
            persist();
        },

        /**
         * 送る。extra はゲームの状態など（state 全体を入れてよい。1件 300KB まで）。
         * 戻り値：{ ok:true, code:'受付番号' } か { ok:false, t:'理由' }
         */
        async send(note, extra) {
            const body = Object.assign({
                game: CG.info.game, version: CG.info.version, note: String(note || '').trim().slice(0, 500),
                at: new Date().toISOString(), screen: innerWidth + 'x' + innerHeight, ua: navigator.userAgent
            }, extra || {}, { log });
            try {
                const r = await fetch(opt.url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
                let j = null;
                try {
                    j = await r.json();
                }
                catch (e) { }
                if (r.ok && j && j.ok) {
                    D.add('sent', { code: j.code });
                    return { ok: true, code: j.code };
                }
                return { ok: false, t: (j && j.error) || '送信できませんでした（' + r.status + '）。公開サイトから送ってください。' };
            }
            catch (e) {
                return { ok: false, t: '送信できませんでした。通信状態を確かめるか、公開サイトから送ってください。' };
            }
        },

        /**
         * 送信欄を el の中に作る（共通の見た目。class は cg-dbg-*）。
         * o.title：見出し、o.extra()：送るときに足すデータ、o.placeholder：メモの例
         */
        mount(el, o) {
            o = o || {};
            let msg = null;
            const draw = () => {
                const note = el.querySelector('textarea') ? el.querySelector('textarea').value : '';
                el.innerHTML = '<div class="cg-dbg"><b>' + CG.esc(o.title || '🐞 不具合を報告する') + '</b>' +
                    '<textarea rows="2" maxlength="500" placeholder="' + CG.esc(o.placeholder || 'どんなことが起きた？（任意）') + '"></textarea>' +
                    '<button type="button"' + (msg && msg.busy ? ' disabled' : '') + '>' + (msg && msg.busy ? '送信中…' : '🐞 デバッグログを送る') + '</button>' +
                    '<div class="cg-dbg-meta">直近' + log.length + '件の操作と、いまのゲームの状態を開発者に送ります。</div>' +
                    (msg && msg.ok ? '<div class="cg-dbg-ok">✅ 送信しました。受付番号 <b>' + CG.esc(msg.code) + '</b>（開発者に伝えてください）</div>' : '') +
                    (msg && msg.t ? '<div class="cg-dbg-ng">⚠ ' + CG.esc(msg.t) + '</div>' : '') + '</div>';
                el.querySelector('textarea').value = msg && msg.ok ? '' : note;
                el.querySelector('button').onclick = async () => {
                    const n = el.querySelector('textarea').value;
                    msg = { busy: true };
                    draw();
                    msg = await D.send(n, o.extra ? o.extra() : {});
                    draw();
                };
            };
            draw();
        }
    };
})();
</script>

/**
 * util.js — 小さな共通関数。
 */

/** 要素の取得 */
const byId = id => document.getElementById(id);

/** 金額などを桁区切りで整形 */
const fmt = n => Math.round(n).toLocaleString();

/** 100円単位に丸める（最低100） */
const r100 = x => Math.max(100, Math.round(x / 100) * 100);

/** 日付から、通算の月（1〜） */
const monOf = d => Math.floor((Math.max(d, 1) - 1) / MD) + 1;

/** 日付から暦の月（1〜12）。1ヶ月目＝4月（START_MONTH） */
const calOf = d => (monOf(d) - 1 + START_MONTH - 1) % 12 + 1;

/** 日付から季節番号（0〜3：春夏秋冬）。実際の1年と同じく3ヶ月ずつ（春4〜6月・夏7〜9月・秋10〜12月・冬1〜3月） */
const seaOf = d => Math.floor((calOf(d) + 8) % 12 / 3);

/** 季節に応じた天気を抽選 */
function roll(d) {
    const w = WW[seaOf(d)];
    let r = Math.random() * 100;
    for (let i = 0; i < 4; i++) {
        if ((r -= w[i]) < 0)
            return i;
    }
    return 1;
}

/** 0〜100に収める */
const clamp100 = v => Math.max(0, Math.min(100, v));

/** ヘルプの？アイコン（k は data.js の HELP のキー） */
const helpIcon = k => '<button type="button" class="hp" data-a="help" data-k="' + k + '" aria-label="説明">?</button>';

/** ヘルプのフロート表示（同じアイコンをもう一度触ると閉じる） */
function showHelp(b) {
    let f = byId('hlp');
    if (!f) {
        f = document.createElement('div');
        f.id = 'hlp';
        f.setAttribute('role', 'tooltip');
        f.hidden = true;
        document.body.append(f);
    }
    const k = b.dataset.k;
    if (!f.hidden && f.dataset.k === k) {
        hideHelp();
        return;
    }
    f.dataset.k = k;
    f.textContent = HELP[k] || '';
    f.hidden = false;
    const r = b.getBoundingClientRect(), W = innerWidth, H = innerHeight, fw = f.offsetWidth, fh = f.offsetHeight;
    f.style.left = Math.max(8, Math.min(W - fw - 8, r.left + r.width / 2 - fw / 2)) + 'px';
    f.style.top = (r.bottom + 6 + fh > H - 8 ? Math.max(8, r.top - fh - 6) : r.bottom + 6) + 'px';
}

/** ヘルプを閉じる */
function hideHelp() {
    const f = byId('hlp');
    if (f)
        f.hidden = true;
}

 * 形：{ t: 文, s: 販売の行なら true }。state が入れ替わったら（やり直し・読み込み）state.log から作り直す
 */
const LOGN = 50;
let logHist = [], logOwner = null, logSeq = 0;
const logList = () => {
    if (logOwner !== state) {
        logOwner = state;
        logSeq++;
        logHist = (state.log || []).map(t => ({ t }));
    }
    return logHist;
};
const pushHist = (t, s) => {
    const L = logList();
    L.unshift({ t, s: !!s });
    logSeq++;
    if (L.length > LOGN)
        L.length = LOGN;
};

/** ログに1行追加（state.log は最新3件。noHist なら履歴には足さない＝販売の行は engine.js がまとめて足す） */
const addLog = (t, noHist) => {
    if (!noHist)
        pushHist(t);
    state.log.unshift(t);
    state.log = state.log.slice(0, 3);
};

};

}

<script>
/**
 * actions.js — プレイヤーの操作（補充・投資・融資・預金・開店など）。
 */

/** 空き棚に未陳列の商品を並べる */
function fill() {
    for (let i = 0; i < state.shelf.length; i++) {
        if (state.shelf[i])
            continue;
        const sh = state.shelf.filter(Boolean).map(s => s.id);
        const nx = state.own.find(id => !sh.includes(id));
        if (nx !== undefined)
            state.shelf[i] = { id: nx, st: 0 };
    }
}

/** 1つの棚を補充 */
function restock(i, n) {
    if (state.phase === 'closed' || state.over || ill())
        return;
    const s = state.shelf[i];
    if (!s)
        return;
    const p = PRODUCTS[s.id];
    const q = Math.min(n, state.cap - s.st, Math.floor(state.money / p.c));
    if (q <= 0)
        return;
    s.st += q;
    state.money -= q * p.c;
    render();
    save();
}

/** 投資ボタンの処理 */
function buy(k, id) {
    if (state.phase !== 'closed' || state.over || ill())
        return;
    if (k === 'upg') {
        upgrade(id);
        return;
    }
    if (k === 'new') {
        const p = PRODUCTS[id];
        if (state.money < p.u || state.own.includes(id))
            return;
        state.money -= p.u;
        state.own.push(id);
        fill();
        addLog(p.e + ' ' + p.n + 'を扱い始めました。');
    }
    else {
        const c = cost[k]();
        const cur = {
            slot: state.slots, cap: state.cap, ad: state.ad, clerk: state.clerk, skill: state.sk || 0, seclv: state.sl || 0, secbuy: state.ss || 0
        }[k];
        if (state.money < c || cur >= MAX[k] || (k === 'secbuy' && !(state.sl > 0)))
            return;
        state.money -= c;
        if (k === 'slot') {
            state.slotQ = (state.slotQ || 0) + 1;
            addSlot();
            addLog('棚が' + state.slots + '台に。テナント料は月¥' + fmt(tenantFee()) + 'になります。');
        }
        if (k === 'cap') {
            state.cap = CAPS[CAPS.indexOf(state.cap) + 1] || state.cap;
            addLog('1棚' + state.cap + '個まで置けます。');
        }
        if (k === 'ad') {
            state.ad++;
            addLog('広告を出しました。来店数が増えます。');
        }
        if (k === 'seclv') {
            state.sl = (state.sl || 0) + 1;
            addLog('🛡 ' + SECN[state.sl - 1] + 'を導入できるようになりました。');
        }
        if (k === 'secbuy') {
            if ((state.ss || 0) === 0)
                state.sb = state.day + SECD[state.sl - 1];
            state.ss = (state.ss || 0) + 1;
            addLog('🛡 ' + SECN[state.sl - 1] + 'を購入（ストック' + state.ss + '/5）');
        }
        if (k === 'skill') {
            state.sk = (state.sk || 0) + 1;
            addLog('🧠 店員の能力が上がりました。');
        }
        if (k === 'clerk') {
            state.clerk++;
            addLog('店員を雇いました。営業中に自動補充します。');
        }
    }
    render();
    save();
}

/** 棚を1台増やす（上位商品を解放） */
function addSlot() {
    state.slots++;
    state.shelf.push(null);
    if (state.own.length < state.slots && state.own.length < PRODUCTS.length) {
        state.own.push(state.own.length);
        const q = PRODUCTS[state.own.length - 1];

/** 開店前の一括満タン */

    if (state.phase !== 'prep' || state.over || ill())
        return;

        const s = state.shelf[i], p = PRODUCTS[s.id], q = Math.min(state.cap - s.st, Math.floor(state.money / p.c));

    const L = state.up[id];
    if (L >= 7 || state.sd[id] < TH[L])
        return;
    const c = upCost(id, L);
    if (state.money < c)
        return;
    state.money -= c;
    state.up[id]++;

    addLog('⬆ ' + PRODUCTS[id].e + ' ' + PRODUCTS[id].n + 'にアップグレード！');

    if (!d)
        return;
    state = fresh();
    state.diff = v;
    state.money = d.money;
    state.margin = d.mg;
    state.sal = 0;

}

/** 融資を借りる */
function takeLoan() {
    if (state.phase !== 'closed' || state.over || state.loans.length >= 3)
        return;
    const a = state.ln.a, m = state.ln.m;
    if (a >= 1500000 && a > loanCap())

    if (m > 12 && a < 1500000)

    const p = Math.round(a * (1 + intr(m)) / m);
    state.money += a;
    state.loans.push({ left: m, pay: p });
    addLog('🏦 ¥' + fmt(a) + 'を借りました。月¥' + fmt(p) + '×' + m + 'ヶ月');
    render();
    save();
}

/** 開店する */
function openShop() {
    if (state.phase !== 'prep')
        return;
    state.phase = 'open';
    lastSale = '';
    state.t = 0;
    state.dOpen = true;
    addLog('開店！');
    state.paused = false;

}

        const h = state.openH + Math.floor((state.t - 1) / 5), w = WAGE * (h < 7 || h >= 22 ? 1.25 : 1) * state.clerk / 5 * (state.sick > 0 || state.dep > 0 ? 1.5 : 1);

    }
    if (state.t >= dayTicks()) {
        addLog('閉店。本日の売上 ¥' + fmt(state.dRev) + (state.dWage ? ' / 給料 ¥' + fmt(state.dWage) : ''));
        endDay();
    }
    render();
    save();
}

<script>
/**
 * pixel.js — ドット絵の描画。
 */

/** ドット絵のキャンバス */
const cv = byId('px');

/** 描画コンテキスト */
const cx = cv.getContext('2d');

/** アニメーションのフレーム数 */
let fr = 0;

/** 四角形を塗る */
const Rc = (x, y, w, h, c) => {
    cx.fillStyle = c;
    cx.fillRect(Math.round(x), Math.round(y), w, h);
    if (pxDk) {
        cx.fillStyle = 'rgba(8,16,48,0.5)';
        cx.fillRect(Math.round(x), Math.round(y), w, h);
    }
};

/** 夜に人物を描き直すとき、夜の暗さを重ねる */
let pxDk = false;

/** 来店中のお客さん */
const PXC = [];

/** ドット文字を描く */
function pxText(x, y, t, c) {
    [...t].forEach((ch, i) => PXF[ch].forEach((r, j) => [...r].forEach((v, k) => {
        if (v === '1')
            Rc(x + i * 4 + k, y + j, 1, 1, c);
    })));
}

/** お客さんを来店させる */
function pxArrive(gs, bc) {
    const o = gs.map((g, i) => i).sort(() => Math.random() - .5);
    gs.forEach((g, i) => {
        if (PXC.length >= 14)
            return;
        const L = Math.random() < .5;
        PXC.push({
            x: L ? -6 : 198, L, g, bag: o.indexOf(i) < bc, st: 0, t: 0, sp: 0.8 + Math.random() * 0.7, c: Math.floor(Math.random() * 4)
        });

}

/** 人物を描く */
function pp(x, y, b, o) {
    o = o || {};
    const h = o.hair || '#3b2a20';
    x = Math.round(x);
    y = Math.round(y);
    Rc(x + 1, y, 3, 3, '#f1c27d');
    Rc(x + 1, y, 3, 1, h);
    if (o.g)
        Rc(x, y + 1, 1, 3, h);
    Rc(x, y + 3, 5, 4, b);
    if (o.g)
        Rc(x, y + 7, 5, 2, b);
    const ly = y + (o.g ? 9 : 7);
    Rc(x + 1, ly, 1, 2, '#2a2a2a');
    Rc(x + 3, ly, 1, 2, '#2a2a2a');

function pxLights(op, night) {

    Rc(90, 40, 12, 22, lit ? '#ffe9a8' : '#6b8296');
    Rc(95, 40, 2, 22, '#3f332b');
    Rc(99, 52, 1, 3, '#ddd');

}

/** セキュリティを描く */
function pxSec() {
    const L = state.sl || 0;
    if (!L)
        return;
    const ss = state.ss || 0;
    cx.globalAlpha = ss > 0 ? 0.45 + 0.11 * ss : 0.18;
    if (L === 1) {

    }
    if (L === 2) {

<script>
/**
 * share.js — 倒産時のポップアップとSNS共有（リザルト画像・Xへの投稿・文面のコピー）。
 * 共有の文面・共有メニュー・X の投稿画面・コピーは共通部品 common/v1/share.js（CG.share）。
 */

/** 共有する文面とハッシュタグ */
const SHARE_MSG = 'ちいさなお店を開いたけど倒産しちゃった！残念😢';
const SHARE_TAG = 'ちくわげーむず';

/** ゲームのURL（今開いているページ。#以降は除く） */
const shareUrl = () => location.href.split('#')[0];

/** CG.share に渡す中身（#ちくわげーむず は CG.share が付ける） */
const shareData = () => ({ msg: SHARE_MSG, url: shareUrl() });

/** コピー用・共有メニュー用の文面（URL込み） */
const shareText = () => CG.share.text(shareData());

/** 作成済みのリザルト画像（ゲームが変わったら作り直す） */
let shareFile = null, shareFor = null;

/** 画像用：幅に収まるように折り返す（最大 max 行） */
function wrapText(g, t, w, max) {
    const L = [];
    let s = '';
    for (const ch of t) {
        if (g.measureText(s + ch).width > w) {
            L.push(s);
            s = ch;
        }
        else
            s += ch;
    }
    if (s)
        L.push(s);
    if (L.length > max) {
        L.length = max;
        L[max - 1] = L[max - 1].slice(0, -1) + '…';
    }
    return L;
}

/** リザルト画像（1200×630）を作る */
function resultImage() {
    const W = 1200, H = 630, c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    const g = c.getContext('2d'), F = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif';
    // 背景と屋根
    g.fillStyle = '#0e1c19';
    g.fillRect(0, 0, W, H);
    for (let x = 0; x < W; x += 44) {
        g.fillStyle = '#e63946';
        g.fillRect(x, 0, 22, 32);
        g.fillStyle = '#ffffff';
        g.fillRect(x + 22, 0, 22, 32);
    }
    // タイトル
    g.textBaseline = 'alphabetic';
    g.fillStyle = '#8fb0a5';
    g.font = '700 34px ' + F;
    g.fillText('🏪 ちいさなお店', 48, 92);
    g.fillStyle = '#ff6b76';
    g.font = '900 60px ' + F;
    g.fillText('倒産しました…', 48, 164);
    // ドット絵（192×92 を3倍、ドットのまま拡大）
    g.fillStyle = '#27473e';
    g.fillRect(42, 194, 588, 288);
    g.imageSmoothingEnabled = false;
    g.drawImage(byId('px'), 48, 200, 576, 276);
    // 成績
    const d = Math.max(state.day, 1), m = Math.floor((d - 1) / MD) + 1;
    const yen = v => (v < 0 ? '-' : '') + '¥' + fmt(Math.abs(Math.round(v)));
    const rows = [
        ['難易度', difficulty().n],
        ['営業日数', m + 'ヶ月目・通算' + state.day + '日'],
        ['累計売上', yen(state.tot || 0)],
        ['最終所持金', yen(state.money)],
        ['預金', yen(state.sv || 0)],
        ['棚の数', state.slots + '台']
    ];
    rows.forEach(([k, v], i) => {
        const y = 230 + i * 46;
        g.fillStyle = '#8fb0a5';
        g.font = '700 24px ' + F;
        g.textAlign = 'left';
        g.fillText(k, 668, y);
        g.fillStyle = k === '最終所持金' && state.money < 0 ? '#ff6b76' : '#e4f3ec';
        g.font = '800 30px ' + F;
        g.textAlign = 'right';
        g.fillText(v, 1152, y);
        g.fillStyle = '#27473e';
        g.fillRect(668, y + 14, 484, 2);
    });
    // 倒産理由
    g.textAlign = 'left';
    g.fillStyle = '#e4f3ec';
    g.font = '700 26px ' + F;
    wrapText(g, state.overMsg || '資金が倒産ラインを下回り、倒産しました。', W - 96, 2).forEach((t, i) => g.fillText(t, 48, 530 + i * 36));
    // ハッシュタグ
    g.fillStyle = '#ffd23f';
    g.font = '800 24px ' + F;
    g.textAlign = 'right';
    g.fillText('#' + SHARE_TAG, W - 48, 606);
    return c;
}

/** 倒産時にリザルト画像を先に作っておく（共有ボタンを押した瞬間に渡せるように） */
function prepShare() {
    if (!state.over || shareFor === state)
        return;
    shareFor = state;
    shareFile = null;
    setTimeout(() => {
        const s = state;
        resultImage().toBlob(b => {
            if (b && s === state)
                shareFile = new File([b], 'chiisana-omise.png', { type: 'image/png' });
        }, 'image/png');
    }, 0);
}

/** 共有欄（ポップアップの中に出す） */
function shareBox() {
    const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    return '<div class="share"><b>📣 結果をシェア</b>' +
        '<div class="row"><button data-a="share">📤 結果をシェア</button><button class="alt" data-a="shimg">🖼 画像を保存</button></div>' +
        '<textarea id="shtx" readonly rows="4">' + esc(shareText()) + '</textarea>' +
        '<button class="alt" data-a="shcopy" style="width:100%">📋 文面をコピー</button></div>';
}

/** 表示中のポップアップがどのゲームのものか（作り直しの判定） */
let ovFor = null;

/** 倒産ポップアップの表示・非表示を状態に合わせる（render のたびに呼ぶ。中身は1回だけ作る） */
function syncOver() {
    let o = byId('ovm');
    const show = state.over && !state.ovx;
    if (!show) {
        if (o)
            o.hidden = true;
        return;
    }
    if (!o) {
        o = document.createElement('div');
        o.id = 'ovm';
        o.setAttribute('role', 'dialog');
        o.setAttribute('aria-modal', 'true');
        document.body.append(o);
    }
    if (ovFor !== state || o.hidden) {
        ovFor = state;
        prepShare();
        let img = '';
        try {
            img = '<img class="ovimg" alt="リザルト画像" src="' + resultImage().toDataURL('image/png') + '">';
        }
        catch (e) { }
        o.innerHTML = '<div class="ovbox"><div class="ovhd">💸 倒産しました…</div>' +
            '<div class="ovmsg">' + (state.overMsg || '資金が倒産ラインを下回り、倒産しました。') + '</div>' + img + shareBox() +
            '<button class="big" data-a="restart">🔄 最初からやり直す</button>' +
            '<button class="alt" data-a="ovclose" style="width:100%">閉じる（お店の様子を見る）</button></div>';
        o.hidden = false;
        o.scrollTop = 0;
    }
}

/** 共有：使えれば端末の共有メニュー（画像付き）、だめならXの投稿画面（画像は手で添付） */
function shareResult() {
    if (shareFile)
        CG.share.open(shareData(), shareFile);
    else
        CG.share.x(shareData());
}

/** リザルト画像を保存（ダウンロード） */
function saveResultImage() {
    resultImage().toBlob(b => {
        if (b)
            CG.download('chiisana-omise.png', b);
    }, 'image/png');
}

/** 文面をコピー */
function copyShareText(b) {
    CG.share.copy(shareData()).then(ok => {
        b.textContent = ok ? '✅ コピーしました' : '⚠ 文面を長押ししてコピーしてください';
        setTimeout(() => b.textContent = '📋 文面をコピー', 2000);
    });
}

<script>
/**
 * save.js — セーブデータのファイル書き出し・読み込みと、セーブコード（「設定」タブ）。
 * 自動保存（localStorage）は state.js の save()。こちらは端末をまたぐバックアップ用。
 * ファイル・コードの作り方と読み方は共通部品 common/v1/save.js（CG.save）。ここはゲームに合わせた確認と画面だけ。
 * 包みの形：{ game:'shop-sim', v:SAVE_VER, at, data:state, key }（v1.1.x までのファイルは data の代わりに state。CG.save が読める形にそろえる）
 */

/** ファイルの目印と版番号（state の形を変えたら SAVE_VER を上げ、loadFix に移行処理を書く） */
const SAVE_GAME = 'shop-sim', SAVE_VER = 2;

/** 読み込み待ちのデータ（確認してから反映）、欄に出すメッセージ、作ったセーブコード、コード入力欄を開いているか */
let svPend = null, svMsg = null, svSig = '', svCode = '', svIn = false;

/** セーブ・ロードできるか（営業中は不可。倒産後は可） */
const canSL = () => state.over || state.phase !== 'open';

/** 2桁ゼロ埋め */
const p2 = CG.p2;

/** データの概要（難易度・時期・所持金） */
function saveSummary(s, at) {
    const d = Math.max(s.day || 0, 1), m = Math.floor((d - 1) / MD) + 1, df = DF[s.diff];
    const yen = v => (v < 0 ? '-' : '') + '¥' + fmt(Math.abs(Math.round(v || 0)));
    let t = (df ? df.n : '?') + ' / ' + (s.day ? m + 'ヶ月目・通算' + s.day + '日' : '開業前') + ' / 所持金 ' + yen(s.money);
    if (s.over)
        t += '（倒産済み）';
    if (at) {
        const a = new Date(at);
        if (!isNaN(a))
            t += '<br>保存 ' + a.getFullYear() + '/' + (a.getMonth() + 1) + '/' + a.getDate() + ' ' + a.getHours() + ':' + p2(a.getMinutes());
    }
    return t;
}

/** ファイルに書き出す（.json をダウンロード） */
function exportSave() {
    if (!canSL())
        return;
    const now = new Date(), d = Math.max(state.day, 1), m = Math.floor((d - 1) / MD) + 1;
    const box = Object.assign(CG.save.wrap(state, SAVE_VER), { key: KEY });
    const name = 'ちいさなお店_' + difficulty().n + '_' + (state.day ? m + 'ヶ月目' : '開業前') + '_' +
        now.getFullYear() + p2(now.getMonth() + 1) + p2(now.getDate()) + '-' + p2(now.getHours()) + p2(now.getMinutes()) + '.json';
    CG.save.toFile(box, name);
    svPend = null;
    svMsg = { ok: true, t: '書き出しました：' + name };
    syncSave();
}

/** 読み込んだデータが正しいか確かめる（だめなら理由の文字列、OKなら null）。形とゲーム名は CG.save が確かめ済み */
function checkSave(o) {
    if (!o || typeof o !== 'object' || o.game !== SAVE_GAME)
        return 'このゲームのセーブデータではありません。';
    if (typeof o.v !== 'number' || o.v > SAVE_VER)
        return '新しい版のセーブデータです。ゲームを最新にしてから読み込んでください。';
    const s = o.data;
    if (!s || typeof s !== 'object' || !Array.isArray(s.shelf) || !Array.isArray(s.own) || typeof s.money !== 'number' || typeof s.day !== 'number' || !DF[s.diff])
        return 'セーブデータが壊れています。';
    return null;
}

/** 古い版のデータを今の形にそろえる（足りない項目は初期値で埋める） */
function loadFix(o) {
    const s = Object.assign(fresh(), o.data);
    ['up', 'sd'].forEach(k => {
        s[k] = PRODUCTS.map((_, i) => (s[k] && s[k][i]) || 0);
    });
    s.cm = PRODUCTS.map((_, i) => (s.cm && s.cm[i]) || 1);
    // o.v が古いときの移行処理はここに追加する（例：if (o.v < 2) { ... }）
    // v2：土嚢・かまくら（prep・kama・mbDay）を追加。初期値で埋まるので移行処理なし
    return s;
}

/** 読んだ包み（Promise）を確かめて、反映待ちにする */
async function pendFrom(p) {
    let o = null, err = null;
    try {
        o = await p;
        err = checkSave(o);
    }
    catch (e) {
        err = e.message;
    }
    svPend = err ? null : o;
    svMsg = err ? { ok: false, t: err } : null;
    syncSave();
}

/** ファイルを選んだら中身を確認して、反映待ちにする */
function importFile(f) {
    if (f)
        pendFrom(CG.save.fromFile(f));
}

/** セーブコードを作ってコピーする（コピーできなくても、欄に出すので手でコピーできる） */
async function makeCode() {
    if (!canSL())
        return;
    try {
        svCode = await CG.save.toCode(Object.assign(CG.save.wrap(state, SAVE_VER), { key: KEY }));
    }
    catch (e) {
        svCode = '';
        svMsg = { ok: false, t: 'セーブコードを作れませんでした。' };
        syncSave();
        return;
    }
    svPend = null;
    svIn = false;
    const ok = await CG.copy(svCode);
    svMsg = ok ? { ok: true, t: 'セーブコードをコピーしました（' + fmt(svCode.length) + '文字）。メモ帳などに貼って保管してください。' } : { ok: false, t: 'コピーできませんでした。下の欄を長押しして全部コピーしてください。' };
    syncSave();
}

/** 貼り付けたセーブコードを確かめて、反映待ちにする */
function readCode() {
    const t = byId('svci');
    const v = t ? t.value.trim() : '';
    if (!v) {
        svMsg = { ok: false, t: 'セーブコードを貼り付けてください。' };
        syncSave();
        return;
    }
    pendFrom(CG.save.fromCode(v));
}

/** 反映待ちのデータで再開する */
function applyLoad() {
    if (!svPend || !canSL())
        return;
    state = loadFix(svPend);
    svPend = null;
    svCode = '';
    svIn = false;
    if (!LA.includes(state.ln.a))
        state.ln.a = LA[0];
    state.paused = false;
    state.tab = 0;
    applyDiff();
    applyUp();
    dragMg = false;
    ovFor = null;
    addLog('💾 セーブデータを読み込みました。');
    svMsg = { ok: true, t: '読み込みました。' };
    render();
    save();
    byId('scr').scrollTop = 0;
}

/** 「設定」タブのセーブ欄（内容が変わったときだけ作り直す） */
function syncSave() {
    const el = byId('svd');
    if (!el)
        return;
    const ok = canSL(), sig = [ok, svPend && svPend.at, svMsg && svMsg.t, svCode, svIn].join('|');
    if (sig === svSig)
        return;
    svSig = sig;
    const old = byId('svci'), typed = old ? old.value : '';
    const dis = ok ? '' : ' disabled';
    let h = '<b>💾 セーブデータ</b>' + helpIcon('save');
    if (!ok)
        h += '<div class="meta svwarn">営業中はセーブ・ロードできません。閉店後に操作してください。</div>';
    h += '<div class="row"><button data-a="fsave"' + dis + '>📤 ファイルに書き出す</button><button class="alt" data-a="fload"' + dis + '>📥 ファイルから読み込む</button></div>';
    h += '<div class="svsub">🔑 セーブコード' + helpIcon('code') + '</div>' +
        '<div class="row"><button data-a="ccopy"' + dis + '>📋 コードをコピー</button><button class="alt" data-a="cin"' + dis + '>⌨ コードで読み込む</button></div>';
    if (svCode)
        h += '<textarea class="svcode" readonly rows="3" onfocus="this.select()">' + CG.esc(svCode) + '</textarea>';
    if (svIn)
        h += '<textarea class="svcode" id="svci" rows="3" placeholder="ここにセーブコード（CK1.〜）を貼り付け"></textarea>' +
            '<div class="row"><button data-a="cread"' + dis + '>このコードを読み込む</button><button class="alt" data-a="cno">やめる</button></div>';
    if (svPend)
        h += '<div class="svpend"><b>このデータで再開しますか？</b><div class="meta">' + saveSummary(svPend.data, svPend.at) + '</div><div class="meta svwarn">今のデータは上書きされます。必要なら先に書き出してください。</div>' +
            '<div class="row"><button data-a="fok"' + (ok ? '' : ' disabled') + '>このデータで再開</button><button class="alt" data-a="fno">やめる</button></div></div>';
    if (svMsg)
        h += '<div class="meta ' + (svMsg.ok ? 'svok' : 'svwarn') + '">' + (svMsg.ok ? '✅ ' : '⚠ ') + svMsg.t + '</div>';
    el.innerHTML = h;
    const ni = byId('svci');
    if (ni)
        ni.value = typed;
}
</script>
<script>
/**
 * amazake.js — かまくらボーナスの日（大雪＋かまくら成功）と甘酒ミニゲーム。
 * state.kama：1＝かまくら作り中（通常の販売なし）、2＝ミニゲーム中。終了後に閉店する。
 */

/** ミニゲームの長さ（実時間・ミリ秒） */
const AMA_MS = 10000;

/** ミニゲームの進行（保存しない。途中で再読み込みしたら最初から） */
let ama = null;

/** 終了時の一言（連打数の下限と文言） */
const AMA_MSG = [[1000, '伝説の甘酒屋'], [600, '指が見えない…'], [300, '町じゅうが甘酒まみれ'], [120, '指がつりそう！'], [70, '行列ができた！'], [30, '大にぎわい'], [1, 'ちらほら'], [0, 'だれも来なかった…']];

/** 甘酒1杯の売上：解放済みで一番安い商品の販売価格 × 難易度倍率 */
const amaPer = () => Math.round(Math.min(...state.own.map(i => priceOf(PRODUCTS[i]))) * (difficulty().ama || 1));

/** かまくらの日の1秒（12:00 か閉店時刻でミニゲームを始める） */
function kamaTick() {
    if (state.kama !== 1)
        return;
    state.t++;
    if (state.openH + Math.floor(state.t / 5) >= 12 || state.t >= dayTicks())
        amaStart();
    render();
    save();
}

/** ミニゲームを始める（時間を止めてポップアップ） */
function amaStart() {
    state.kama = 2;
    state.paused = true;
    addLog('🍵 12:00 甘酒ボーナス開始！');
    ama = null;
    syncAma();
    save();
}

/** ポップアップの表示（render から呼ぶ。再読み込み後も開き直す） */
function syncAma() {
    let o = byId('ama');
    if (state.kama === 3 && !ama) {
        // 結果を見る前に再読み込みした（報酬は加算済み）→ そのまま閉店
        state.kama = 0;
        state.paused = false;
        setTimeout(() => {
            endDay();
            render();
            save();
        });
    }
    if ((state.kama !== 2 && state.kama !== 3) || state.over) {
        if (o)
            o.hidden = true;
        return;
    }
    if (o && !o.hidden && ama)
        return;
    if (!o) {
        o = document.createElement('div');
        o.id = 'ama';
        o.setAttribute('role', 'dialog');
        o.setAttribute('aria-modal', 'true');
        document.body.append(o);
        o.addEventListener('pointerdown', e => {
            if (e.target.closest('#amab')) {
                e.preventDefault();
                amaTap();
            }
        });
    }
    ama = { n: 0, t0: 0, done: false, q: [], fx: [], f: 0, per: amaPer() };
    for (let i = 0; i < 4; i++)
        ama.q.push(amaGuest(60 + i * 12));
    o.innerHTML = '<div class="ovbox amabox"><div class="amatop"><div class="amahd"><span>🍵 甘酒ボーナス</span><span id="amat">10.0秒</span></div>' +
        '<canvas id="amacv" width="96" height="60"></canvas><div class="amanum"><span id="aman">0</span>杯 <small id="amay">押すとスタート</small></div></div>' +
        '<div class="amabot" id="amabot"><button class="amabtn" id="amab" type="button">🍵 甘酒</button></div></div>';
    o.hidden = false;
    clearInterval(ama.iv);
    ama.iv = setInterval(amaFrame, 60);
    amaFrame();
}

/** 並ぶお客さん（服と髪の色はドット絵と同じ表から） */
function amaGuest(x) {
    const g = Math.random() < .5, c = Math.floor(Math.random() * 4);
    return { x, g, b: (g ? FP : MP)[c], h: (g ? FH : MH)[c] };
}

/** 連打1回 */
function amaTap() {
    if (!ama || ama.done)
        return;
    if (!ama.t0)
        ama.t0 = performance.now();
    ama.n++;
    const c = ama.q.shift();
    if (c)
        ama.fx.push({ x: c.x, g: c, t: 0 });
    ama.q.push(amaGuest(Math.max(96, (ama.q.length ? ama.q[ama.q.length - 1].x : 56) + 12)));
    byId('aman').textContent = ama.n;
    byId('amay').textContent = '+¥' + fmt(ama.n * ama.per);
}

/** 1コマ進める（残り時間・アニメ） */
function amaFrame() {
    if (!ama || !byId('amacv'))
        return;
    ama.f++;
    if (ama.t0 && !ama.done) {
        const left = Math.max(0, AMA_MS - (performance.now() - ama.t0));
        byId('amat').textContent = (left / 1000).toFixed(1) + '秒';
        if (left <= 0)
            amaFinish();
    }
    amaDraw();
}

/** 終了：報酬を加算して結果を表示 */
function amaFinish() {
    ama.done = true;
    const y = ama.n * ama.per, m = AMA_MSG.find(([k]) => ama.n >= k)[1];
    state.money += y;
    state.mSales += y;
    state.tot = (state.tot || 0) + y;
    state.dRev += y;
    addEvent('🍵 甘酒を' + ama.n + '杯ふるまいました（' + m + '）+¥' + fmt(y));
    state.kama = 3;
    save();
    byId('amabot').innerHTML = '<div class="amares"><b>' + m + '</b><div class="meta">' + ama.n + '杯 × ¥' + fmt(ama.per) + ' ＝ +¥' + fmt(y) + '（今月の売上に加算）</div>' +
        '<button class="big" data-a="amaclose">閉店する</button></div>';
}

/** 結果を閉じて閉店 */
function amaClose() {
    if (!ama || !ama.done)
        return;
    clearInterval(ama.iv);
    ama = null;
    byId('ama').hidden = true;
    state.kama = 0;
    state.paused = false;
    addLog('閉店。本日の売上 ¥' + fmt(state.dRev) + '（甘酒）');
    endDay();
    render();
    save();
}

/** ミニゲームのドット絵（96×60：雪・かまくら・店主・行列） */
function amaDraw() {
    const c = byId('amacv').getContext('2d'), R = (x, y, w, h, k) => {
        c.fillStyle = k;
        c.fillRect(Math.round(x), Math.round(y), w, h);
    }, P = (x, y, b, h, cup) => {
        R(x + 1, y, 3, 3, '#f1c27d');
        R(x + 1, y, 3, 1, h);
        R(x, y + 3, 5, 4, b);
        R(x + 1, y + 7, 1, 2, '#2a2a2a');
        R(x + 3, y + 7, 1, 2, '#2a2a2a');
        if (cup) {
            R(x - 2, y + 4, 2, 2, '#fff8e7');
            R(x - 2, y + 3, 1, 1, 'rgba(255,255,255,.7)');
        }
    }, f = ama.f;
    ['#c8d3dc', '#d3dce4', '#dde5ec', '#e6ecf1'].forEach((k, i) => R(0, i * 10, 96, 10, k));
    R(0, 40, 96, 20, '#f4f8fb');
    R(0, 40, 96, 1, '#dfe7ee');
    // かまくら
    R(6, 22, 26, 18, '#ffffff');
    R(9, 18, 20, 4, '#ffffff');
    R(13, 15, 12, 3, '#ffffff');
    R(6, 39, 26, 1, '#cfd8e0');
    R(14, 28, 10, 12, '#3b4a5a');
    R(15, 30, 8, 10, '#ffb347');
    R(16, 36, 6, 4, '#c44d2d');
    // 鍋と店主
    R(36, 34, 8, 5, '#555');
    R(35, 33, 10, 1, '#777');
    R(37, 30 - (f % 6 < 3 ? 1 : 0), 1, 3, 'rgba(255,255,255,.8)');
    R(41, 29 - (f % 6 < 3 ? 0 : 1), 1, 3, 'rgba(255,255,255,.8)');
    P(46, 30, '#ffd23f', '#3b2a20', ama.n > 0 && f % 4 < 2);
    // 行列（先頭は x=56、後ろに12ずつ並ぶ）
    ama.q.forEach((g, i) => {
        g.x = Math.max(56 + i * 12, g.x - 2);
        P(g.x, 31 + ((f + Math.floor(g.x)) % 4 < 2 ? 0 : 1), g.b, g.h);
    });
    // 甘酒をもらって帰る人
    ama.fx.forEach(e => {
        e.t++;
        e.x -= 2.5;
        P(e.x, 31 - Math.min(6, e.t), e.g.b, e.g.h, true);
    });
    ama.fx = ama.fx.filter(e => e.x > -8);
    // 雪
    for (let i = 0; i < 24; i++)
        R((i * 29 + Math.sin((f + i * 9) / 9) * 3 + 96) % 96, (i * 17 + f) % 60, 1, 1, '#fff');
}
</script>
<script>
/**
 * ui.js — 画面の描画とボタン操作。
 */

/** 営業時間の選択肢（option）を作る */
const hrs = (a, b, v) => Array.from({ length: b - a + 1 }, (_, i) => {
    const h = a + i;
    return '<option' + (h === v ? ' selected' : '') + ' value="' + h + '">' + h + ':00</option>';
}).join('');

/** 最初からやり直す（難易度選択へ戻る） */
function restart() {
    state = fresh();
    applyUp();
    state.next = roll(1);
    state.weather = state.next;
    dragMg = false;
    render();
    save();
}

/**
 * 営業タブのログ欄（v1.4.0〜）。高さ4行分の枠でスクロールし、直近 LOGN 件までさかのぼれる。
 * 新しい行は上に足す。さかのぼって読んでいる間は、新しい行が来ても読んでいる位置がずれないようにする
 */
let logSig = '';
function syncLog() {
    const el = byId('lg'), L = logList(), sig = logSeq + '|' + L.length;
    if (sig === logSig && el.innerHTML)
        return;
    logSig = sig;
    const st = el.scrollTop, sh = el.scrollHeight;
    el.innerHTML = L.map(l => '<div' + (l.s ? ' class="sale"' : '') + '>' + l.t + '</div>').join('');
    if (st > 0)
        el.scrollTop = st + (el.scrollHeight - sh);
}

/** 画面全体の描画 */
/** 閉店後以外は、お金の欄を無効化してグレーアウトする（？アイコンは押せるまま） */
const lockMoney = h => state.phase === 'closed' ? h : h.replace(/class="card"/g, 'class="card off"').replace(/<(input|select)/g, '<$1 disabled').replace(/<button data-a="sv/g, '<button disabled data-a="sv').replace(/<button class="alt" data-a="sv/g, '<button class="alt" disabled data-a="sv');

function render() {
    const d = Math.max(state.day, 1), m = Math.floor((d - 1) / MD) + 1, sea = SEA[seaOf(d)], we = WE[state.weather];
    byId('m').innerHTML = '<small>¥</small>' + (state.money < 0 ? '-' : '') + fmt(Math.abs(state.money));
    byId('m').className = 'money' + (state.money < 0 ? ' neg' : '');
    byId('dt').textContent = state.day === 0 ? '開業前' : sea.e + sea.n + ' / ' + calOf(d) + '月' + ((d - 1) % MD + 1) + '日目（通算' + m + 'ヶ月' + state.day + '日）' + we.e + we.n;
    byId('sp').innerHTML = Object.keys(PHN).map(k => '<span class="' + (state.phase === k ? 'on' : '') + '">' + PHN[k] + '</span>').join('');
    byId('gl').innerHTML = state.boost > 0 ? '<span class="boost">🔥ブースト中 残り' + state.boost + '秒</span>' : Math.floor(state.gauge) + ' / 100';
    byId('gb').style.width = state.gauge + '%';
    const pw = pwr(state.day);
    byId('pw').textContent = state.day === 0 ? '' : '購買力×' + (Math.round(pw * 1000) / 1000);
    byId('pw').title = '季節×' + sea.p + ' 天気×' + we.p;
    const q = quota();
    byId('ql').textContent = '¥' + fmt(state.mSales) + ' / ¥' + fmt(q);
    byId('qi').style.width = Math.min(100, state.mSales / q * 100) + '%';
    byId('qb').className = 'bar' + (state.mSales >= q ? '' : ' low');
    const left = state.day === 0 ? MD : MD - ((d - 1) % MD) - 1;
    byId('fe').textContent = 'テナント料 月¥' + fmt(tenantFee()) + '（棚' + state.slots + '台）' + (loanPay() ? ' / 返済 月¥' + fmt(loanPay()) : '') + (state.mWage > 0 ? ' / 給料未払 ¥' + fmt(state.mWage) : '');
    byId('qd').textContent = (left === 0 ? '本日が月末' : '月末まであと' + left + '日') + ' / 棚増設チェック' + (state.slotQ > 0 ? '済' : 'あと' + (3 - (Math.floor((d - 1) / MD) % 3)) + 'ヶ月');
    let a = '';
    if (state.over)
        a = '<div class="card over">' + (state.overMsg || '倒産しました。') + '</div><button class="big" data-a="ovshow">📣 結果を見る・シェアする</button>';
    else if (state.phase === 'prep')
        a = '<button class="big" data-a="fillall"' + (ill() ? ' disabled' : '') + ' style="background:transparent;color:var(--ink);border:1.5px solid var(--ink)">一括満タン（所持金の範囲で）</button><button class="big" data-a="open">開店する</button>';
    else if (state.phase === 'open')
        a = state.kama ? '<div class="hint">⛄ かまくら作り中（12:00から甘酒ボーナス）</div>' : '';
    else
        a = '<button class="big" data-a="next">' + (state.day === 0 ? '開業する' : state.hol ? '店休日を過ごす' : '翌日へ進む') + '</button>';
    byId('act').innerHTML = a;
    // 営業中の現在時刻（v1.4.1〜。購買欲ゲージの上に大きく）
    byId('clk').hidden = state.phase !== 'open' || state.over;
    if (state.phase === 'open')
        byId('clk').innerHTML = '<span class="clkt">🕘 ' + (state.openH + Math.floor(state.t / 5)) + ':' + String((state.t % 5) * 12).padStart(2, '0') + '</span><span class="clkr">' + (state.paused ? '⏸ 一時停止中 / ' : '営業中 ') + state.openH + ':00〜' + state.closeH + ':00</span>';
    syncOver();
    syncSave();
    syncAma();
    syncLog();
    let pn = '';
    if (state.evs.length)
        pn += '<div class="card"><b>本日のできごと</b>' + state.evs.map(t => '<div class="meta">' + t + '</div>').join('') + '</div>';
    const tags = [state.fem > 0 ? '🍌女性客×5（あと' + state.fem + '日）' : '', state.rb > 0 ? '🍙おにぎりブーム（あと' + state.rb + '日）' : '', state.flame > 0 ? '🔥炎上中（あと' + state.flame + '日）' : ''].filter(Boolean);
    if (tags.length)
        pn += '<div class="card meta">' + tags.join('　') + '</div>';
    if (state.boom > 0 || state.pays.length)
        pn += '<div class="card meta">' + (state.boom > 0 ? '🎉 ブーム中（あと' + state.boom + '日）：まとめ買い増　' : '') + (state.pays.length ? '💳 ' + state.pays.join('・') + '（客足×' + Math.round(Math.pow(1.2, state.pays.length) * 100) / 100 + '）' : '') + '</div>';
    if (state.phase === 'closed' && !state.over) {
        const nd = state.day + 1, nw = WE[state.next], ns = SEA[seaOf(nd)];
        if (state.day > 0)
            pn += '<div class="card"><b>本日の結果</b><div class="meta">売上 ¥' + fmt(state.dRev) + ' / 販売 ' + state.dSold + '個 / 取り逃がし ' + state.dMiss + '人 / 来店 男' + (state.dM || 0) + '・女' + (state.dF || 0) + (state.dWage ? ' / 給料 ¥' + fmt(state.dWage) : '') + '</div></div>';
        pn += '<div class="card fc"><span class="emo">' + nw.e + '</span><div style="flex:1"><b>翌日の天気予報：' + nw.n + '</b><div class="meta">' + ns.e + ns.n + ' ／ 購買力 ×' + (Math.round(ns.p * nw.p * 1000) / 1000) + (nd % MD === 0 ? ' ／ 明日は月末（テナント料¥' + fmt(tenantFee()) + '）' : '') + '</div>' + (state.warn && state.warn.snow ? '<div class="meta" style="color:var(--red);font-weight:700">⚠ 大雪の予報（交通マヒの恐れ・信頼度約80%）</div>' : '') + (state.warn && state.warn.typ ? '<div class="meta" style="color:var(--red);font-weight:700">⚠ 台風の予報（浸水の恐れ・信頼度約80%）</div>' : '') + '</div></div>';

<script>

 * achv.js — 実績（v1.3.0〜）。
 *
 * 条件を満たすと解除される。所持金の行のバッジ「🏅 解除数/18」（#achb）をタップすると一覧のポップアップ（#achm）が開く（v1.4.0〜。
 * それまでは設定タブに置いていた）。解除の瞬間は画面下にお知らせ（CG.toast）。
 * 一覧の下の「実績をリセット」で、ページ内の確認画面を出してから ACH_KEY を消す（v1.4.0〜）。
 * 保存はゲームとは別の localStorage（ACH_KEY）なので、最初からやり直しても・倒産しても消えない。
 *   形：{ <実績のid>: { at: 解除した日時(ISO), diff: 難易度のキー } }
 * 判定（achCheck）は閉店のあと（endDay）と預金の操作のあと（svMove）。ほかの関数を包むだけで、ゲームの動きは変えない。
 * 1年＝12ヶ月＝84日（1ヶ月＝MD日）。
 * ui.js の後、debuglog.js の前に読み込むこと。
 */

const ACH_KEY = 'shop-sim-achv';

/** 1年の日数（12ヶ月） */
const YEAR = MD * 12;

/** 金額を「1億」「1000億」「1兆」の形にする */
const achYen = v => v >= 1e12 ? (v / 1e12) + '兆' : v >= 1e8 ? (v / 1e8) + '億' : (v / 1e4) + '万';

/** 期間（日数）を「6ヶ月」「10年」の形にする */
const achTerm = d => d % YEAR === 0 ? (d / YEAR) + '年' : (d / MD) + 'ヶ月';

/**
 * 実績の一覧。g：見出し、v()：いまの値、n：目標、ok()：追加の条件（なければ値が目標以上で解除）
 * id は保存に使うので、公開後は変えない
 */
const ACH_GROUPS = [
    { g: '💴 累計売上', e: '💴', v: () => state.tot || 0, ns: [1e8, 1e9, 1e10, 1e11, 1e12], id: n => 'tot' + n, name: n => '累計売上 ' + achYen(n), fmt: v => '¥' + fmt(v) },
    { g: '🏪 営業', e: '🏪', v: () => state.day || 0, ns: [10 * YEAR, 50 * YEAR, 100 * YEAR], id: n => 'day' + n, name: n => '営業 ' + achTerm(n), fmt: v => '通算' + fmt(v) + '日' },
    { g: '🏦 貯金', e: '🏦', v: () => state.sv || 0, ns: [1e7, 1e8, 1e9, 1e10, 1e11, 1e12], id: n => 'sv' + n, name: n => '貯金 ' + achYen(n), fmt: v => '預金 ¥' + fmt(v) },
    { g: '🔥 インフェルノ', e: '🔥', v: () => state.diff === 'inferno' && !state.over ? state.day || 0 : 0, ns: [6 * MD, YEAR, 5 * YEAR, 10 * YEAR], id: n => 'inf' + n, name: n => 'インフェルノで ' + achTerm(n), fmt: v => state.diff === 'inferno' ? '通算' + fmt(v) + '日' : 'インフェルノで遊ぶと進みます' }
];

/** すべての実績（並び順どおり） */
const ACHS = ACH_GROUPS.flatMap(G => G.ns.map(n => ({ id: G.id(n), G, n, name: G.name(n) })));

/** 解除済み */
let achGot = CG.ls.getJSON(ACH_KEY, {});
if (!achGot || typeof achGot !== 'object' || Array.isArray(achGot))
    achGot = {};

let achSig = '';

/** ポップアップを開いているか／リセットの確認画面を出しているか */
let achOpen = false, achAsk = false;

/** 条件を満たしたものを解除する（新しく解除したものの一覧を返す） */
function achCheck() {
    if (!state || !state.diff)
        return [];
    const nw = [];
    ACHS.forEach(a => {
        if (achGot[a.id] || a.G.v() < a.n)
            return;
        achGot[a.id] = { at: new Date().toISOString(), diff: state.diff };
        nw.push(a);
    });
    if (nw.length) {
        CG.ls.setJSON(ACH_KEY, achGot);
        CG.toast('🏅 実績解除：' + nw.map(a => a.name).join('・'), 3500);
        if (typeof dbgAdd === 'function')
            dbgAdd('achv', { got: nw.map(a => a.id) });
        syncAchBadge();
        syncAch(true);
    }
    return nw;
}

/** 所持金の行のバッジ（解除数） */
function syncAchBadge() {
    const b = byId('achb');
    if (!b)
        return;
    const t = '🏅 ' + ACHS.filter(a => achGot[a.id]).length + '/' + ACHS.length;
    if (b.textContent !== t)
        b.textContent = t;
}

/** 実績のポップアップ（開いているときだけ、内容が変わったら作り直す） */
function syncAch(force) {
    let el = byId('achm');
    if (!achOpen) {
        if (el)
            el.hidden = true;
        return;
    }
    if (!el) {
        el = document.createElement('div');
        el.id = 'achm';
        el.addEventListener('click', e => {
            if (e.target === el)
                achShow(false);
        });
        document.body.appendChild(el);
    }
    el.hidden = false;
    const got = ACHS.filter(a => achGot[a.id]).length;
    const sig = got + '|' + achAsk + '|' + state.day + '|' + Math.floor((state.tot || 0) / 1e6) + '|' + Math.floor((state.sv || 0) / 1e5);
    if (!force && sig === achSig && el.innerHTML)
        return;
    achSig = sig;
    const box = el.querySelector('.achbody'), st = box ? box.scrollTop : 0;
    let h = '<div class="ovbox achbox"><div class="achtop"><b>🏅 実績' + helpIcon('achv') + '</b><span class="achn">' + got + ' / ' + ACHS.length + '</span><button class="alt achx" data-a="achclose" aria-label="閉じる">✕</button></div><div class="achbody">';
    ACH_GROUPS.forEach(G => {
        const cur = G.v();
        h += '<div class="achg"><div class="achgh"><span>' + G.g + '</span><span class="meta">' + G.fmt(cur) + '</span></div><div class="achl">';
        G.ns.forEach(n => {
            const a = ACHS.find(x => x.id === G.id(n)), r = achGot[a.id];
            if (r) {
                const d = new Date(r.at), df = DF[r.diff];
                h += '<div class="ach on" title="' + (isNaN(d) ? '' : d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate()) + (df ? '・' + df.n : '') + '">' +
                    '<span class="achi">🏅</span><span class="acht">' + a.name + '</span><span class="achd">' + (isNaN(d) ? '' : (d.getMonth() + 1) + '/' + d.getDate()) + (df ? ' ' + df.n : '') + '</span></div>';
            }
            else {
                const pc = Math.max(0, Math.min(100, cur / n * 100));
                h += '<div class="ach"><span class="achi">🔒</span><span class="acht">' + a.name + '</span><span class="achp"><i style="width:' + pc + '%"></i></span></div>';
            }
        });
        h += '</div></div>';
    });
    h += '<div class="meta" style="margin-top:10px">実績は最初からやり直しても消えません。</div>';
    if (achAsk)
        h += '<div class="card rst achask"><b>⚠ 本当に消しますか？</b><div class="meta">解除した実績' + got + '個がすべて消え、元に戻せません。今のお店の数字がすでに条件を満たしている実績は、次の閉店のあとにもう一度解除されます。</div><div class="btns"><button class="rstb" data-a="achdel">消す</button><button class="alt" data-a="achno">やめる</button></div></div>';
    else
        h += '<button class="alt achr" data-a="achask"' + (got ? '' : ' disabled') + '>🗑 実績をリセット</button>';
    h += '</div></div>';
    el.innerHTML = h;
    const nb = el.querySelector('.achbody');
    if (nb)
        nb.scrollTop = achAsk ? nb.scrollHeight : st;
}

/** ポップアップを開く・閉じる */
function achShow(on) {
    achOpen = on;
    achAsk = false;
    achSig = '';
    if (!on)
        hideHelp();
    syncAch(true);
}

/** 実績をすべて消す（確認画面の「消す」） */
function achReset() {
    achGot = {};
    CG.ls.setJSON(ACH_KEY, achGot);
    achAsk = false;
    if (typeof dbgAdd === 'function')
        dbgAdd('achv', { reset: true });
    CG.toast('🗑 実績をリセットしました', 2500);
    syncAchBadge();
    syncAch(true);
}

document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled)
        return;
    const a = b.dataset.a;
    if (a === 'achopen')
        achShow(true);
    if (a === 'achclose')
        achShow(false);
    if (a === 'achask' || a === 'achno') {
        achAsk = a === 'achask';
        syncAch(true);
    }
    if (a === 'achdel')
        achReset();
});

// 閉店のあと・預金の操作のあとに判定する
['endDay', 'svMove'].forEach(name => {
    const f = window[name];
    window[name] = function () {
        const r = f.apply(this, arguments);
        achCheck();
        return r;
    };
});

// 描画のたびにバッジをそろえる（ポップアップは開いているときだけ中身を作り直す）
{
    const r0 = render;
    window.render = function () {
        r0.apply(this, arguments);
        syncAchBadge();
        syncAch();
    };
}
</script>
<script>
/**
 * debuglog.js — バグ調査用のデバッグログ（記録と送信）。
 *
 * 記録・エラーの捕捉・送信は共通部品 common/v1/debug.js（CG.debug）。ここは「何を記録するか」と送信欄の見た目だけ。
 * 記録するもの（localStorage の DBG_KEY に直近 DBG_MAX 件。再読み込みしても残る）：
 *   - 操作（投資・融資・預金・開店・翌日・閉店・甘酒など）と、その前後のフェーズ・所持金
 *   - 投資ボタンが無視されたときの理由（investBlock）
 *   - イベントの文言（addEvent）
 *   - JavaScript のエラー（CG.debug が自動で記録）
 * 送信：「⚙設定」タブの「🐞 デバッグログを送る」。サーバー（worker/index.js の /shop-sim/debug）が
 *   D1（chikuwa-debug の debug_logs）に保存し、受付番号を返す。送る中身は state 全体＋上の記録。
 * ほかのファイルの関数を「包んで」記録するだけなので、ゲームの動きは変えない。
 * ui.js の後、main.js の前に読み込むこと。
 */

const DBG_KEY = 'shop-sim-debuglog';
const DBG_MAX = 300;

/** 送信欄の状態（null＝未送信、{busy}・{ok, code}・{ok:false, t}） */
let dbgMsg = null;
let dbgSig = '';

/** いまの状態の要約（1件の記録に付ける） */
const dbgSnap = () => typeof state !== 'undefined' && state ? {
    d: state.day, ph: state.phase, m: Math.round(state.money), sk: state.sick || 0, dp: state.dep || 0,
    ov: !!state.over, km: state.kama || 0, cl: state.clean || 0, sl: state.slots
} : {};

CG.debug.init({ key: DBG_KEY, max: DBG_MAX, snap: dbgSnap });

/** 1件記録する（ほかのファイルから呼んでもよい） */
const dbgAdd = (ev, extra) => CG.debug.add(ev, extra);

/** 関数を包んで、前後のフェーズ・所持金の変化を記録する。why：お金が動かなかったら「無視された理由」も残す */
function dbgWrap(name, opt) {
    CG.debug.wrap(name, {
        before: () => ({ ph0: state && state.phase, m0: state && state.money, l0: state && state.log[0] }),
        after: b => {
            const x = { ph0: b.ph0 };
            if (state && state.money !== b.m0)
                x.dm = Math.round(state.money - b.m0);
            else if (opt && opt.why)
                x.ign = investBlock() || 'お金不足か上限';
            if (state && state.log[0] !== b.l0)
                x.lg = state.log[0];
            return x;
        }
    });
}

['buy', 'upgrade', 'takeLoan', 'svMove'].forEach(n => dbgWrap(n, { why: true }));
['fillAll', 'openShop', 'nextDay', 'endDay', 'newGame', 'restart', 'applyLoad', 'amaStart', 'amaFinish', 'amaClose'].forEach(n => dbgWrap(n));
{
    const f = addEvent;
    window.addEvent = function (t) {
        dbgAdd('event', { lg: t });
        return f.apply(this, arguments);
    };
}

/** 送信する */
async function dbgSend() {
    if (dbgMsg && dbgMsg.busy)
        return;
    const nt = byId('dbgn');
    dbgMsg = { busy: true };
    syncDbg();
    const r = await CG.debug.send(nt ? nt.value : '', { why: investBlock(), state });
    dbgMsg = r.ok ? { ok: true, code: r.code } : { ok: false, t: r.t };
    if (r.ok) {
        const n2 = byId('dbgn');
        if (n2)
            n2.value = '';
    }
    syncDbg(true);
}

/** 「設定」タブのデバッグログ欄（内容が変わったときだけ作り直す。入力中のメモは消さない） */
function syncDbg(force) {
    const el = byId('dbg');
    if (!el)
        return;
    const sig = JSON.stringify(dbgMsg);
    if (!force && sig === dbgSig && el.innerHTML)
        return;
    dbgSig = sig;
    const old = byId('dbgn'), note = old ? old.value : '';
    let h = '<b>🐞 デバッグ</b>' + helpIcon('dbg') +
        '<textarea id="dbgn" rows="2" maxlength="500" placeholder="どんなことが起きた？（任意）例：2ヶ月目に投資ボタンが押せない" style="width:100%;box-sizing:border-box;margin:6px 0;font:inherit;font-size:13px;padding:6px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)"></textarea>' +
        '<button data-a="dbgsend"' + (dbgMsg && dbgMsg.busy ? ' disabled' : '') + '>' + (dbgMsg && dbgMsg.busy ? '送信中…' : '🐞 デバッグログを送る') + '</button>' +
        '<div class="meta">直近' + CG.debug.log.length + '件の操作と、いまのゲームの状態を開発者に送ります。</div>';
    if (dbgMsg && dbgMsg.ok)
        h += '<div class="meta svok">✅ 送信しました。受付番号 <b>' + dbgMsg.code + '</b>（開発者に伝えてください）</div>';
    else if (dbgMsg && dbgMsg.t)
        h += '<div class="meta svwarn">⚠ ' + dbgMsg.t + '</div>';
    el.innerHTML = h;
    byId('dbgn').value = note;
}

{
    const r0 = render;
    window.render = function () {
        r0.apply(this, arguments);
        syncDbg();
    };
}
document.addEventListener('click', e => {
    const b = e.target.closest('button[data-a="dbgsend"]');
    if (b && !b.disabled)
        dbgSend();
});
</script>
<script>
/**
 * main.js — 起動処理（読み込みの最後に実行）。
 */

PRODUCTS.forEach(p => {
    p.b = p.c;
    p.n0 = p.n;
});
applyUp();
if (!LA.includes(state.ln.a))
    state.ln.a = LA[0];
applyDiff();
initLayout();
byId('ver').innerHTML = 'ちいさなお店 v' + VERSION + '<br>' + COPYRIGHT;
{
    // 更新履歴（最新だけ表示し、過去の分は開いて見る）
    const li = c => '<li><b>v' + c[0] + '</b>（' + c[1] + '）' + c[2] + '</li>';
    byId('chg').innerHTML = '<b>📝 更新履歴</b><ul>' + li(CHANGES[0]) + '</ul>' +
        (CHANGES.length > 1 ? '<details><summary>過去の更新履歴</summary><ul>' + CHANGES.slice(1).map(li).join('') + '</ul></details>' : '');
}
setInterval(() => {
    fr++;
    drawPx();
}, 180);
drawPx();
fill();
render();
(function loop() {
    tick();
    setTimeout(loop, 1000 / (state.spd || 1));
})();
</script>
