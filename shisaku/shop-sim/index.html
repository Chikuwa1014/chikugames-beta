<!DOCTYPE html>
<html lang="ja">
<head>
<!-- 試作環境：ちいさなお店 v2.0.0（号口へ出す前の確認用） -->
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ちいさなお店 - 商品販売シミュレーター</title>
<style>
/* 見た目（v2.0.0〜 ミント×コーラルのカジュアル・モダンなデザイン）。
   色はすべて :root の変数。ダークモードは変数を上書きして対応 */
@import url("https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap");

:root {
  --bg:#eef8f4;
  --bg2:#dff3eb;
  --card:#ffffff;
  --ink:#1f3a35;
  --sub:#6b8a82;
  --line:#d5ebe2;
  --mint:#2fbf97;
  --mint2:#20a07e;
  --mintl:#d9f4ea;
  --coral:#ff7a68;
  --coral2:#f25c4a;
  --corall:#ffe4df;
  --tag:#ff7a68;
  --tagink:#ffffff;
  --gold:#ffbf47;
  --red:#ef4f4f;
  --ok:#2fbf97;
  --bar:#e3f1ec;
  --shadow:0 2px 0 rgba(31,58,53,.06), 0 6px 18px rgba(31,58,53,.07);
  --shadow2:0 4px 0 rgba(31,58,53,.10), 0 10px 26px rgba(31,58,53,.12);
  --cg-accent:#2fbf97;
  --mintg:#6fe0bf;
  --coral3:#c9443a;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg:#0f1f1b;
    --bg2:#132a24;
    --card:#18302a;
    --ink:#e5f5ef;
    --sub:#8fb3a8;
    --line:#24433b;
    --mint:#3ed3a8;
    --mint2:#2cb38d;
    --mintl:#1c3f35;
    --coral:#ff8a78;
    --coral2:#ff6f5c;
    --corall:#4a2a27;
    --tag:#ff8a78;
    --tagink:#2a0d08;
    --red:#ff6b6b;
    --ok:#3ed3a8;
    --bar:#0e211c;
    --shadow:0 2px 0 rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.25);
    --shadow2:0 4px 0 rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.35);
    --cg-accent:#3ed3a8;
    color-scheme:dark;
  }
}

:root[data-theme="dark"] {
  --bg:#0f1f1b;
  --bg2:#132a24;
  --card:#18302a;
  --ink:#e5f5ef;
  --sub:#8fb3a8;
  --line:#24433b;
  --mint:#3ed3a8;
  --mint2:#2cb38d;
  --mintl:#1c3f35;
  --coral:#ff8a78;
  --coral2:#ff6f5c;
  --corall:#4a2a27;
  --tag:#ff8a78;
  --tagink:#2a0d08;
  --red:#ff6b6b;
  --ok:#3ed3a8;
  --bar:#0e211c;
  --shadow:0 2px 0 rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.25);
  --shadow2:0 4px 0 rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.35);
  --cg-accent:#3ed3a8;
  color-scheme:dark;
}

* {
  box-sizing:border-box;
}

/* ---- 全体の骨組み：上（所持金・店の絵）／中（タブの中身・スクロール）／下（タブバー） ---- */
html,body {
  overflow:hidden;
}

body {
  margin:0 auto;
  background:var(--bg);
  color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:15px;
  line-height:1.55;
  max-width:560px;
  padding:0 12px;
  height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
  -webkit-tap-highlight-color:transparent;
}

/* お店の屋根（コーラルと白のしましまに、波形のふち） */
.awning {
  flex:none;
  position:relative;
  height:10px;
  margin:0 -12px 9px;
  background:repeating-linear-gradient(90deg,var(--coral) 0 24px,#fff 24px 48px);
}

.awning::after {
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:100%;
  height:8px;
  background:radial-gradient(circle at 12px 0,var(--coral) 11.5px,transparent 12px) 0 0/48px 8px repeat-x,
    radial-gradient(circle at 36px 0,#fff 11.5px,transparent 12px) 0 0/48px 8px repeat-x;
  filter:drop-shadow(0 2px 1px rgba(0,0,0,.08));
}

:root[data-theme="dark"] .awning, :root[data-theme="dark"] .awning::after {
  filter:brightness(.85);
}

@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) .awning { filter:brightness(.85); }
}

#top {
  flex:none;
  position:relative;
  z-index:30;
  background:var(--bg);
  margin:0 -12px;
  padding:2px 12px 0;
  border-radius:0 0 22px 22px;
  overflow:hidden;
  box-shadow:0 6px 16px -8px rgba(31,58,53,.25);
}

#scr {
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:12px 0 24px;
  -webkit-overflow-scrolling:touch;
}

/* ---- 所持金のカード（1行目）と日付のチップ（2行目） ---- */
.mrow {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:5px 8px 5px 14px;
  border-radius:16px;
  background:linear-gradient(135deg,var(--mint),var(--mint2));
  color:#fff;
  box-shadow:var(--shadow);
}

.money {
  margin:0;
  padding:0;
  min-width:0;
  flex:none;
  font-size:24px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.3px;
  line-height:1.2;
  text-shadow:0 1px 0 rgba(0,0,0,.08);
}

.money small {
  font-size:15px;
  font-weight:700;
  opacity:.85;
  margin-right:3px;
}

.money.neg {
  color:#fff;
}

.mrow:has(.money.neg) {
  background:linear-gradient(135deg,var(--coral),var(--coral2));
}

button.achb, button.alt.achb {
  flex:none;
  width:auto;
  padding:4px 11px;
  border:0;
  border-radius:999px;
  background:rgba(255,255,255,.22);
  color:#fff;
  font-size:13px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  box-shadow:none;
}

.chips {
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:4px;
  margin-top:5px;
}

.chip {
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:1px 9px;
  border-radius:999px;
  background:var(--card);
  border:1px solid var(--line);
  color:var(--ink);
  font-size:12px;
  font-weight:700;
  line-height:1.6;
  white-space:nowrap;
}

.chip.df-easy { background:#2fbf97; border-color:transparent; color:#fff; }
.chip.df-normal { background:#3aa6dc; border-color:transparent; color:#fff; }
.chip.df-hard { background:#ff8a4c; border-color:transparent; color:#fff; }
.chip.df-inferno { background:#d93a5b; border-color:transparent; color:#fff; }

.chip.dim {
  color:var(--sub);
  font-weight:500;
}

@media (max-width:389px) {
  .chips { gap:3px; }
  .chip { padding:1px 6px; font-size:11px; }
}

/* ---- 店の様子（ドット絵）。v2.0.0〜 画面の端まで広げ、見出しの行は絵の上に重ねる ---- */
details.shop {
  position:relative;
  margin:8px -12px 0;
  padding:0;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
}

details.shop > summary {
  position:absolute;
  z-index:2;
  top:6px;
  left:8px;
  right:8px;
  margin:0;
  display:flex;
  align-items:center;
  gap:4px;
  list-style:none;
  font-weight:700;
  font-size:12px;
}

details.shop > summary::-webkit-details-marker {
  display:none;
}

/* 見出しの文字は半透明の黒いラベルに白字（どの空の色でも読めるように） */
.shn, .pw {
  display:inline-flex;
  align-items:center;
  padding:0 9px;
  border-radius:999px;
  background:rgba(0,0,0,.45);
  color:#fff;
  font-size:12px;
  font-weight:800;
  line-height:22px;
  white-space:nowrap;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}

.shn::before {
  content:"▾";
  margin-right:4px;
  opacity:.8;
}

#ph {
  display:inline-block;
  padding:0 9px;
  border-radius:999px;
  background:#fff;
  color:var(--mint2);
  font-size:12px;
  font-weight:800;
  line-height:22px;
  box-shadow:0 1px 3px rgba(0,0,0,.15);
}

details.shop > summary button.hp {
  background:rgba(0,0,0,.45);
  color:#fff;
}

.pw {
  margin-left:auto;
}

.pw:empty {
  display:none;
}

/* 見出しは看板（絵の中央の上）にかからないよう、左右に寄せて小さく */
@media (max-width:389px) {
  .shn, .pw, #ph { font-size:11px; padding:0 7px; }
}

/* 絵を閉じたとき：見出しは普通の行に戻し、「店の様子」の文字も出す */
details.shop:not([open]) .shn::after {
  content:" 店の様子";
}

details.shop:not([open]) {
  padding:6px 12px;
}

details.shop:not([open]) > summary {
  position:static;
}

details.shop:not([open]) .shn::before {
  content:"▸";
}

#px {
  width:100%;
  image-rendering:pixelated;
  display:block;
  margin:0;
}

.pxw {
  position:relative;
}

/* 一時停止・倍速（v2.0.0〜 店の絵の右下に重ねる。絵を閉じたときは下に並べる） */
.spd {
  position:absolute;
  z-index:3;
  right:6px;
  bottom:6px;
  display:flex;
  gap:4px;
}

details.shop:not([open]) + .spd {
  position:static;
  justify-content:flex-end;
  margin:0 0 8px;
}

.spd button, .spd button.alt {
  flex:none;
  width:38px;
  height:30px;
  padding:0;
  border:0;
  border-radius:999px;
  background:rgba(0,0,0,.55);
  color:#fff;
  font-size:13px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  box-shadow:none;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}

.spd button.on {
  background:var(--coral);
  color:#fff;
}

.spd button:disabled {
  opacity:.45;
}

/* ---- 下のタブバー（v2.0.0〜） ---- */
#tabs {
  flex:none;
  position:relative;
  z-index:30;
  margin:0 -12px;
  padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));
  background:var(--card);
  border-top:1px solid var(--line);
  box-shadow:0 -6px 18px -10px rgba(31,58,53,.3);
  /* 取っ手で隠す・出すときに、せり下がる・せり上がる（v2.0.0〜。下へのずらし量は js/ui.js の tabBar） */
  transition:margin-bottom .28s cubic-bezier(.3,.8,.3,1);
}

#tabs.noanim {
  transition:none;
}

#tabr {
  display:flex;
  gap:4px;
}

/* タブバーの上のふちの真ん中の取っ手（隠すと、これだけが画面の下に残る） */
#tabs button.tbh {
  position:absolute;
  left:50%;
  bottom:100%;
  transform:translateX(-50%);
  width:64px;
  height:20px;
  padding:0;
  border:1px solid var(--line);
  border-bottom:0;
  border-radius:12px 12px 0 0;
  background:var(--card);
  color:var(--mint2);
  font-size:10px;
  line-height:1;
  box-shadow:0 -4px 10px -6px rgba(31,58,53,.35);
}

#tabs button.tbh:active:not(:disabled) {
  transform:translateX(-50%);
  box-shadow:0 -4px 10px -6px rgba(31,58,53,.35);
}

#tabs.off {
  box-shadow:none;
}

/* 隠したときは、いちばん下の中身が取っ手に隠れないよう余白を足す */
body:has(#tabs.off) #scr {
  padding-bottom:40px;
}

#tabs.off button.tbh {
  width:72px;
  height:24px;
  font-size:12px;
  background:var(--mint);
  border-color:var(--mint);
  color:#fff;
}

@media (prefers-reduced-motion:reduce) {
  #tabs { transition:none; }
}

#tabs button.tab {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
  padding:5px 0 4px;
  border:0;
  border-radius:14px;
  background:transparent;
  color:var(--sub);
  font-size:11px;
  font-weight:700;
  box-shadow:none;
  transform:none;
}

#tabs button.tab .ti {
  font-size:20px;
  line-height:1.15;
  filter:grayscale(.6);
  opacity:.75;
  transition:transform .15s;
}

#tabs button.tab.on {
  background:var(--mintl);
  color:var(--mint2);
}

#tabs button.tab.on .ti {
  filter:none;
  opacity:1;
  transform:translateY(-1px) scale(1.08);
}

/* ---- カード・文字 ---- */
.card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:12px 14px;
  margin-bottom:10px;
  box-shadow:var(--shadow);
}

.card.off {
  opacity:.5;
}

.meta {
  color:var(--sub);
  font-size:13px;
}

.row {
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:8px;
  font-size:13px;
}

.hint {
  font-size:13px;
  color:var(--sub);
  margin:4px 0 10px;
  padding:8px 12px;
  border-radius:14px;
  background:var(--mintl);
}

h2 {
  display:flex;
  align-items:center;
  gap:8px;
  font-size:16px;
  font-weight:800;
  margin:20px 2px 10px;
}

h2::before {
  content:"";
  width:6px;
  height:18px;
  border-radius:3px;
  background:linear-gradient(var(--mint),var(--coral));
}

.boost {
  color:var(--coral2);
  font-weight:800;
}

.over {
  background:linear-gradient(135deg,var(--coral),var(--coral2));
  border:0;
  color:#fff;
  text-align:center;
  font-weight:800;
}

.steps {
  display:flex;
  gap:6px;
  margin:10px 0;
}

.steps span {
  flex:1;
  text-align:center;
  font-size:13px;
  font-weight:700;
  padding:6px 0;
  border-radius:999px;
  background:var(--bar);
  color:var(--sub);
}

.steps span.on {
  background:var(--mint);
  color:#fff;
}

/* ---- ゲージ（購買欲・ノルマ・幸福度） ---- */
.bar {
  height:12px;
  background:var(--bar);
  border-radius:999px;
  overflow:hidden;
  margin:6px 0 2px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.08);
}

.bar i {
  display:block;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--mint),var(--mintg));
  transition:width .9s linear;
}

.bar.g i {
  background:linear-gradient(90deg,#7ad8f5,var(--gold),var(--coral));
}

.bar.low i {
  background:linear-gradient(90deg,var(--coral2),var(--coral));
}

.gr {
  display:grid;
  grid-template-columns:70px 1fr auto;
  align-items:center;
  gap:10px;
  font-size:13px;
  margin:6px 0;
}

.gr b {
  display:inline-flex;
  align-items:center;
  gap:2px;
  white-space:nowrap;
  font-weight:800;
}

.gr .bar {
  margin:0;
}

.gr span {
  font-variant-numeric:tabular-nums;
  text-align:right;
  font-weight:700;
}

/* 購買欲・ノルマ・幸福度に色の目印 */
.gr:nth-of-type(1) b::before, .gr:nth-of-type(2) b::before, .gr:nth-of-type(3) b::before {
  content:"";
  flex:none;
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  margin-right:4px;
  background:var(--gold);
}

.gr:nth-of-type(2) b::before {
  background:var(--coral);
}

.gr:nth-of-type(3) b::before {
  background:var(--mint);
}

details summary {
  cursor:pointer;
  color:var(--sub);
  font-size:12px;
  margin-top:6px;
}

details .meta {
  margin-top:4px;
}

.dtl {
  margin-top:6px;
  padding-top:4px;
  border-top:1px dashed var(--line);
}

.dtl summary {
  font-size:12px;
  color:var(--sub);
  cursor:pointer;
  padding:2px 0;
}

/* ---- ボタン ---- */
button {
  font:inherit;
  font-weight:800;
  border:0;
  border-radius:999px;
  padding:9px 8px;
  background:var(--mint);
  color:#fff;
  flex:1;
  cursor:pointer;
  touch-action:manipulation;
  box-shadow:0 3px 0 var(--mint2);
  transition:transform .08s, box-shadow .08s, background .15s;
}

button:active:not(:disabled) {
  transform:translateY(2px);
  box-shadow:0 1px 0 var(--mint2);
}

button.alt {
  background:var(--card);
  color:var(--mint2);
  border:1.5px solid var(--mint);
  box-shadow:0 3px 0 var(--mintl);
}

button.alt:active:not(:disabled) {
  box-shadow:0 1px 0 var(--mintl);
}

button.big {
  width:100%;
  padding:15px;
  font-size:18px;
  font-weight:900;
  letter-spacing:.05em;
  background:linear-gradient(180deg,var(--coral),var(--coral2));
  color:#fff;
  margin-bottom:10px;
  box-shadow:0 5px 0 var(--coral3), 0 10px 20px -6px color-mix(in srgb,var(--coral2) 55%,transparent);
}

button.big:active:not(:disabled) {
  transform:translateY(3px);
  box-shadow:0 2px 0 var(--coral3), 0 4px 10px -4px color-mix(in srgb,var(--coral2) 50%,transparent);
}

button.big.ghost {
  background:var(--card);
  color:var(--ink);
  border:1.5px solid var(--line);
  font-size:15px;
  padding:12px;
  box-shadow:0 3px 0 var(--line);
}

button.big.ghost:active:not(:disabled) {
  box-shadow:0 1px 0 var(--line);
}

button:disabled {
  opacity:.35;
  cursor:default;
}

button:focus-visible {
  outline:3px solid var(--coral);
  outline-offset:2px;
}

.btns {
  display:flex;
  gap:8px;
  margin-top:10px;
}

/* ---- ログ ---- */
.log {
  font-size:13px;
  line-height:1.5;
  color:var(--ink);
  font-weight:700;
  /* 4行分の枠でスクロール（v1.4.0〜）。行が増えてもほかの表示は動かない */
  height:calc(4 * 1.5em + 16px);
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:8px 12px;
  margin-bottom:10px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--card);
  box-shadow:inset 0 2px 6px rgba(31,58,53,.05);
}

.log div {
  /* v1.5.2：長い行は「...」で切らずに折り返し、2行目以降を1文字分下げる */
  padding-left:1em;
  text-indent:-1em;
  overflow-wrap:anywhere;
}

.log div.sale {
  color:var(--sub);
  font-weight:500;
}

/* ---- 陳列棚 ---- */
.grid {
  display:grid;
  /* 幅に余裕があれば3列以上（v2.0.0〜） */
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px;
}

/* 投資の行も、幅に余裕があれば2列（v2.0.0〜） */
#up {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  column-gap:10px;
}

#up > .ivb {
  grid-column:1 / -1;
}

.shelf {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:12px;
  box-shadow:var(--shadow);
}

.shelf.empty {
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--sub);
  border:2px dashed var(--line);
  min-height:140px;
  text-align:center;
  font-size:13px;
  background:transparent;
  box-shadow:none;
}

.top {
  display:flex;
  align-items:center;
  gap:10px;
}

.shelf .emo {
  flex:none;
  display:grid;
  place-items:center;
  width:46px;
  height:46px;

/* ---- マイナスのイベントが起きた瞬間に店の絵を揺らす・大地震の日は揺れ続ける ---- */
#px.shake {
  animation:pxshake .6s ease-out;
}

@keyframes pxshake {
  0%, 100% { transform:translate(0,0); }
  15% { transform:translate(-4px,1px); }
  30% { transform:translate(4px,-1px); }
  45% { transform:translate(-3px,1px); }
  60% { transform:translate(3px,0); }
  80% { transform:translate(-1px,0); }
}

#px.quake {
  animation:pxquake .28s linear infinite;
}

@keyframes pxquake {
  0%, 100% { transform:translate(0,0); }
  25% { transform:translate(-2px,1px); }
  50% { transform:translate(2px,-1px); }
  75% { transform:translate(-1px,0); }
}

@media (prefers-reduced-motion:reduce) {
  #px.shake, #px.quake { animation:none; }
}

/* ---- 横画面（横向きで高さ 560px 以下）と PC・タブレット（幅 900px 以上）：左に上の部分、右にタブの中身とタブバー ---- */
@media (orientation:landscape) and (max-height:560px), (min-width:900px) {
  body {
    max-width:1280px;
    display:grid;
    grid-template-columns:minmax(260px,42%) minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr) auto;
    column-gap:18px;
    padding-left:max(12px,env(safe-area-inset-left,0px));
    padding-right:max(12px,env(safe-area-inset-right,0px));
  }

  .awning {
    grid-column:1 / -1;
    margin:0 calc(-1 * max(12px,env(safe-area-inset-right,0px))) 10px calc(-1 * max(12px,env(safe-area-inset-left,0px)));
  }

  #top {
    grid-column:1;
    grid-row:2 / span 2;
    margin:0;
    padding:2px 0 8px;
    box-shadow:none;
    border-radius:0;
    overflow-y:auto;
    min-height:0;
  }

  details.shop {
    margin:8px 0 0;
    border-radius:18px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }

  details.shop:not([open]) {
    box-shadow:none;
    overflow:visible;
  }

  #scr {
    grid-column:2;
    grid-row:2;
    padding-top:6px;
  }

  #tabs {
    grid-column:2;
    grid-row:3;
    margin:0;
    border:1px solid var(--line);
    border-bottom:0;
    border-radius:18px 18px 0 0;
  }

  #tabs button.tab {
    flex-direction:row;
    justify-content:center;
    gap:4px;
    font-size:12px;
  }

  #tabs button.tab .ti {
    font-size:16px;
  }

  .spd {
    position:static;
    justify-content:flex-end;
    margin:8px 0;
  }
}

@media (orientation:landscape) and (max-height:560px) {
  #px {
    max-height:42vh;
    object-fit:contain;
  }
}

/* PC では文字とタブを少し大きく */

/* ---- 遊び方（チュートリアル。v2.0.0〜 js/tutorial.js）：画面を暗くして説明する場所だけ光らせ、ちくわくんの吹き出しで案内 ---- */
#tut {
  position:fixed;
  inset:0;
  z-index:60;
}

#tut[hidden] {
  display:none;
}

/* 光らせる枠（まわりを大きな影で暗くする。枠がないときは全体を暗く） */
.tuth {
  position:fixed;
  border-radius:16px;
  box-shadow:0 0 0 3px var(--coral), 0 0 0 9999px rgba(10,24,20,.62);
  transition:left .25s, top .25s, width .25s, height .25s;
  pointer-events:none;
}

.tuth[hidden] {
  display:block;
  width:0;
  height:0;
  left:50%;
  top:50%;
  box-shadow:0 0 0 9999px rgba(10,24,20,.62);
}

.tutb {
  position:fixed;
  width:calc(100vw - 24px);
  padding:12px 14px;
  border-radius:20px;
  background:var(--card);
  color:var(--ink);
  box-shadow:0 14px 40px rgba(0,0,0,.35);
  border-top:5px solid var(--mint);
  transition:left .25s, top .25s;
  animation:ovpop .3s cubic-bezier(.2,1.4,.4,1);
}

.tutb.mid {
  left:50% !important;
  top:50% !important;
  transform:translate(-50%,-50%);
  animation:none;
}

.tuthd {
  display:flex;
  align-items:center;
  gap:8px;
}

.tuthd canvas {
  flex:none;
  width:36px;

<!-- ちくわゲームズ共通部品（common/v1）。build.py・make-artifact.py が中に埋め込む -->
<script>
/**
 * ちくわゲームズ 共通部品 v1 — core.js（いちばん最初に読み込む）
 *
 * どのゲームでも使う小さな道具をまとめたもの。ほかの共通部品（share・save・debug・room）はこれを前提にする。
 * すべて window.CG（ちくわゲームズ）の下に置き、ゲームの変数や関数と名前がぶつからないようにする。
 *
 *   読み込み：ゲームの HTML で script タグの src に ../common/v1/core.js を書く（ほかの共通部品より先）
 *   ※ 共通部品のコメントには閉じタグ（スラッシュ＋script）を書かない。1 ファイルに埋め込んだとき、そこで script が終わってしまう
 *   CG.init({ game: 'shop-sim', title: 'ちいさなお店', version: '1.2.0' });
 *
 * 仕様を変えて古いゲームが動かなくなるときは v1 を直さず、common/v2/ を作る（公開済みのゲームを壊さない）。
 * 使い方の全体はリポジトリ直下の CLAUDE.md「14. 共通部品」と common/README.md。
 */
(function () {
    const CG = window.CG || (window.CG = {});
    CG.LIB = 'v1';

    /** ゲームの情報（init で決める）。game はフォルダ名＝URL、デバッグ送信・マルチの宛先にも使う */
    CG.info = { game: '', title: '', version: '' };
    CG.init = function (o) {
        Object.assign(CG.info, o || {});
        return CG;
    };

    /** localStorage の読み書き（失敗しても止まらない。プライベートモードなど） */
    CG.ls = {
        get(k, d = null) {
            try {
                const v = localStorage.getItem(k);
                return v === null ? d : v;
            }
            catch (e) {
                return d;
            }
        },
        set(k, v) {
            try {
                localStorage.setItem(k, v);
                return true;
            }
            catch (e) {
                return false;
            }
        },
        del(k) {
            try {
                localStorage.removeItem(k);
            }
            catch (e) { }
        },
        getJSON(k, d = null) {
            const v = CG.ls.get(k, null);
            if (v === null)
                return d;
            try {
                return JSON.parse(v);
            }
            catch (e) {
                return d;
            }
        },
        setJSON(k, v) {
            return CG.ls.set(k, JSON.stringify(v));
        }
    };

    /** HTML に埋め込むときの書き換え（< と & と "） */
    CG.esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

    /** 2桁ゼロ埋め */
    CG.p2 = n => String(n).padStart(2, '0');

    /** いま開いているゲームの公開 URL（? と # は付けない） */
    CG.pageUrl = () => location.origin + location.pathname;

    /**
     * 文字列をコピーする。成功なら true。
     * 新しい方法（clipboard）がだめなら、見えない入力欄を使う昔の方法を試す。prompt() は使わない（アーティファクトで働かない）
     */
    CG.copy = async function (text) {
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(text);
                return true;
            }
        }
        catch (e) { }
        const t = document.createElement('textarea');
        t.value = text;
        t.setAttribute('readonly', '');
        t.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
        document.body.append(t);
        t.select();
        let ok = false;
        try {
            ok = document.execCommand('copy');
        }
        catch (e) { }
        t.remove();
        return ok;
    };

    /** ファイルとして保存（ダウンロード）。data は文字列か Blob */
    CG.download = function (name, data, type = 'application/json') {
        const blob = data instanceof Blob ? data : new Blob([data], { type });
        const u = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = u;
        a.download = name;
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(u), 10000);
    };

    /** ファイルを文字列で読む（Promise） */
    CG.readText = file => new Promise((ok, ng) => {
        const r = new FileReader();
        r.onload = () => ok(String(r.result));
        r.onerror = () => ng(new Error('ファイルを読み取れませんでした。'));
        r.readAsText(file);
    });

    /** 画面の下に短いお知らせを出す（ms ミリ秒で消える） */
    let toastTimer = 0;
    CG.toast = function (msg, ms = 2200) {
        let el = document.getElementById('cg-toast');
        if (!el) {
            el = document.createElement('div');
            el.id = 'cg-toast';
            el.setAttribute('role', 'status');
            el.style.cssText = 'position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9999;' +
                'max-width:calc(100vw - 32px);padding:10px 16px;border-radius:12px;background:rgba(30,30,30,.92);color:#fff;font-size:14px;' +
                'line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.3);transition:opacity .2s;pointer-events:none;text-align:center';
            document.body.append(el);
        }
        el.textContent = msg;
        el.style.opacity = '1';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.style.opacity = '0', ms);
    };
})();
</script>
<script>
/**
 * ちくわゲームズ 共通部品 v1 — share.js（SNS 共有）。core.js の後に読む。
 *
 * 共通ルール「5. SNS 共有」をそのまま形にしたもの。#ちくわげーむず は必ず付く（書き忘れても足す）。
 *
 *   const s = { msg: 'ちいさなお店を開いたけど倒産しちゃった！', tags: ['ちいさなお店'], url: CG.pageUrl() };
 *   CG.share.text(s)         // 文面（URL 込み）。コピー用の窓などに
 *   CG.share.open(s, file)   // 端末の共有メニュー（画像 file があれば添付）。使えなければ X の投稿画面
 *   CG.share.links(s)        // { x, line, facebook } のリンク先
 *   CG.share.copy(s)         // 文面をコピー（成功なら true）
 *
 * tags は # を付けずに書く。ゲーム固有のタグを先に、ちくわげーむず が最後に来る。
 */
(function () {
    const CG = window.CG;
    const SITE_TAG = 'ちくわげーむず';

    /** タグの並び（# なし、重複なし、ちくわげーむず を最後に） */
    function tagList(s) {
        const t = (s.tags || []).map(x => String(x).replace(/^#/, '')).filter(x => x && x !== SITE_TAG);
        return [...new Set(t), SITE_TAG];
    }
    const urlOf = s => s.url || CG.pageUrl();

    CG.share = {
        TAG: SITE_TAG,
        tags: tagList,

        /** 文面（本文・ハッシュタグ・URL を改行でつなぐ） */
        text(s) {
            return s.msg + '\n' + tagList(s).map(t => '#' + t).join(' ') + '\n' + urlOf(s);
        },

        /** 各 SNS の投稿画面の URL。Facebook は文面を渡せないので hashtag に #ちくわげーむず */
        links(s) {
            const e = encodeURIComponent, u = urlOf(s);
            return {
                x: 'https://x.com/intent/tweet?text=' + e(s.msg) + '&url=' + e(u) + '&hashtags=' + e(tagList(s).join(',')),
                line: 'https://social-plugins.line.me/lineit/share?url=' + e(u) + '&text=' + e(s.msg + '\n' + tagList(s).map(t => '#' + t).join(' ')),
                facebook: 'https://www.facebook.com/sharer/sharer.php?u=' + e(u) + '&hashtag=' + e('#' + SITE_TAG)
            };
        },

        /** X の投稿画面を開く */
        x(s) {
            window.open(CG.share.links(s).x, '_blank', 'noopener');
        },

        /**
         * 共有する。端末の共有メニューが使えればそれ（file があれば画像付き）、だめなら X の投稿画面。
         * 結果は 'shared'（共有メニュー）・'cancel'（とじた）・'x'（X を開いた）
         */
        async open(s, file) {
            const text = CG.share.text(s);
            const withFile = file ? { text, files: [file] } : null;
            const plain = { title: s.title || CG.info.title || document.title, text: s.msg + '\n' + tagList(s).map(t => '#' + t).join(' '), url: urlOf(s) };
            const data = withFile && navigator.canShare && navigator.canShare(withFile) ? withFile : (navigator.share && !file ? plain : null);
            if (data) {
                try {
                    await navigator.share(data);
                    return 'shared';
                }
                catch (e) {
                    if (e && e.name === 'AbortError')
                        return 'cancel';
                }
            }
            CG.share.x(s);
            return 'x';
        },

        /** 文面をコピー */
        copy(s) {
            return CG.copy(CG.share.text(s));
        }
    };
})();
</script>
<script>
/**
 * ちくわゲームズ 共通部品 v1 — save.js（セーブデータのファイルとセーブコード）。core.js の後に読む。
 *
 * ゲームの自動保存（localStorage）はゲームごとに書く。ここは「端末をまたいで持ち運ぶ」ための部品。
 * 中身は どちらも同じ「包み」{ game, v, at, data } で、game がちがうデータは読み込めない。
 *
 *   const box = CG.save.wrap(state, 2);              // 包み（v はゲームのセーブ形式の版）
 *   CG.save.toFile(box, 'ちいさなお店_….json');       // ファイルに書き出す
 *   const box2 = await CG.save.fromFile(file);       // ファイルから読む（だめなら Error。message は日本語）
 *   const code = await CG.save.toCode(box);          // セーブコード（文字列）にする
 *   const box3 = await CG.save.fromCode(code);       // セーブコードを読む（だめなら Error）
 *
 * セーブコードの形：CK1.<本体>.<チェック値>
 *   CK1 … 本体は JSON を deflate で縮めて base64url にしたもの
 *   CK0 … 縮める仕組みが無いブラウザ用（JSON をそのまま base64url）
 *   チェック値はゲーム名を混ぜたハッシュ。書き換えたコード・別のゲームのコードははじく（共通ルール 7 章）
 * 読み込み側は、v がゲームの今の版より新しいときは「ゲームを最新にして」とエラーにすること（box.v を見る）。
 */
(function () {
    const CG = window.CG;
    const err = t => new Error(t);

    /** ハッシュ（FNV-1a。つくれ！おでん横丁の checksum と同じ式。塩はゲーム名） */
    function checksum(str, game) {
        let h = 0x811c9dc5;
        for (const ch of 'chikuwa-' + game + str) {
            h ^= ch.charCodeAt(0);
            h = Math.imul(h, 0x01000193) >>> 0;
        }
        return h.toString(36);
    }

    /** バイト列 ⇔ base64url */
    function b64e(bytes) {
        let s = '';
        for (let i = 0; i < bytes.length; i += 0x8000)
            s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function b64d(t) {
        const s = atob(t.replace(/-/g, '+').replace(/_/g, '/'));
        const b = new Uint8Array(s.length);
        for (let i = 0; i < s.length; i++)
            b[i] = s.charCodeAt(i);
        return b;
    }

    /** deflate（使えるブラウザだけ） */
    const canZip = typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
    async function pipe(bytes, stream) {
        const out = new Response(new Blob([bytes]).stream().pipeThrough(stream));
        return new Uint8Array(await out.arrayBuffer());
    }

    /** 包みが正しい形か（game が合っているか）。だめなら Error */
    function check(box) {
        if (!box || typeof box !== 'object' || typeof box.game !== 'string')
            throw err('セーブデータの形ではありません。');
        // 共通部品より前の ちいさなお店（v1.1.x）は中身を state に入れていた。読めるようにそろえる
        if (!box.data && box.state && typeof box.state === 'object')
            box.data = box.state;
        if (box.game !== CG.info.game)
            throw err('このゲームのセーブデータではありません。');
        if (typeof box.v !== 'number' || !box.data || typeof box.data !== 'object')
            throw err('セーブデータが壊れています。');
        return box;
    }

    CG.save = {
        checksum,

        /** 包む（at は保存した日時） */
        wrap(data, v) {
            return { game: CG.info.game, v, at: new Date().toISOString(), data };
        },

        /** ファイルに書き出す */
        toFile(box, name) {
            CG.download(name, JSON.stringify(box), 'application/json');
        },

        /** ファイルから読む */
        async fromFile(file) {
            if (!file)
                throw err('ファイルが選ばれていません。');
            const t = await CG.readText(file);
            let box;
            try {
                box = JSON.parse(t);
            }
            catch (e) {
                throw err('ファイルを読み取れませんでした（JSONではありません）。');
            }
            return check(box);
        },

        /** セーブコードにする */
        async toCode(box) {
            const raw = new TextEncoder().encode(JSON.stringify(box));
            let head = 'CK0', body = raw;
            if (canZip) {
                try {
                    body = await pipe(raw, new CompressionStream('deflate-raw'));
                    head = 'CK1';
                }
                catch (e) {
                    body = raw;
                }
            }
            const p = head + '.' + b64e(body);
            return p + '.' + checksum(p, CG.info.game);
        },

        /** セーブコードを読む（前後の空白・改行は無視） */
        async fromCode(code) {
            const t = String(code || '').replace(/\s+/g, '');
            const m = t.match(/^(CK[01])\.([A-Za-z0-9_-]+)\.([0-9a-z]+)$/);
            if (!m)
                throw err('セーブコードの形ではありません。全部コピーできているか確かめてください。');
            if (checksum(m[1] + '.' + m[2], CG.info.game) !== m[3])
                throw err('セーブコードが正しくありません（途中が欠けている・書き換えた・別のゲームのコード）。');
            let bytes;
            try {
                bytes = b64d(m[2]);
                if (m[1] === 'CK1') {
                    if (!canZip)
                        throw err('このブラウザではこのセーブコードを読めません。ブラウザを新しくしてください。');
                    bytes = await pipe(bytes, new DecompressionStream('deflate-raw'));
                }
                return check(JSON.parse(new TextDecoder().decode(bytes)));
            }
            catch (e) {
                throw e && /セーブ|ブラウザ/.test(e.message) ? e : err('セーブコードを読み取れませんでした。');
            }
        }
    };
})();
</script>
<script>
/**
 * ちくわゲームズ 共通部品 v1 — move.js（セーブの引っ越し）。core.js・save.js の後に読む。
 *
 * ゲームの保存（localStorage）は、ページのアドレス（ドメイン）ごとに別になる。
 * 古いアドレスから新しいアドレスへ・別の端末へ、そのゲームの保存をまるごと運ぶための画面を作る。
 * 中身は CG.save のセーブコード（CK1.〜）とファイル。包みの data は { move: 1, keys: { 保存キー: 文字列 } }。
 *
 *   CG.move.mount(document.getElementById('move'), {
 *       keys: ['stage-kobo-v1', 'stage-kobo-progress'],   // 運ぶ保存キー（デバッグログなどは入れない）
 *   });
 *
 * 読み込むときは、keys に書いたキーだけを書き込む（コードに別のキーが入っていても書かない）。
 * コードに無いキーは消さずにそのまま残す。書き込んだらページを読み直す。
 * 手順の説明はトップの /hikkoshi/（引っ越しの手順）。
 */
(function () {
    const CG = window.CG;
    const MOVE_VER = 1;

    /** 見た目（ゲームの配色に合わせやすいよう、色は文字色と --cg-accent だけ使う） */
    const CSS = '.cg-mv{margin:12px 0;text-align:left}' +
        '.cg-mv>summary{cursor:pointer;font-weight:700}' +
        '.cg-mv-b{margin-top:8px;font-size:14px;line-height:1.6}' +
        '.cg-mv-b p{margin:6px 0}' +
        '.cg-mv-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}' +
        '.cg-mv button{font:inherit;font-size:14px;padding:7px 12px;border-radius:10px;cursor:pointer;color:inherit;' +
        'background:transparent;border:1.5px solid var(--cg-accent,#C9772E)}' +
        '.cg-mv button.cg-mv-go{background:var(--cg-accent,#C9772E);color:#fff;border-color:transparent}' +
        '.cg-mv textarea{box-sizing:border-box;width:100%;min-height:64px;font:12px/1.4 ui-monospace,monospace;' +
        'padding:6px;border-radius:8px;border:1px solid rgba(128,128,128,.5);background:rgba(128,128,128,.08);color:inherit;word-break:break-all}' +
        '.cg-mv-msg{font-size:13px;margin:4px 0;min-height:1em}' +
        '.cg-mv-msg.ng{color:#d33}' +
        '.cg-mv-ask{padding:8px;border-radius:10px;border:1.5px dashed var(--cg-accent,#C9772E);margin:6px 0}' +
        '.cg-mv a{color:inherit}';

    function addCss() {
        if (document.getElementById('cg-mv-css'))
            return;
        const s = document.createElement('style');
        s.id = 'cg-mv-css';
        s.textContent = CSS;
        document.head.append(s);
    }

    /** いまの保存を集める（無いキーは入れない） */
    function collect(keys) {
        const out = {};
        for (const k of keys) {
            const v = CG.ls.get(k, null);
            if (v !== null)
                out[k] = v;
        }
        return out;
    }

    /** 包みを確かめる（だめなら Error）。形とゲーム名は CG.save が確かめ済み */
    function checkBox(box, keys) {
        const d = box.data;
        if (d.move !== 1 || !d.keys || typeof d.keys !== 'object')
            throw new Error('引っ越し用のコードではありません。「セーブの引っ越し」で作ったコードを入れてください。');
        if (box.v > MOVE_VER)
            throw new Error('新しい版で作られたコードです。ページを読み直して、ゲームを最新にしてください。');
        const ok = Object.keys(d.keys).filter(k => keys.includes(k) && typeof d.keys[k] === 'string');
        if (!ok.length)
            throw new Error('このコードにはセーブデータが入っていません。');
        return ok;
    }

    /** 日時を短く（2026/10/27 13:05） */
    function when(at) {
        const a = new Date(at);
        return isNaN(a) ? '' : a.getFullYear() + '/' + (a.getMonth() + 1) + '/' + a.getDate() + ' ' + a.getHours() + ':' + CG.p2(a.getMinutes());
    }

    CG.move = {
        collect,

        /** el の中に「セーブの引っ越し」の欄（開け閉めできる）を作る */
        mount(el, opt) {
            if (!el)
                return;
            addCss();
            const keys = (opt && opt.keys) || [];
            const game = CG.info.game, title = CG.info.title || game;
            const d = document.createElement('details');
            d.className = 'cg-mv';
            d.innerHTML =
                '<summary>💾 セーブの引っ越し（保存・読み込み）</summary>' +
                '<div class="cg-mv-b">' +
                '<p>新しいアドレスや別の端末で、続きから遊ぶための機能です。手順は <a href="../hikkoshi/">引っ越しの手順</a> を見てください。</p>' +
                '<p><b>① 前のアドレス・前の端末で</b>：コードを作って、コピーします。</p>' +
                '<div class="cg-mv-row"><button type="button" class="cg-mv-go" data-a="make">コードを作ってコピー</button>' +
                '<button type="button" data-a="file">ファイルに保存</button></div>' +
                '<textarea class="cg-mv-out" readonly hidden aria-label="セーブの引っ越しコード"></textarea>' +
                '<p><b>② 新しいアドレス・新しい端末で</b>：コードを貼って、読み込みます。</p>' +
                '<textarea class="cg-mv-in" placeholder="ここにコード（CK1.〜）を貼る" aria-label="引っ越しコードを貼る欄"></textarea>' +
                '<div class="cg-mv-row"><button type="button" class="cg-mv-go" data-a="read">コードを読み込む</button>' +
                '<button type="button" data-a="open">ファイルから読む</button></div>' +
                '<input type="file" accept=".json,application/json" hidden>' +
                '<div class="cg-mv-ask" hidden></div>' +
                '<div class="cg-mv-msg" role="status"></div>' +
                '</div>';
            el.append(d);

            const $ = s => d.querySelector(s);
            const out = $('.cg-mv-out'), inp = $('.cg-mv-in'), file = $('input[type=file]'), ask = $('.cg-mv-ask'), msg = $('.cg-mv-msg');
            const say = (t, ng) => {
                msg.textContent = t;
                msg.classList.toggle('ng', !!ng);
            };

            /** 運ぶ包みを作る（保存が無ければ null） */
            const pack = () => {
                const got = collect(keys);
                if (!Object.keys(got).length) {
                    say('このアドレスには、まだ ' + title + ' のセーブデータがありません。', true);
                    return null;
                }
                return Object.assign(CG.save.wrap({ move: 1, keys: got }, MOVE_VER), { from: location.host });
            };

            /** 読み込んだ包みを、確認してから書き込む */
            const offer = async (p) => {
                ask.hidden = true;
                let box, ok;
                try {
                    box = await p;
                    ok = checkBox(box, keys);
                }
                catch (e) {
                    say(e.message || '読み込めませんでした。', true);
                    return;
                }
                say('');
                ask.innerHTML = '<p>' + CG.esc(title) + ' のセーブデータ（' + CG.esc(when(box.at)) +
                    (box.from ? '・' + CG.esc(box.from) : '') + ' で作成）を読み込みます。<br>' +
                    '<b>このアドレスにある今のセーブデータは上書きされます。</b></p>' +
                    '<div class="cg-mv-row"><button type="button" class="cg-mv-go" data-a="yes">上書きして読み込む</button>' +
                    '<button type="button" data-a="no">やめる</button></div>';
                ask.hidden = false;
                ask.onclick = e => {
                    const a = e.target.dataset && e.target.dataset.a;
                    if (a === 'no') {
                        ask.hidden = true;
                        say('読み込みをやめました。');
                    }
                    if (a !== 'yes')
                        return;
                    const bad = ok.filter(k => !CG.ls.set(k, box.data.keys[k]));
                    ask.hidden = true;
                    if (bad.length) {
                        say('保存できませんでした（プライベートモードでは保存できません）。', true);
                        return;
                    }
                    say('読み込みました。ページを読み直します…');
                    CG.toast('セーブデータを読み込みました');
                    setTimeout(() => location.reload(), 900);
                };
            };

            d.addEventListener('click', async e => {
                const a = e.target.dataset && e.target.dataset.a;
                if (a === 'make') {
                    const box = pack();
                    if (!box)
                        return;
                    out.value = await CG.save.toCode(box);
                    out.hidden = false;
                    out.select();
                    const c = await CG.copy(out.value);
                    say(c ? 'コピーしました。新しいアドレスで「② コードを貼る」欄に貼ってください。' : 'コピーできませんでした。上の欄のコードを長押しして全部コピーしてください。', !c);
                }
                else if (a === 'file') {
                    const box = pack();
                    if (!box)
                        return;
                    const t = new Date();
                    CG.save.toFile(box, title + '_引っ越し_' + t.getFullYear() + CG.p2(t.getMonth() + 1) + CG.p2(t.getDate()) + '.json');
                    say('ファイルを保存しました。新しいアドレスで「ファイルから読む」を押して選んでください。');
                }
                else if (a === 'read') {
                    if (!inp.value.trim()) {
                        say('コードを貼ってから押してください。', true);
                        return;
                    }
                    offer(CG.save.fromCode(inp.value));
                }
                else if (a === 'open')
                    file.click();
            });
            file.addEventListener('change', () => {
                if (file.files[0])
                    offer(CG.save.fromFile(file.files[0]));
                file.value = '';
            });
            return d;
        }
    };
})();
</script>
<script>
/**
 * ちくわゲームズ 共通部品 v1 — debug.js（デバッグ報告）。core.js の後に読む。
 *
 * 遊んでいる人の端末で「操作・出来事・エラー」を直近 max 件だけ localStorage に残し、
 * 不具合が起きたらメモを付けて開発者に送る。サーバーは worker/index.js の /<フォルダ>/debug（D1 chikuwa-debug）。
 * 新しいゲームで使うときは worker/index.js の DEBUG_GAMES にフォルダ名を足す。
 *
 *   CG.debug.init({ snap: () => ({ d: state.day }) });  // snap：1件ごとに付ける「いまの状態」の要約（任意）
 *   CG.debug.add('open', { m: 100 });                    // 1件記録
 *   CG.debug.wrap('buy', { before: () => state.money, after: (m0) => ({ dm: state.money - m0 }) });
 *                                                        // window.buy を包んで、呼ばれたことを記録
 *   const r = await CG.debug.send(note, { state });      // 送信 → { ok:true, code } か { ok:false, t }
 *   CG.debug.mount(el);                                  // 送信欄（メモ・ボタン・受付番号）を el に作る（自前の見た目にしたいゲームは使わない）
 *
 * エラー（error・unhandledrejection）は init だけで自動的に記録される。
 * アーティファクト版からは送れない（公開サイトのみ）。そのときは「公開サイトから送って」と表示する。
 */
(function () {
    const CG = window.CG;
    let opt = { key: '', max: 300, url: 'debug', snap: null };
    let log = [];
    let started = false;

    function persist() {
        CG.ls.setJSON(opt.key, log);
    }

    const D = CG.debug = {
        /** 記録の一覧（古い順） */
        get log() {
            return log;
        },

        init(o) {
            opt = Object.assign(opt, o || {});
            if (!opt.key)
                opt.key = CG.info.game + '-debuglog';
            const v = CG.ls.getJSON(opt.key, []);
            log = Array.isArray(v) ? v : [];
            if (!started) {
                started = true;
                addEventListener('error', e => D.add('error', {
                    msg: String(e.message), src: (e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno,
                    st: e.error && e.error.stack ? String(e.error.stack).slice(0, 800) : undefined
                }));
                addEventListener('unhandledrejection', e => D.add('error', { msg: 'promise: ' + String(e.reason).slice(0, 300) }));
            }
            D.add('boot', { v: CG.info.version });
            return D;
        },

        /** 1件記録する（t：時刻、ev：何が起きたか、＋ snap の結果、＋ extra） */
        add(ev, extra) {
            let s = {};
            try {
                s = opt.snap ? opt.snap() || {} : {};
            }
            catch (e) { }
            log.push(Object.assign({ t: Date.now(), ev }, s, extra || {}));
            if (log.length > opt.max)
                log = log.slice(-opt.max);
            persist();
        },

        /**
         * グローバル関数 window[name] を包んで、呼ばれたことを記録する（ゲームの動きは変えない）。
         * before() の戻り値が after(前の値, 引数, 戻り値) に渡り、after の戻り値（オブジェクト）が記録に足される。
         */
        wrap(name, h) {
            const f = window[name];
            if (typeof f !== 'function')
                return;
            h = h || {};
            window[name] = function (...args) {
                let b;
                try {
                    b = h.before ? h.before() : undefined;
                }
                catch (e) { }
                const r = f.apply(this, args);
                let x = {};
                try {
                    x = h.after ? h.after(b, args, r) || {} : {};
                }
                catch (e) { }
                D.add(name, Object.assign({ a: args.length ? args : undefined }, x));
                return r;
            };
        },

        /** 記録を消す */
        clear() {
            log = [];
            persist();
        },

        /**
         * 送る。extra はゲームの状態など（state 全体を入れてよい。1件 300KB まで）。
         * 戻り値：{ ok:true, code:'受付番号' } か { ok:false, t:'理由' }
         */
        async send(note, extra) {
            const body = Object.assign({
                game: CG.info.game, version: CG.info.version, note: String(note || '').trim().slice(0, 500),
                at: new Date().toISOString(), screen: innerWidth + 'x' + innerHeight, ua: navigator.userAgent
            }, extra || {}, { log });
            try {
                const r = await fetch(opt.url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
                let j = null;
                try {
                    j = await r.json();
                }
                catch (e) { }
                if (r.ok && j && j.ok) {
                    D.add('sent', { code: j.code });
                    return { ok: true, code: j.code };
                }
                return { ok: false, t: (j && j.error) || '送信できませんでした（' + r.status + '）。公開サイトから送ってください。' };
            }
            catch (e) {
                return { ok: false, t: '送信できませんでした。通信状態を確かめるか、公開サイトから送ってください。' };
            }
        },

        /**
         * 送信欄を el の中に作る（共通の見た目。class は cg-dbg-*）。
         * o.title：見出し、o.extra()：送るときに足すデータ、o.placeholder：メモの例
         */
        mount(el, o) {
            o = o || {};
            let msg = null;
            const draw = () => {
                const note = el.querySelector('textarea') ? el.querySelector('textarea').value : '';
                el.innerHTML = '<div class="cg-dbg"><b>' + CG.esc(o.title || '🐞 不具合を報告する') + '</b>' +
                    '<textarea rows="2" maxlength="500" placeholder="' + CG.esc(o.placeholder || 'どんなことが起きた？（任意）') + '"></textarea>' +
                    '<button type="button"' + (msg && msg.busy ? ' disabled' : '') + '>' + (msg && msg.busy ? '送信中…' : '🐞 デバッグログを送る') + '</button>' +
                    '<div class="cg-dbg-meta">直近' + log.length + '件の操作と、いまのゲームの状態を開発者に送ります。</div>' +
                    (msg && msg.ok ? '<div class="cg-dbg-ok">✅ 送信しました。受付番号 <b>' + CG.esc(msg.code) + '</b>（開発者に伝えてください）</div>' : '') +
                    (msg && msg.t ? '<div class="cg-dbg-ng">⚠ ' + CG.esc(msg.t) + '</div>' : '') + '</div>';
                el.querySelector('textarea').value = msg && msg.ok ? '' : note;
                el.querySelector('button').onclick = async () => {
                    const n = el.querySelector('textarea').value;
                    msg = { busy: true };
                    draw();
                    msg = await D.send(n, o.extra ? o.extra() : {});
                    draw();
                };
            };
            draw();
        }
    };
})();
</script>

<script>
/**
 * util.js — 小さな共通関数。
 */

/** 要素の取得 */
const byId = id => document.getElementById(id);

/** 金額などを桁区切りで整形 */
const fmt = n => Math.round(n).toLocaleString();

/** 100円単位に丸める（最低100） */
const r100 = x => Math.max(100, Math.round(x / 100) * 100);

/** 日付から、通算の月（1〜） */
const monOf = d => Math.floor((Math.max(d, 1) - 1) / MD) + 1;

/** 日付から暦の月（1〜12）。1ヶ月目＝4月（START_MONTH） */
const calOf = d => (monOf(d) - 1 + START_MONTH - 1) % 12 + 1;

/** 日付から季節番号（0〜3：春夏秋冬）。実際の1年と同じく3ヶ月ずつ（春4〜6月・夏7〜9月・秋10〜12月・冬1〜3月） */
const seaOf = d => Math.floor((calOf(d) + 8) % 12 / 3);

/** 季節に応じた天気を抽選 */
function roll(d) {
    const w = WW[seaOf(d)];
    let r = Math.random() * 100;
    for (let i = 0; i < 4; i++) {
        if ((r -= w[i]) < 0)
            return i;
    }
    return 1;
}

/** 0〜100に収める */
const clamp100 = v => Math.max(0, Math.min(100, v));

/** ヘルプの？アイコン（k は data.js の HELP のキー） */
const helpIcon = k => '<button type="button" class="hp" data-a="help" data-k="' + k + '" aria-label="説明">?</button>';

/** ヘルプのフロート表示（同じアイコンをもう一度触ると閉じる） */
function showHelp(b) {
    let f = byId('hlp');
    if (!f) {
        f = document.createElement('div');
        f.id = 'hlp';
        f.setAttribute('role', 'tooltip');
        f.hidden = true;
        document.body.append(f);
    }
    const k = b.dataset.k;
    if (!f.hidden && f.dataset.k === k) {
        hideHelp();
        return;
    }
    f.dataset.k = k;
    f.textContent = HELP[k] || '';
    f.hidden = false;
    const r = b.getBoundingClientRect(), W = innerWidth, H = innerHeight, fw = f.offsetWidth, fh = f.offsetHeight;
    f.style.left = Math.max(8, Math.min(W - fw - 8, r.left + r.width / 2 - fw / 2)) + 'px';
    f.style.top = (r.bottom + 6 + fh > H - 8 ? Math.max(8, r.top - fh - 6) : r.bottom + 6) + 'px';
}

/** ヘルプを閉じる */
function hideHelp() {
    const f = byId('hlp');
    if (f)
        f.hidden = true;
}
</script>

 */

    { id: 'sora', name: 'そら', m: '#3a9fe0', c: '#ffa53a', dm: '#5cb4ef', dc: '#ffb95e', h: 205, s: 55 },
    { id: 'chikuwa', name: 'ちくわ色', m: '#c9772e', c: '#5aa65a', dm: '#e09a55', dc: '#72bd72', h: 34, s: 55 },
    { id: 'budou', name: 'ぶどう', m: '#8a6ad8', c: '#f0709e', dm: '#a58bea', dc: '#f58ab2', h: 262, s: 45 },

];

const PXT = { r: '#2fbf97', c: '#ff7a68' };

/** HSL を #rrggbb にする */
function hslHex(h, s, l) {
    s /= 100;
    l /= 100;
    const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)))).toString(16).padStart(2, '0');
    return '#' + f(0) + f(8) + f(4);
}

/** 2つの色をまぜる（t＝b の割合） */
function mixHex(a, b, t) {
    const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)), A = p(a), B = p(b);
    return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}

/** 暗い画面かどうか */
const themeDark = () => {
    const t = document.documentElement.dataset.theme;
    return t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme:dark)').matches);
};

/** イメージカラーを画面に当てる */
function themeApply(id) {
    const T = THEMES.find(t => t.id === id) || THEMES[0], st = document.documentElement.style;
    themeId = T.id;
    PXT.r = T.m;
    PXT.c = T.id === 'mono' ? '#4a525c' : T.c;
    const names = ['--bg', '--bg2', '--card', '--ink', '--sub', '--line', '--mint', '--mint2', '--mintl', '--mintg', '--coral', '--coral2', '--coral3', '--corall', '--tag', '--tagink', '--ok', '--bar', '--cg-accent'];
    names.forEach(n => st.removeProperty(n));
    if (T.id === 'mint')
        return;
    const dk = themeDark(), h = T.h, s = T.s, m = dk ? T.dm : T.m, c = dk ? T.dc : T.c;
    const v = dk ? {
        '--bg': hslHex(h, s * .5, 9), '--bg2': hslHex(h, s * .5, 11), '--card': hslHex(h, s * .45, 15), '--ink': hslHex(h, s * .6, 93),
        '--sub': hslHex(h, s * .35, 64), '--line': hslHex(h, s * .4, 22), '--bar': hslHex(h, s * .5, 8),
        '--mintl': mixHex(m, hslHex(h, s * .5, 9), .72), '--corall': mixHex(c, hslHex(h, s * .5, 9), .72), '--tagink': '#1c1010'
    } : {
        '--bg': hslHex(h, s, 95.5), '--bg2': hslHex(h, s, 91.5), '--card': '#ffffff', '--ink': hslHex(h, Math.min(s, 30), 18),
        '--sub': hslHex(h, s * .35, 48), '--line': hslHex(h, s * .7, 87), '--bar': hslHex(h, s * .7, 91.5),
        '--mintl': mixHex(m, '#ffffff', .82), '--corall': mixHex(c, '#ffffff', .84), '--tagink': '#ffffff'
    };
    Object.assign(v, {
        '--mint': m, '--mint2': mixHex(m, '#000000', .16), '--mintg': mixHex(m, '#ffffff', .4),
        '--coral': c, '--coral2': mixHex(c, '#000000', .1), '--coral3': mixHex(c, '#000000', .3),
        '--tag': c, '--ok': m, '--cg-accent': m
    });
    for (const n in v)
        st.setProperty(n, v[n]);
}

/** 設定タブの「イメージカラー」の欄を描く */
function themeRender() {
    const el = byId('thc');
    if (!el)
        return;
    el.innerHTML = '<b>🎨 イメージカラー</b><div class="meta">画面とお店の絵の色を変えます（この端末だけ。セーブデータは変わりません）。</div><div class="thl">'
        + THEMES.map(t => '<button type="button" class="ths' + (t.id === themeId ? ' on' : '') + '" data-a="theme" data-v="' + t.id + '" aria-pressed="' + (t.id === themeId) + '"><i style="background:linear-gradient(135deg,' + t.m + ' 0 50%,' + t.c + ' 50% 100%)"></i><span>' + t.name + '</span></button>').join('')
        + '</div>';
}

/** イメージカラーを選ぶ */
function themeSet(id) {
    themeApply(id);
    CG.ls.set(THEME_KEY, themeId);
    themeRender();
}

themeApply(CG.ls.get(THEME_KEY) || 'mint');
themeRender();
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', () => themeApply(themeId));
document.addEventListener('click', e => {
    const b = e.target.closest('[data-a="theme"]');
    if (b)
        themeSet(b.dataset.v);
});

/**

 * 形：{ t: 文, s: 販売の行なら true }。state が入れ替わったら（やり直し・読み込み）state.log から作り直す
 * LOGN（v1.5.1〜 200）：営業時間は最長 5:00〜23:00＝90ティック。販売の行（1ティック1行まで）とイベントの行を足しても、
 * 開店から閉店までが収まる数にする（50件だと 15:00 ごろから後しか読めなかった。デバッグ報告#10）
 */
const LOGN = 200;
let logHist = [], logOwner = null, logSeq = 0;
const logList = () => {
    if (logOwner !== state) {
        logOwner = state;
        logSeq++;
        logHist = (state.log || []).map(t => ({ t }));
    }
    return logHist;
};
const pushHist = (t, s) => {
    const L = logList();
    L.unshift({ t, s: !!s });
    logSeq++;
    if (L.length > LOGN)
        L.length = LOGN;
};

/** ログに1行追加（state.log は最新3件。noHist なら履歴には足さない＝販売の行は engine.js がまとめて足す） */
const addLog = (t, noHist) => {

        pushHist(t);
    state.log.unshift(t);

};

<script>
/**
 * rules.js — ゲームのルール計算（購買力・費用・ノルマなど。状態は変えない純粋な計算が中心）。
 */

/** 購買力＝季節×天気（×炎上） */
const pwr = d => SEA[seaOf(d)].p * WE[d === state.day ? state.weather : state.next].p * (state.flame > 0 ? difficulty().fl : 1);

/** 月のテナント料（棚数で指数的に増加） */
const tenantFee = (n = state.slots) => r100(4000 * Math.pow(1.6, n - 2) * state.feeMul * difficulty().fee);

/** 現在の売値（原価÷(1-粗利率)） */
const priceOf = p => Math.max(p.c + 1, Math.round(p.c / (1 - state.margin / 100)));

/** 粗利率が高いほど来店数が減る補正 */
const demandFactor = () => Math.min(1.6, Math.max(0.5, 1 - (state.margin - 40) * 0.015));

/** 融資の月々の返済額の合計 */
const loanPay = () => state.loans.reduce((a, l) => a + l.pay, 0);

/** 月末の支払い予想（v1.5.3〜）：月末の閉店処理（engine.js）と同じ式。テナント料＋決済手数料（今月の売上×3.75%×決済数）＋融資返済＋自分の月収＋店員の給料（ここまでの未払い分） */
const payForecast = () => tenantFee() + Math.round(state.mSales * 0.0375 * state.pays.length) + loanPay() + (state.sal || 0) + Math.round(state.mWage || 0);

/** 1日の営業ティック数 */
const dayTicks = () => (state.closeH - state.openH) * 5;

/** 店員の1日あたり給料（基準） */
const wageDay = () => {
    let w = 0;
    for (let h = state.openH; h < state.closeH; h++)
       w += WAGE * (h < 7 || h >= 22 ? 1.25 : 1);
    return w * state.clerk;
};

/** 今月のノルマの内訳（b：損益分岐点、g：前月比、q：ノルマ＝高い方） */
function quotaParts() {
    const b = (tenantFee() + loanPay() + state.sal + wageDay() * MD) / Math.max(0.05, state.margin / 100 - 0.0375 * state.pays.length);
    const g = state.prev == null ? 0 : state.prev * difficulty().gr;
    return { b: r100(b), g: r100(g), q: r100(state.prev == null ? b : Math.max(b, g)) };
}

/** 今月の売上ノルマ（損益分岐点＋前月比） */
function quota() {
    const b = (tenantFee() + loanPay() + state.sal + wageDay() * MD) / Math.max(0.05, state.margin / 100 - 0.0375 * state.pays.length);
    return r100(state.prev == null ? b : Math.max(b, state.prev * difficulty().gr));
}

/** 投資の費用 */
const cost = {
    slot: () => r100(1500 * Math.pow(1.7, state.slots - 2)),
    cap: () => r100(600 * Math.pow(1.6, Math.max(0, CAPS.indexOf(state.cap)))),
    ad: () => r100(800 * Math.pow(1.5, state.ad)),
    clerk: () => r100(4000 * Math.pow(1.5, state.clerk)),
    skill: () => r100(5000 * Math.pow(2.5, state.sk || 0) * Math.max(1, state.clerk)),
    seclv: () => PRL[state.sl || 0] * 3,
    secbuy: () => PR[Math.max(0, (state.sl || 1) - 1)]
};

/** 投資の上限レベル */
const MAX = {

    cap: 5000,
    ad: 20,
    clerk: 12,
    skill: 10,
    seclv: 10,
    secbuy: 5 
};

/** 休業日の幸福度の回復量 */
const rec = h => h >= 80 ? 20 : h >= 50 ? 18 : h >= 35 ? 10 : h >= 15 ? 5 : h >= 5 ? 2 : 1;

/** 幸福度に応じた病気の確率 */
const sickP = h => h >= 80 ? 0 : h >= 50 ? 0.05 : h >= 35 ? 0.1 : h >= 15 ? 0.15 : h >= 5 ? 0.25 : 0.45;

/** 商品アップグレードの費用 */
const upCost = (id, L) => r100(PRODUCTS[id].b * 15 * Math.pow(1.8, L));

/** 客の性別による商品の買いやすさ */
const gf = (id, g) => (id === 6 || id === 9) ? (g ? 0.5 : 2.5) : (id === 5 || id === 7) ? (g ? 2.5 : 0.5) : 1;

/** アップグレードと原価変動を商品へ反映 */
function applyUp() {
    PRODUCTS.forEach((p, i) => {
        const L = state.up[i] || 0;
        p.c = Math.round(p.b * (1 + 0.4 * L) * (state.cm ? state.cm[i] : 1));
        p.n = L > 0 ? NM[i][L - 1] : p.n0;
    });
}

/** 投資のリセット（地震・爆発） */
function resetInv(n) {
    state.slots = n;
    state.cap = 10;
    state.ad = 0;
    state.clerk = 0;
    state.sk = 0;
    state.dn = 0;
    state.sl = 0;

    state.own = n > 1 ? [0, 1] : [0];
    state.shelf = n > 1 ? [{ id: 0, st: 0 }, { id: 1, st: 0 }] : [{ id: 0, st: 0 }];
    state.up = PRODUCTS.map(() => 0);
    applyUp();
}

/** 月平均売上 */
const avgSales = () => {
    const a = state.msl || [];
    return a.length ? a.reduce((p, q) => p + q, 0) / a.length : 0;
};

/** 大口融資の上限（月平均売上×10） */
const loanCap = () => Math.floor(avgSales() * 10);

/** 現在の難易度の設定を返す */
const difficulty = () => DF[state.diff] || DF.hard;

/** 長時間営業の幸福度低下に難易度補正をかける */
const hdl = d => d < 0 ? d * difficulty().hd : d;

/** 融資の利子率 */
const intr = m => (state.diff === 'inferno' ? 0.25 : 0.15) * (1 + Math.max(0, m - 12) / 48);

/** 難易度を時給へ反映 */
function applyDiff() {
    WAGE = Math.round(BASEW * difficulty().wage);
}

/** 店員の実効レベル */
const eff = () => Math.max(difficulty().neg ? -10 : 0, (state.sk || 0) - (state.dn || 0) + (state.mbDay && state.day === state.mbDay ? 1 : 0));

/** 店員の1回の補充量 */
const clAmt = () => {
    const e = eff();
    return e >= 10 ? 1e9 : e < 0 ? 0 : 5 * Math.pow(2, e);
};

/** 病気またはうつ病で休養中か */
function ill() {
    return state.sick > 0 || state.dep > 0;
}

/** いま投資できない理由（できるときは空文字）。投資タブの表示とデバッグログで使う */
function investBlock() {
    if (state.over)
        return '倒産しているため投資できません。';
    if (!state.diff)
        return '難易度を選ぶと投資できるようになります。';
    if (state.dep > 0)
        return '😔 うつ病の休養中のため投資できません（あと' + state.dep + '日）。' + (state.clerk > 0 ? '店員が営業を続けています。' : '');
    if (state.sick > 0)
        return '🤒 病気の休養中のため投資できません（あと' + state.sick + '日）。' + (state.clerk > 0 ? '店員が営業を続けています。' : '');
    if (state.phase === 'prep')
        return '開店準備中です。投資は閉店後にできます。';
    if (state.phase === 'open')
        return (state.kama ? '⛄ かまくらの日です。' : '営業中です。') + '投資は閉店後にできます。';
    if (state.phase !== 'closed')
        return '投資できない状態です（' + state.phase + '）。';
    return '';
}

<script>
/**
 * events.js — イベント（盗難・セキュリティ・最終段階の商品イベントなど）。
 */

/** イベントで商品を直接売る */
function sellUnit(s, q, m) {
    const a = Math.round(priceOf(PRODUCTS[s.id]) * m) * q;
    s.st -= q;
    state.sd[s.id] += q;
    state.money += a;
    state.mSales += a;
    state.tot = (state.tot || 0) + a;
    state.dRev += a;
    state.dSold += q;
    state.sold += q;
    return a;
}

/** 開店時のイベント（超セレブ・パパ活） */
function openEv() {
    const on = id => state.up[id] === 7 && state.shelf.some(s => s && s.id === id), sh = state.shelf.filter(Boolean);
    if (on(5) && Math.random() < 0.05) {
        let t = 0;
        sh.forEach(s => {
            if (s.st > 0)
                t += sellUnit(s, s.st, 1.15);
        });
        addEvent('💎 超セレブが来店！全商品を+15%の価格で買い占め（+¥' + fmt(t) + '）');
    }
    if (on(9) && Math.random() < 0.15) {
        const top = sh.filter(s => s.st > 0).sort((a, b) => PRODUCTS[b.id].c - PRODUCTS[a.id].c).slice(0, 3);
        let t = 0;
        for (let i = 0; i < 3; i++) {
            const c = top.filter(s => s.st > 0);
            if (!c.length)
                break;
            t += sellUnit(c[Math.floor(Math.random() * c.length)], 1, 1);
        }
        if (t)
            addEvent('💸 パパ活カップルが来店。高額商品を3つ購入（+¥' + fmt(t) + '）');
    }
}

/** 最終段階の商品によるイベント抽選 */
function rollProd() {
    const R = Math.random, on = id => state.up[id] === 7 && state.shelf.some(s => s && s.id === id);
    if (on(0) && R() < 0.02) {
        resetInv(1);
        addEvent('💣 熱ばくだんおにぎりが爆発！棚が1つだけ残り、投資がすべてリセットされました', 1);
    }
    if (on(1) && R() < 0.02) {
        state.happy = clamp100(state.happy - 25);
        addEvent('🀄 黒烏龍茶がツモでアガった…！（幸福度-25%）');
    }
    if ((on(2) && R() < 0.18) || (on(4) && R() < 0.15)) {
        state.fem = 3;
        addEvent('🍌 皮が剥けた！女性客が5倍に（3日間）');
    }
    if (on(6) && R() < 0.05) {
        const f = 0.75 + R() * 1.2;
        state.cm[6] = Math.min(5, Math.max(0.5, state.cm[6] * f));
        applyUp();
        addEvent('📈 アップレの原価が' + (f >= 1 ? '+' : '') + Math.round((f - 1) * 100) + '%変動しました', f > 1);
    }
    if (on(7) && R() < 0.25) {
        state.rb = 3;
        addEvent('🍙 おにぎりブーム到来！おにぎりの購入客とまとめ買いが80%増（3日間）');
    }
    if (on(8) && R() < 0.05) {
        state.up[4] = 0;
        applyUp();
        addEvent('👩‍🏫 教育ママが来店。雑誌のアップグレードがリセットされました', 1);
    }
    if (on(10) && R() < 0.05) {
        state.flame = 14;
        state.boost = 0;
        state.gauge = Math.min(state.gauge, 4);
        addEvent('📱 無断撮影（盗撮）トラブルがSNSで炎上。2ヶ月間、購買欲が5以上になりません', 1);
    }
    if (on(11) && R() < 0.05) {
        let n = 0;
        for (let i = 0; i < 6; i++) {
            if (lose())
                n++;
            state.money -= 10000;
            state.happy = clamp100(state.happy - 5);
        }
        addEvent('🛴💥 店前で大事故！6台の車が店に突っ込み、棚' + n + '台を失い修繕費¥60,000', 1);
    }
}

/** セキュリティで盗難被害を軽減（1日1ストック消費） */
function guard(a) {
    const L = state.sl || 0;
    if (L < 1 || a <= 0)
        return a;
    if (!state.gu) {
        if ((state.ss || 0) < 1)
            return a;
        state.ss--;
        state.gu = true;
        if (L === 10) {
            state.clean = 7;
            state.gm = 1;

    if (state.phase === 'closed' || state.over || ill())
        return;
    const s = state.shelf[i];
    if (!s)
        return;
    const p = PRODUCTS[s.id];
    const q = Math.min(n, state.cap - s.st, Math.floor(state.money / p.c));
    if (q <= 0)
        return;

    state.money -= q * p.c;

}

            return;

        state.own.push(id);
        fill();
        addLog(p.e + ' ' + p.n + 'を扱い始めました。');
    }

        const c = cost[k]();
        const cur = {
            slot: state.slots, cap: state.cap, ad: state.ad, clerk: state.clerk, skill: state.sk || 0, seclv: state.sl || 0, secbuy: state.ss || 0
        }[k];

            return;
        state.money -= c;

            state.slotQ = (state.slotQ || 0) + 1;
            addSlot();
            addLog('棚が' + state.slots + '台に。テナント料は月¥' + fmt(tenantFee()) + 'になります。');
        }
        if (k === 'cap') {
            state.cap = CAPS[CAPS.indexOf(state.cap) + 1] || state.cap;

        }
        if (k === 'ad') {

        }
        if (k === 'seclv') {
            state.sl = (state.sl || 0) + 1;
            addLog('🛡 ' + SECN[state.sl - 1] + 'を導入できるようになりました。');
        }

    save();
}

/** 棚を1台増やす（上位商品を解放） */
function addSlot() {

    state.shelf.push(null);
    if (state.own.length < state.slots && state.own.length < PRODUCTS.length) {
        state.own.push(state.own.length);

        addLog(q.e + ' ' + q.n + 'が解放されました。');

    fill();

function fillAll() {
    if (state.phase !== 'prep' || state.over || ill())

    state.shelf.map((s, i) => i).filter(i => state.shelf[i]).sort((a, b) => PRODUCTS[state.shelf[a].id].c - PRODUCTS[state.shelf[b].id].c).forEach(i => {

    const a = state.ln.a, m = state.ln.m;

    const p = Math.round(a * (1 + intr(m)) / m);

    addLog('🏦 ¥' + fmt(a) + 'を借りました。月¥' + fmt(p) + '×' + m + 'ヶ月');

    state.phase = 'open';

    state.t = 0;
    state.dOpen = true;

}

            addEvent('💪 病気から復帰しました（幸福度' + Math.floor(state.happy) + '%）');
        }
    }
    else if (state.dep <= 0 && difficulty().sick && Math.random() < sickP(state.happy)) {
        state.sick = 7;
        addEvent('🤒 病気になりました。7日間' + (state.clerk > 0 ? 'は店員が営業します（給料150%）' : '休業します'));
    }
    if ((state.sick > 0 || state.dep > 0) && state.clerk === 0) {
        snow = true;
        state.hol = false;
    }
    if (snow) {
        state.kama = 0;
        endDay();
    }
    else if (state.kama) {
        state.hol = false;
        state.phase = 'open';
        state.t = 0;
        state.paused = false;
        lastSale = '';
        addLog('⛄ かまくらを作っています…（12:00から甘酒ボーナス）');
        if (state.openH >= 12)
            amaStart();
    }
    else if (state.hol) {
        state.hol = false;
        state.gauge = Math.min(99, state.gauge + 8);
        addLog('店休日。お客さんが開店を待ちわびています（購買欲+8）。');
        endDay();
    }
    else {
        state.phase = 'prep';
        addLog('開店準備。商品を補充しましょう。');
    }
    render();
    save();
}

/** 営業中の1秒ごとの処理（客の来店・販売） */
function tick() {
    if (state.phase !== 'open' || state.paused)
        return;
    if (state.kama) {
        kamaTick();
        return;
    }
    state.t++;
    const pw = pwr(state.day), sh = state.shelf.filter(Boolean);
    if (state.boost > 0) {
        state.boost--;
        state.gauge = 100;
        if (state.boost === 0) {
            state.gauge = 50;
            addLog('ブースト終了。');
        }
    }
    else
        state.gauge = Math.max(0, state.gauge + (pw - 1) * 4 - 0.6);
    const rate = (0.35 + 0.18 * state.ad + 0.08 * sh.length) * pw * (0.8 + state.gauge / 250) * (state.boost > 0 ? 2 : 1) * demandFactor() * Math.pow(1.2, state.pays.length) * difficulty().cust;
    const cnt = x => Math.floor(x) + (Math.random() < x % 1 ? 1 : 0), gs = [];
    for (let i = cnt(rate / 2); i > 0; i--)
        gs.push(0);
    for (let i = cnt(rate / 2 * (state.fem > 0 ? 5 : 1)); i > 0; i--)
        gs.push(1);
    let bc = 0, sy = 0;
    const sl = {};
    for (const g of gs) {
        if (g)
            state.dF = (state.dF || 0) + 1;
        else
            state.dM = (state.dM || 0) + 1;
        const wt = sh.map(t => Math.pow(80 / PRODUCTS[t.id].c, 0.6) * gf(t.id, g) * (state.rb > 0 && t.id === 0 ? 1.8 : 1));
        let x = Math.random() * wt.reduce((a, b) => a + b, 0), s = sh[sh.length - 1];
        for (let i = 0; i < sh.length; i++) {
            if ((x -= wt[i]) < 0) {
                s = sh[i];
                break;
            }
        }
        if (!s || s.st <= 0) {
            state.miss++;
            state.dMiss++;
            if (state.boost === 0)
                state.gauge = Math.max(0, state.gauge - 3);
            continue;
        }
        const p = PRODUCTS[s.id], pp = priceOf(p), q = Math.min(s.st, Math.round((1 + (Math.random() < 0.25 + 0.05 * state.ad ? 1 : 0) + (state.boom > 0 && Math.random() < 0.5 ? 1 : 0)) * (state.rb > 0 && s.id === 0 ? 1.8 : 1)));
        s.st -= q;
        state.sd[s.id] += q;
        bc++;
        state.money += q * pp;
        state.mSales += q * pp;
        state.tot = (state.tot || 0) + q * pp;
        state.dRev += q * pp;
        state.dSold += q;
        state.sold += q;
        sl[s.id] = (sl[s.id] || 0) + q;
        sy += q * pp;
        if (state.boost === 0)
            state.gauge = Math.min(100, state.gauge + 2);
        if (q * pp >= 1000)
            addLog(p.e + ' ' + p.n + 'が売れました +¥' + fmt(q * pp), true);
    }
    if (bc)
        lastSale = Object.keys(sl).map(i => PRODUCTS[i].e + PRODUCTS[i].n + '×' + sl[i]).join('・') + ' +¥' + fmt(sy);
    if (bc)
        pushHist('🛒 ' + (state.openH + Math.floor(state.t / 5)) + ':' + String((state.t % 5) * 12).padStart(2, '0') + ' ' + lastSale, true);
    pxArrive(gs, bc);
    if (state.flame > 0)
        state.gauge = Math.min(state.gauge, 4);
    if (state.boost === 0 && state.gauge >= 100) {
        state.boost = 10;
        addLog('🔥 購買欲MAX！10秒間、来店数2倍');
    }
    for (let k = 0; k < state.clerk; k++) {
        const c = state.shelf.filter(s => s && s.st < state.cap && state.money >= PRODUCTS[s.id].c);
        if (!c.length)
            break;
        const b = c[Math.floor(Math.random() * c.length)], q = Math.min(clAmt(), state.cap - b.st, Math.floor(state.money / PRODUCTS[b.id].c));
        b.st += q;
        state.money -= q * PRODUCTS[b.id].c;
    }
    if (state.clerk > 0 && eff() < 0)
        for (let k = 0; k < state.clerk; k++) {
            const c = state.shelf.filter(s => s && s.st > 0);
            if (!c.length)
                break;
            const b = c[Math.floor(Math.random() * c.length)];
            b.st = Math.max(0, b.st - Math.ceil(b.st * 0.01 * -eff()));
        }
    if (state.clerk > 0) {
        const h = state.openH + Math.floor((state.t - 1) / 5), w = WAGE * (h < 7 || h >= 22 ? 1.25 : 1) * state.clerk / 5 * (state.sick > 0 || state.dep > 0 ? 1.5 : 1);
        state.mWage = (state.mWage || 0) + w;
        state.dWage += w;
    }
    if (state.t >= dayTicks()) {
        addLog('閉店。本日の売上 ¥' + fmt(state.dRev) + (state.dWage ? ' / 給料 ¥' + fmt(state.dWage) : ''));
        endDay();
    }
    render();
    save();
}

<script>
/**
 * pixel.js — ドット絵の描画。
 * v1.4.3〜：キャンバスは 384×184（従来の 192×92 の縦横2倍）。
 * 座標は従来どおり「論理座標（192×92）」で書き、`Rc` が2倍にして塗る（0.5刻みの位置も使える）。
 * 人物・商品など細かく描きたいものだけ、実ピクセル（384×184）で塗る `Rp` を使う。
 * v2.0.0〜：キャンバスの実体は 768×368（さらに2倍）。全体を2倍に拡大して描くので、Rc・Rp はそのまま使える。
 * 人物の顔・建物の模様など、もっと細かく描くものは「細ピクセル」（768×368。論理座標の4倍）で塗る `Rq` を使う。
 */

/** ドット絵のキャンバス */
const cv = byId('px');

/** 描画コンテキスト */
const cx = cv.getContext('2d');
cx.setTransform(2, 0, 0, 2, 0, 0);

/** アニメーションのフレーム数 */
let fr = 0;

/** キャンバスの実ピクセルの大きさ（論理座標の2倍） */
const PXW = 384, PXH = 184;

/** 四角形を塗る（実ピクセル座標） */
const Rp = (x, y, w, h, c) => {
    if (pxOnlyPp && !pxInPp)
        return;
    x = Math.round(x);
    y = Math.round(y);
    cx.fillStyle = c;
    cx.fillRect(x, y, w, h);
    if (pxDk) {
        cx.fillStyle = 'rgba(8,16,48,0.5)';
        cx.fillRect(x, y, w, h);
    }
};

/** 四角形を塗る（細ピクセル座標。768×368。v2.0.0〜） */
const Rq = (x, y, w, h, c) => {
    if (pxOnlyPp && !pxInPp)
        return;
    x = Math.round(x) / 2;
    y = Math.round(y) / 2;
    cx.fillStyle = c;
    cx.fillRect(x, y, w / 2, h / 2);
    if (pxDk) {
        cx.fillStyle = 'rgba(8,16,48,0.5)';
        cx.fillRect(x, y, w / 2, h / 2);
    }
};

/** 四角形を塗る（論理座標。実ピクセルでは2倍） */
const Rc = (x, y, w, h, c) => Rp(x * 2, y * 2, w * 2, h * 2, c);

/** 色を明るく（k>0）・暗く（k<0）する */
function shade(c, k) {
    const n = parseInt(c.slice(1), 16), t = k < 0 ? 0 : 255, a = Math.abs(k);
    const f = v => Math.round(v + (t - v) * a);
    return '#' + [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => f(v).toString(16).padStart(2, '0')).join('');
}

/** 夜に人物を描き直すとき、夜の暗さを重ねる */
let pxDk = false;

/** 夜の描き直しで「人物だけ」を描くとき真（pp の中だけ塗る。窓の描き直しで隠れたイベントの人物を手前に出す。v1.5.1〜） */
let pxOnlyPp = false, pxInPp = false;

/** 来店中のお客さん */
const PXC = [];

/** ドット文字を描く（1ドット＝論理1px） */
function pxText(x, y, t, c) {
    [...t].forEach((ch, i) => PXF[ch].forEach((r, j) => [...r].forEach((v, k) => {
        if (v === '1')
            Rc(x + i * 4 + k, y + j, 1, 1, c);
    })));
}

/** 小さなドット文字（3×5・実ピクセル）。OPEN／CLOSE の札に使う */
const PXG = {
    O: ['111', '101', '101', '101', '111'], P: ['111', '101', '111', '100', '100'], E: ['111', '100', '110', '100', '111'], N: ['111', '101', '101', '101', '101'],
    C: ['111', '100', '100', '100', '111'], L: ['100', '100', '100', '100', '111'], S: ['111', '100', '111', '001', '111']
};

/** 小さなドット文字を描く（実ピクセル座標。文字間1px） */
function pxTextP(x, y, t, c) {
    [...t].forEach((ch, i) => PXG[ch].forEach((r, j) => [...r].forEach((v, k) => {
        if (v === '1')
            Rp(x + i * 4 + k, y + j, 1, 1, c);
    })));
}

/** お客さんを来店させる */
function pxArrive(gs, bc) {
    const o = gs.map((g, i) => i).sort(() => Math.random() - .5);
    gs.forEach((g, i) => {
        if (PXC.length >= 14)
            return;
        const L = Math.random() < .5;
        PXC.push({
            x: L ? -6 : 198, L, g, bag: o.indexOf(i) < bc, st: 0, t: 0, sp: 0.8 + Math.random() * 0.7, c: Math.floor(Math.random() * 4)

}

/**
 * 人物を描く（v2.0.0〜 細ピクセルで 20×約38。顔を少し大きくして表情を増やした）。x・y は論理座標（0.5刻みで動ける）
 * o.mood：'neutral'（ふつう・ときどきまばたき）・'happy'（にっこり・ほほ染め）・'joy'（大よろこび・キラキラ目）・'meh'（がっかり・汗）・
 *   'sad'（落ち込み・まゆと涙）・'wow'（おどろき）・'sleepy'（ねむい・Zz）・'angry'（おこり）・'smug'（にやり・ウインク）
 * o.g：女性（長い髪・スカート）／o.bag：買い物袋／o.dir：左へ進む／o.down：うつむく
 * o.walk：歩きのコマ（0・1。足が交互に出る）／o.apron：エプロン（店員）／o.shades：サングラス

function pp(x, y, b, o) {
    const inPp0 = pxInPp;

    const bt = o.g ? 40 : 36;
    // 足もとの影

    const l1 = o.walk === 1 ? 2 : 0, l2 = o.walk === 0 ? 2 : 0;
    const lc = o.g ? sk : '#33415c';
    R(o.g ? 6 : 5, ly, o.g ? 3 : 4, lh - l1, lc);
    R(o.g ? 11 : 11, ly, o.g ? 3 : 4, lh - l2, lc);
    if (!o.g) {
        R(5, ly, 1, lh - l1, '#283349');
        R(11, ly, 1, lh - l2, '#283349');
    }
    R((o.g ? 5 : 4) + (d > 0 ? 1 : -1), ly + lh - l1, 5, 2, '#26221f');
    R(11 + (d > 0 ? 0 : -1), ly + lh - l2, 5, 2, '#26221f');

    const b2 = shade(b, -.2);

        R(3, 24, 14, 6, shade(b, .1));
        R(2, 28, 16, 3, shade(b, .1));

        for (let i = 5; i < 16; i += 4)

    }

    R(8, 15, 4, 2, sk);
    R(9, 17, 2, 1, sk2);
    if (!o.g) {

        R(9, 26, 2, 1, '#e0c070');

    R(16, 16, 2, 9, b2);
    R(2, 25, 2, 2, sk);
    R(16, 25, 2, 2, sk);
    if (o.apron) {
        R(6, 19, 8, 9, '#fbfaf5');
        R(7, 16, 1, 3, '#fbfaf5');
        R(12, 16, 1, 3, '#fbfaf5');
        R(8, 22, 4, 2, '#e4e2d8');
        R(6, 27, 8, 1, '#d9d7cc');

    H(5, 14, 10, 1, sk);

    H(16, 7, 1, 3, sk);
    H(5, 14, 10, 1, sk2);

    H(5, -1, 10, 1, h);

                H(Rr2, 6, 2, 1, '#3a2418');

            }

            mo(10, 10, 1, 1, '#8a3a2a');

        default:
            if (!o.shades) {
                if (blink) {

                }
                else {

/** 赤い空を横切るカラス（3羽。羽ばたきは2コマ） */
function pxCrows(W) {
    for (let k = 0; k < 3; k++) {
        const x = W + 20 - ((fr * (1.1 + k * 0.3) + k * 70) % (W + 50)), y = 8 + k * 9 + (((fr >> 1) + k) % 6 < 3 ? 0 : 1), up = ((fr >> 1) + k) % 2;
        Rc(x, y, 4, 2, '#151015');
        Rc(x - 1, y, 1, 1, '#151015');
        Rc(x + 1, y + (up ? -2 : 2), 2, 2, '#151015');
        Rc(x + 4, y + 1, 2, 1, '#151015');
    }
}

/** 角を丸めた四角形（論理座標。r＝角を削る段数。ドットの味を残した丸み。v2.0.0〜） */
function Rr(x, y, w, h, c, r) {
    r = Math.min(r == null ? 1 : r, Math.floor(w / 2), Math.floor(h / 2));
    for (let i = 0; i < r; i++) {
        const k = r - i;
        Rc(x + k, y + i, w - k * 2, 1, c);
        Rc(x + k, y + h - 1 - i, w - k * 2, 1, c);
    }
    Rc(x, y + r, w, h - r * 2, c);
}

    // 壁の板（横の線）
    for (let y = 168; y < 224; y += 8)
        Rq(192, y, 384, 1, '#f3e2c8');

/** ドット絵の描画（1フレーム） */
function drawPx() {
    const W = 192, H = 92, se = seaOf(Math.max(state.day, 1)), wt = state.weather, op = state.phase === 'open';
    const hr = op ? state.openH + Math.floor(state.t / 5) : (state.phase === 'prep' ? state.openH : 21), night = hr >= 19 || hr < 6;
    const bad = badDay();
    pxScene(W, se, wt, night, bad);
    pxLights(op, night);
    pxSec();
    if (state.kama)
        pxKama();
    pxFxShop();
    const k = (op ? (state.spd || 1) : 1) * (badDay() ? 0.6 : 1);
    for (const c of PXC) {
        if (c.st === 0) {
            const dx = 93 - c.x;
            if (Math.abs(dx) <= c.sp * k + 1) {
                c.x = 93;
                c.st = 1;
                c.t = 8;
            }
            else
                c.x += Math.sign(dx) * c.sp * k;
        }
        else if (c.st === 1) {
            if ((c.t -= k) <= 0) {
                c.st = 2;
                c.L = Math.random() < .5;
            }
        }
        else {
            c.x += (c.L ? -1 : 1) * c.sp * k;
            if (c.x < -8 || c.x > 200)
                c.dead = 1;
        }
    }
    for (let i = PXC.length; i--;)
        if (PXC[i].dead)
            PXC.splice(i, 1);
    pxPeople(op);
    pxFxTop();
    cv.classList.toggle('quake', fxList().includes('quake'));
    if (wt === 2)
        for (let i = 0; i < 70; i++)
            Rp((i * 37 + fr * 2) % W * 2, (i * 23 + fr * 6) % H * 2, 1, 5, '#7ab8ea');
    if (wt === 3) {
        for (let i = 0; i < 70; i++)
            Rp((i * 29 + Math.sin((fr + i * 9) / 9) * 3 + W) % W * 2, (i * 17 + fr) % H * 2, i % 3 ? 1 : 2, i % 3 ? 1 : 2, '#fff');
        Rc(0, 62, W, 2, '#f4f8fb');
        // 屋根の雪（看板の部分はよける）
        Rc(46, 18, 29, 2, '#fff');
        Rc(117, 18, 29, 2, '#fff');
        Rr(76, 8, 40, 2, '#fff', 1);
    }
    if (night) {
        cx.fillStyle = 'rgba(18,20,70,0.48)';
        cx.fillRect(0, 0, PXW, PXH);
        if (wt === 0)
            for (let i = 0; i < 14; i++)
                Rp((i * 47) % W * 2, (i * 13) % 24 * 2, i % 3 ? 1 : 2, i % 3 ? 1 : 2, '#fff');
        Rc(30, 38, 18, 24, 'rgba(255,233,168,.2)');
        Rc(37, 37, 8, 2, '#ffe9a8');
        pxLights(op, true);
        // 夜は看板に明かりをともす（v2.0.0〜）
        cx.globalAlpha = .55;
        Rr(76, 9, 40, 12, PXT.c, 2);
        cx.globalAlpha = 1;
        pxText(88, 13, 'SHOP', '#fff6e0');
        pxDk = true;
        pxPeople(op);
        // 窓・ドアの描き直しで隠れた、イベントの人物（行列・泥棒など）を手前に描き直す。窓のステッカーも描き直す（v1.5.1）
        pxOnlyPp = true;
        pxFxTop();
        pxOnlyPp = false;
        pxDk = false;
        pxFxPay();

            Rp((i * 37 + fr * 3) % PXW, wy + 6 + (i * 7) % 40, 8, 1, 'rgba(255,255,255,.35)');
            Rp((i * 29 + fr) % PXW, wy + 4 + (i * 13) % 50 - (fr + i * 5) % 12, 2, 2, 'rgba(255,255,255,.5)');
        }
        for (let i = 0; i < 70; i++)
            Rp((i * 37 + fr * 2) % PXW, (i * 23 + fr * 7) % wy, 1, 5, '#7ab8ea');
    }
    // 休業中の清掃（セキュリティLv10が撃退した後）：モップがけ
    if ((state.clean > 0 || state.cleanDay) && !state.over) {
        const x = 70 + Math.sin(fr / 2) * 4;
        Rc(58, 60, 5, 4, '#2a9d8f');
        Rc(57, 59, 7, 1, '#cfeee9');
        pp(x, 57, '#4a90b8', { apron: true, mood: 'happy', walk: fr % 2 });
        Rc(x + 7, 50, 1, 10, '#8a6a45');
        Rc(x + 5, 60, 5, 2, '#cfd8e0');
        if (fr % 4 < 2)
            Rc(x + 11, 58, 1, 3, '#fff');
    }
}
