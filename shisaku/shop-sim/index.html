<script>
/**
 * share.js — 倒産時のポップアップとSNS共有（リザルト画像・Xへの投稿・文面のコピー）。
 * 共有の文面・共有メニュー・X の投稿画面・コピーは共通部品 common/v1/share.js（CG.share）。
 */

/** 共有する文面とハッシュタグ */
const SHARE_MSG = 'ちいさなお店を開いたけど倒産しちゃった！残念😢';
const SHARE_TAG = 'ちくわげーむず';

/** ゲームのURL（今開いているページ。#以降は除く） */
const shareUrl = () => location.href.split('#')[0];

/** CG.share に渡す中身（#ちくわげーむず は CG.share が付ける） */
const shareData = () => ({ msg: SHARE_MSG, url: shareUrl() });

/** コピー用・共有メニュー用の文面（URL込み） */
const shareText = () => CG.share.text(shareData());

/** 作成済みのリザルト画像（ゲームが変わったら作り直す） */
let shareFile = null, shareFor = null;

/** 画像用：幅に収まるように折り返す（最大 max 行） */
function wrapText(g, t, w, max) {
    const L = [];
    let s = '';
    for (const ch of t) {
        if (g.measureText(s + ch).width > w) {
            L.push(s);
            s = ch;
        }
        else
            s += ch;
    }
    if (s)
        L.push(s);
    if (L.length > max) {
        L.length = max;
        L[max - 1] = L[max - 1].slice(0, -1) + '…';
    }
    return L;
}

/** リザルト画像（1200×630）を作る */
function resultImage() {
    const W = 1200, H = 630, c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    const g = c.getContext('2d'), F = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif';
    // 背景と屋根
    g.fillStyle = '#0e1c19';
    g.fillRect(0, 0, W, H);
    for (let x = 0; x < W; x += 44) {
        g.fillStyle = '#e63946';
        g.fillRect(x, 0, 22, 32);
        g.fillStyle = '#ffffff';
        g.fillRect(x + 22, 0, 22, 32);
    }
    // タイトル
    g.textBaseline = 'alphabetic';
    g.fillStyle = '#8fb0a5';
    g.font = '700 34px ' + F;
    g.fillText('🏪 ちいさなお店', 48, 92);
    g.fillStyle = '#ff6b76';
    g.font = '900 60px ' + F;
    g.fillText('倒産しました…', 48, 164);
    // ドット絵（v2.0.0〜 実体は 768×368。576×276 へ縮めるので、ドットがつぶれないようになめらかに縮める）
    g.fillStyle = '#27473e';
    g.fillRect(42, 194, 588, 288);
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    g.drawImage(byId('px'), 48, 200, 576, 276);
    // 成績
    const d = Math.max(state.day, 1), m = Math.floor((d - 1) / MD) + 1;
    const yen = v => (v < 0 ? '-' : '') + '¥' + fmt(Math.abs(Math.round(v)));
    const rows = [
        ['難易度', difficulty().n],
        ['営業日数', m + 'ヶ月目・通算' + state.day + '日'],
        ['累計売上', yen(state.tot || 0)],
        ['最終所持金', yen(state.money)],
        ['預金', yen(state.sv || 0)],
        ['棚の数', state.slots + '台']
    ];
    rows.forEach(([k, v], i) => {
        const y = 230 + i * 46;
        g.fillStyle = '#8fb0a5';
        g.font = '700 24px ' + F;
        g.textAlign = 'left';
        g.fillText(k, 668, y);
        g.fillStyle = k === '最終所持金' && state.money < 0 ? '#ff6b76' : '#e4f3ec';
        g.font = '800 30px ' + F;
        g.textAlign = 'right';
        g.fillText(v, 1152, y);
        g.fillStyle = '#27473e';
        g.fillRect(668, y + 14, 484, 2);
    });
    // 倒産理由
    g.textAlign = 'left';
    g.fillStyle = '#e4f3ec';
    g.font = '700 26px ' + F;
    wrapText(g, state.overMsg || '資金が倒産ラインを下回り、倒産しました。', W - 96, 2).forEach((t, i) => g.fillText(t, 48, 530 + i * 36));
    // ハッシュタグ
    g.fillStyle = '#ffd23f';
    g.font = '800 24px ' + F;
    g.textAlign = 'right';
    g.fillText('#' + SHARE_TAG, W - 48, 606);
    return c;
}

/** 倒産時にリザルト画像を先に作っておく（共有ボタンを押した瞬間に渡せるように） */
function prepShare() {
    if (!state.over || shareFor === state)
        return;
    shareFor = state;
    shareFile = null;
    setTimeout(() => {
        const s = state;
        resultImage().toBlob(b => {
            if (b && s === state)
                shareFile = new File([b], 'chiisana-omise.png', { type: 'image/png' });
        }, 'image/png');
    }, 0);
}

/** 共有欄（ポップアップの中に出す） */
function shareBox() {
    const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    return '<div class="share"><b>📣 結果をシェア</b>' +
        '<div class="row"><button data-a="share">📤 結果をシェア</button><button class="alt" data-a="shimg">🖼 画像を保存</button></div>' +
        '<textarea id="shtx" readonly rows="4">' + esc(shareText()) + '</textarea>' +
        '<button class="alt" data-a="shcopy" style="width:100%">📋 文面をコピー</button></div>';
}

/** 表示中のポップアップがどのゲームのものか（作り直しの判定） */
let ovFor = null;

/** 倒産ポップアップの表示・非表示を状態に合わせる（render のたびに呼ぶ。中身は1回だけ作る） */
function syncOver() {
    let o = byId('ovm');
    const show = state.over && !state.ovx;
    if (!show) {
        if (o)
            o.hidden = true;
        return;
    }
    if (!o) {
        o = document.createElement('div');
        o.id = 'ovm';
        o.setAttribute('role', 'dialog');
        o.setAttribute('aria-modal', 'true');
        document.body.append(o);
    }
    if (ovFor !== state || o.hidden) {
        ovFor = state;
        prepShare();
        let img = '';
        try {
            img = '<img class="ovimg" alt="リザルト画像" src="' + resultImage().toDataURL('image/png') + '">';
        }
        catch (e) { }
        o.innerHTML = '<div class="ovbox"><div class="ovhd">💸 倒産しました…</div>' +
            '<div class="ovmsg">' + (state.overMsg || '資金が倒産ラインを下回り、倒産しました。') + '</div>' + img + shareBox() +
            '<button class="big" data-a="restart">🔄 最初からやり直す</button>' +
            '<button class="alt" data-a="ovclose" style="width:100%">閉じる（お店の様子を見る）</button></div>';
        o.hidden = false;
        o.scrollTop = 0;
    }
}

/** 共有：使えれば端末の共有メニュー（画像付き）、だめならXの投稿画面（画像は手で添付） */
function shareResult() {
    if (shareFile)
        CG.share.open(shareData(), shareFile);
    else
        CG.share.x(shareData());
}

/** リザルト画像を保存（ダウンロード） */
function saveResultImage() {
    resultImage().toBlob(b => {
        if (b)
            CG.download('chiisana-omise.png', b);
    }, 'image/png');
}

/** 文面をコピー */
function copyShareText(b) {
    CG.share.copy(shareData()).then(ok => {
        b.textContent = ok ? '✅ コピーしました' : '⚠ 文面を長押ししてコピーしてください';
        setTimeout(() => b.textContent = '📋 文面をコピー', 2000);
    });
}
</script>
<script>
/**
 * save.js — セーブデータのファイル書き出し・読み込みと、セーブコード（「設定」タブ）。
 * 自動保存（localStorage）は state.js の save()。こちらは端末をまたぐバックアップ用。
 * ファイル・コードの作り方と読み方は共通部品 common/v1/save.js（CG.save）。ここはゲームに合わせた確認と画面だけ。
 * 包みの形：{ game:'shop-sim', v:SAVE_VER, at, data:state, key }（v1.1.x までのファイルは data の代わりに state。CG.save が読める形にそろえる）
 */

/** ファイルの目印と版番号（state の形を変えたら SAVE_VER を上げ、loadFix に移行処理を書く） */
const SAVE_GAME = 'shop-sim', SAVE_VER = 2;

/** 読み込み待ちのデータ（確認してから反映）、欄に出すメッセージ、作ったセーブコード、コード入力欄を開いているか */
let svPend = null, svMsg = null, svSig = '', svCode = '', svIn = false;

/** セーブ・ロードできるか（営業中は不可。倒産後は可） */
const canSL = () => state.over || state.phase !== 'open';

/** 2桁ゼロ埋め */
const p2 = CG.p2;

/** データの概要（難易度・時期・所持金） */
function saveSummary(s, at) {
    const d = Math.max(s.day || 0, 1), m = Math.floor((d - 1) / MD) + 1, df = DF[s.diff];
    const yen = v => (v < 0 ? '-' : '') + '¥' + fmt(Math.abs(Math.round(v || 0)));
    let t = (df ? df.n : '?') + ' / ' + (s.day ? m + 'ヶ月目・通算' + s.day + '日' : '開業前') + ' / 所持金 ' + yen(s.money);
    if (s.over)
        t += '（倒産済み）';
    if (at) {
        const a = new Date(at);
        if (!isNaN(a))
            t += '<br>保存 ' + a.getFullYear() + '/' + (a.getMonth() + 1) + '/' + a.getDate() + ' ' + a.getHours() + ':' + p2(a.getMinutes());
    }
    return t;
}

/** ファイルに書き出す（.json をダウンロード） */
function exportSave() {
    if (!canSL())
        return;
    const now = new Date(), d = Math.max(state.day, 1), m = Math.floor((d - 1) / MD) + 1;
    const box = Object.assign(CG.save.wrap(state, SAVE_VER), { key: KEY });
    const name = 'ちいさなお店_' + difficulty().n + '_' + (state.day ? m + 'ヶ月目' : '開業前') + '_' +
        now.getFullYear() + p2(now.getMonth() + 1) + p2(now.getDate()) + '-' + p2(now.getHours()) + p2(now.getMinutes()) + '.json';
    CG.save.toFile(box, name);
    svPend = null;
    svMsg = { ok: true, t: '書き出しました：' + name };
    syncSave();
}

/** 読み込んだデータが正しいか確かめる（だめなら理由の文字列、OKなら null）。形とゲーム名は CG.save が確かめ済み */
function checkSave(o) {
    if (!o || typeof o !== 'object' || o.game !== SAVE_GAME)
        return 'このゲームのセーブデータではありません。';
    if (typeof o.v !== 'number' || o.v > SAVE_VER)
        return '新しい版のセーブデータです。ゲームを最新にしてから読み込んでください。';
    const s = o.data;
    if (!s || typeof s !== 'object' || !Array.isArray(s.shelf) || !Array.isArray(s.own) || typeof s.money !== 'number' || typeof s.day !== 'number' || !DF[s.diff])
        return 'セーブデータが壊れています。';
    return null;
}

/** 古い版のデータを今の形にそろえる（足りない項目は初期値で埋める） */
function loadFix(o) {
    const s = Object.assign(fresh(), o.data);
    ['up', 'sd'].forEach(k => {
        s[k] = PRODUCTS.map((_, i) => (s[k] && s[k][i]) || 0);
    });
    s.cm = PRODUCTS.map((_, i) => (s.cm && s.cm[i]) || 1);
    // o.v が古いときの移行処理はここに追加する（例：if (o.v < 2) { ... }）
    // v2：土嚢・かまくら（prep・kama・mbDay）を追加。初期値で埋まるので移行処理なし
    return s;
}

/** 読んだ包み（Promise）を確かめて、反映待ちにする */
async function pendFrom(p) {
    let o = null, err = null;
    try {
        o = await p;
        err = checkSave(o);
    }
    catch (e) {
        err = e.message;
    }
    svPend = err ? null : o;
    svMsg = err ? { ok: false, t: err } : null;
    syncSave();
}

/** ファイルを選んだら中身を確認して、反映待ちにする */
function importFile(f) {
    if (f)
        pendFrom(CG.save.fromFile(f));
}

/** セーブコードを作ってコピーする（コピーできなくても、欄に出すので手でコピーできる） */
async function makeCode() {
    if (!canSL())
        return;
    try {
        svCode = await CG.save.toCode(Object.assign(CG.save.wrap(state, SAVE_VER), { key: KEY }));
    }
    catch (e) {
        svCode = '';
        svMsg = { ok: false, t: 'セーブコードを作れませんでした。' };
        syncSave();
        return;
    }
    svPend = null;
    svIn = false;
    const ok = await CG.copy(svCode);
    svMsg = ok ? { ok: true, t: 'セーブコードをコピーしました（' + fmt(svCode.length) + '文字）。メモ帳などに貼って保管してください。' } : { ok: false, t: 'コピーできませんでした。下の欄を長押しして全部コピーしてください。' };
    syncSave();
}

/** 貼り付けたセーブコードを確かめて、反映待ちにする */
function readCode() {
    const t = byId('svci');
    const v = t ? t.value.trim() : '';
    if (!v) {
        svMsg = { ok: false, t: 'セーブコードを貼り付けてください。' };
        syncSave();
        return;
    }
    pendFrom(CG.save.fromCode(v));
}

/** 反映待ちのデータで再開する */
function applyLoad() {
    if (!svPend || !canSL())
        return;
    state = loadFix(svPend);
    svPend = null;
    svCode = '';
    svIn = false;
    if (!LA.includes(state.ln.a))
        state.ln.a = LA[0];
    state.paused = false;
    state.tab = 0;
    applyDiff();
    applyUp();
    dragMg = false;
    ovFor = null;
    addLog('💾 セーブデータを読み込みました。');
    svMsg = { ok: true, t: '読み込みました。' };
    render();
    save();
    byId('scr').scrollTop = 0;
}

/** 「設定」タブのセーブ欄（内容が変わったときだけ作り直す） */
function syncSave() {
    const el = byId('svd');
    if (!el)
        return;
    const ok = canSL(), sig = [ok, svPend && svPend.at, svMsg && svMsg.t, svCode, svIn].join('|');
    if (sig === svSig)
        return;
    svSig = sig;
    const old = byId('svci'), typed = old ? old.value : '';
    const dis = ok ? '' : ' disabled';
    let h = '<b>💾 セーブデータ</b>' + helpIcon('save');
    if (!ok)
        h += '<div class="meta svwarn">営業中はセーブ・ロードできません。閉店後に操作してください。</div>';
    h += '<div class="row"><button data-a="fsave"' + dis + '>📤 ファイルに書き出す</button><button class="alt" data-a="fload"' + dis + '>📥 ファイルから読み込む</button></div>';
    h += '<div class="svsub">🔑 セーブコード' + helpIcon('code') + '</div>' +
        '<div class="row"><button data-a="ccopy"' + dis + '>📋 コードをコピー</button><button class="alt" data-a="cin"' + dis + '>⌨ コードで読み込む</button></div>';
    if (svCode)
        h += '<textarea class="svcode" readonly rows="3" onfocus="this.select()">' + CG.esc(svCode) + '</textarea>';
    if (svIn)
        h += '<textarea class="svcode" id="svci" rows="3" placeholder="ここにセーブコード（CK1.〜）を貼り付け"></textarea>' +
            '<div class="row"><button data-a="cread"' + dis + '>このコードを読み込む</button><button class="alt" data-a="cno">やめる</button></div>';
    if (svPend)
        h += '<div class="svpend"><b>このデータで再開しますか？</b><div class="meta">' + saveSummary(svPend.data, svPend.at) + '</div><div class="meta svwarn">今のデータは上書きされます。必要なら先に書き出してください。</div>' +
            '<div class="row"><button data-a="fok"' + (ok ? '' : ' disabled') + '>このデータで再開</button><button class="alt" data-a="fno">やめる</button></div></div>';
    if (svMsg)
        h += '<div class="meta ' + (svMsg.ok ? 'svok' : 'svwarn') + '">' + (svMsg.ok ? '✅ ' : '⚠ ') + svMsg.t + '</div>';
    el.innerHTML = h;
    const ni = byId('svci');
    if (ni)
        ni.value = typed;
}
</script>
<script>
/**
 * amazake.js — かまくらボーナスの日（大雪＋かまくら成功）と甘酒ミニゲーム。
 * state.kama：1＝かまくら作り中（通常の販売なし）、2＝ミニゲーム中。終了後に閉店する。
 */

/** ミニゲームの長さ（実時間・ミリ秒） */
const AMA_MS = 10000;

/** ミニゲームの進行（保存しない。途中で再読み込みしたら最初から） */
let ama = null;

/** 終了時の一言（連打数の下限と文言） */
const AMA_MSG = [[1000, '伝説の甘酒屋'], [600, '指が見えない…'], [300, '町じゅうが甘酒まみれ'], [120, '指がつりそう！'], [70, '行列ができた！'], [30, '大にぎわい'], [1, 'ちらほら'], [0, 'だれも来なかった…']];

/** 甘酒1杯の売上：解放済みで一番安い商品の販売価格 × 難易度倍率 */
const amaPer = () => Math.round(Math.min(...state.own.map(i => priceOf(PRODUCTS[i]))) * (difficulty().ama || 1));

/** かまくらの日の1秒（12:00 か閉店時刻でミニゲームを始める） */
function kamaTick() {
    if (state.kama !== 1)
        return;
    state.t++;
    if (state.openH + Math.floor(state.t / 5) >= 12 || state.t >= dayTicks())
        amaStart();
    render();
    save();
}

/** ミニゲームを始める（時間を止めてポップアップ） */
function amaStart() {
    state.kama = 2;
    state.paused = true;
    addLog('🍵 12:00 甘酒ボーナス開始！');
    ama = null;
    syncAma();
    save();
}

/** ポップアップの表示（render から呼ぶ。再読み込み後も開き直す） */
function syncAma() {
    let o = byId('ama');
    if (state.kama === 3 && !ama) {
        // 結果を見る前に再読み込みした（報酬は加算済み）→ そのまま閉店
        state.kama = 0;
        state.paused = false;
        setTimeout(() => {
            endDay();
            render();
            save();
        });
    }
    if ((state.kama !== 2 && state.kama !== 3) || state.over) {
        if (o)
            o.hidden = true;
        return;
    }
    if (o && !o.hidden && ama)
        return;
    if (!o) {
        o = document.createElement('div');
        o.id = 'ama';
        o.setAttribute('role', 'dialog');
        o.setAttribute('aria-modal', 'true');
        document.body.append(o);
        o.addEventListener('pointerdown', e => {
            if (e.target.closest('#amab')) {
                e.preventDefault();
                amaTap();
            }
        });
    }
    ama = { n: 0, t0: 0, done: false, q: [], fx: [], f: 0, per: amaPer() };
    for (let i = 0; i < 4; i++)
        ama.q.push(amaGuest(60 + i * 12));
    o.innerHTML = '<div class="ovbox amabox"><div class="amatop"><div class="amahd"><span>🍵 甘酒ボーナス</span><span id="amat">10.0秒</span></div>' +
        '<canvas id="amacv" width="96" height="60"></canvas><div class="amanum"><span id="aman">0</span>杯 <small id="amay">押すとスタート</small></div></div>' +
        '<div class="amabot" id="amabot"><button class="amabtn" id="amab" type="button">🍵 甘酒</button></div></div>';
    o.hidden = false;
    clearInterval(ama.iv);
    ama.iv = setInterval(amaFrame, 60);
    amaFrame();
}

/** 並ぶお客さん（服と髪の色はドット絵と同じ表から） */
function amaGuest(x) {
    const g = Math.random() < .5, c = Math.floor(Math.random() * 4);
    return { x, g, b: (g ? FP : MP)[c], h: (g ? FH : MH)[c] };
}

/** 連打1回 */
function amaTap() {
    if (!ama || ama.done)
        return;
    if (!ama.t0)
        ama.t0 = performance.now();
    ama.n++;
    const c = ama.q.shift();
    if (c)
        ama.fx.push({ x: c.x, g: c, t: 0 });
    ama.q.push(amaGuest(Math.max(96, (ama.q.length ? ama.q[ama.q.length - 1].x : 56) + 12)));
    byId('aman').textContent = ama.n;
    byId('amay').textContent = '+¥' + fmt(ama.n * ama.per);
}

/** 1コマ進める（残り時間・アニメ） */
function amaFrame() {
    if (!ama || !byId('amacv'))
        return;
    ama.f++;
    if (ama.t0 && !ama.done) {
        const left = Math.max(0, AMA_MS - (performance.now() - ama.t0));
        byId('amat').textContent = (left / 1000).toFixed(1) + '秒';
        if (left <= 0)
            amaFinish();
    }
    amaDraw();
}

/** 終了：報酬を加算して結果を表示 */
function amaFinish() {
    ama.done = true;
    const y = ama.n * ama.per, m = AMA_MSG.find(([k]) => ama.n >= k)[1];
    state.money += y;
    state.mSales += y;
    state.tot = (state.tot || 0) + y;
    state.dRev += y;
    addEvent('🍵 甘酒を' + ama.n + '杯ふるまいました（' + m + '）+¥' + fmt(y));
    state.kama = 3;
    save();
    byId('amabot').innerHTML = '<div class="amares"><b>' + m + '</b><div class="meta">' + ama.n + '杯 × ¥' + fmt(ama.per) + ' ＝ +¥' + fmt(y) + '（今月の売上に加算）</div>' +
        '<button class="big" data-a="amaclose">閉店する</button></div>';
}

/** 結果を閉じて閉店 */
function amaClose() {
    if (!ama || !ama.done)
        return;
    clearInterval(ama.iv);
    ama = null;
    byId('ama').hidden = true;
    state.kama = 0;
    state.paused = false;
    addLog('閉店。本日の売上 ¥' + fmt(state.dRev) + '（甘酒）');
    endDay();
    render();
    save();
}

/** ミニゲームのドット絵（96×60：雪・かまくら・店主・行列） */
function amaDraw() {
    const c = byId('amacv').getContext('2d'), R = (x, y, w, h, k) => {
        c.fillStyle = k;
        c.fillRect(Math.round(x), Math.round(y), w, h);
    }, P = (x, y, b, h, cup) => {
        R(x + 1, y, 3, 3, '#f1c27d');
        R(x + 1, y, 3, 1, h);
        R(x, y + 3, 5, 4, b);
        R(x + 1, y + 7, 1, 2, '#2a2a2a');
        R(x + 3, y + 7, 1, 2, '#2a2a2a');
        if (cup) {
            R(x - 2, y + 4, 2, 2, '#fff8e7');
            R(x - 2, y + 3, 1, 1, 'rgba(255,255,255,.7)');
        }
    }, f = ama.f;
    ['#c8d3dc', '#d3dce4', '#dde5ec', '#e6ecf1'].forEach((k, i) => R(0, i * 10, 96, 10, k));
    R(0, 40, 96, 20, '#f4f8fb');
    R(0, 40, 96, 1, '#dfe7ee');
    // かまくら
    R(6, 22, 26, 18, '#ffffff');
    R(9, 18, 20, 4, '#ffffff');
    R(13, 15, 12, 3, '#ffffff');
    R(6, 39, 26, 1, '#cfd8e0');
    R(14, 28, 10, 12, '#3b4a5a');
    R(15, 30, 8, 10, '#ffb347');
    R(16, 36, 6, 4, '#c44d2d');
    // 鍋と店主
    R(36, 34, 8, 5, '#555');
    R(35, 33, 10, 1, '#777');
    R(37, 30 - (f % 6 < 3 ? 1 : 0), 1, 3, 'rgba(255,255,255,.8)');
    R(41, 29 - (f % 6 < 3 ? 0 : 1), 1, 3, 'rgba(255,255,255,.8)');
    P(46, 30, '#ffd23f', '#3b2a20', ama.n > 0 && f % 4 < 2);
    // 行列（先頭は x=56、後ろに12ずつ並ぶ）
    ama.q.forEach((g, i) => {
        g.x = Math.max(56 + i * 12, g.x - 2);
        P(g.x, 31 + ((f + Math.floor(g.x)) % 4 < 2 ? 0 : 1), g.b, g.h);
    });
    // 甘酒をもらって帰る人
    ama.fx.forEach(e => {
        e.t++;
        e.x -= 2.5;
        P(e.x, 31 - Math.min(6, e.t), e.g.b, e.g.h, true);
    });
    ama.fx = ama.fx.filter(e => e.x > -8);
    // 雪
    for (let i = 0; i < 24; i++)
        R((i * 29 + Math.sin((f + i * 9) / 9) * 3 + 96) % 96, (i * 17 + f) % 60, 1, 1, '#fff');
}

        return '<div class="shelf"><div class="top"><span class="emo">' + p.e + '</span><div><div class="nm">' + p.n + (state.up[s.id] ? ' <small>Lv' + state.up[s.id] + '</small>' : '') + '</div><span class="price">¥' + fmt(priceOf(p)) + '</span></div></div>' +

    const ok = state.phase === 'closed' && !state.over && !ill();
    const row = (k, id, t, dsc, price, done) => '<div class="card up"><div class="tx"><div class="nm">' + t + '</div><div class="d">' + dsc + '</div></div><button data-a="b" data-k="' + k + '" data-id="' + id + '"' + (done || !ok || state.money < price ? ' disabled' : '') + '>' + (done === 1 ? '未解放' : done ? '最大' : '¥' + fmt(price)) + '</button></div>';
    const R = [];
    R.push(row('slot', '', '🪜 棚を増やす（' + state.slots + '/' + MAX.slot + '）', '次の解放: ' + (state.own.length < PRODUCTS.length ? PRODUCTS[state.own.length].e + ' ' + PRODUCTS[state.own.length].n : 'なし') + (state.slots < MAX.slot ? '。テナント料 月¥' + fmt(tenantFee()) + ' → <b>月¥' + fmt(tenantFee(state.slots + 1)) + '</b>' : ''), cost.slot(), state.slots >= MAX.slot));
    R.push(row('cap', '', '📦 棚の容量アップ（' + state.cap + '個）', '次の容量: ' + (CAPS[CAPS.indexOf(state.cap) + 1] || '最大') + '個', cost.cap(), state.cap >= MAX.cap));
    R.push(row('ad', '', '📣 広告（Lv.' + state.ad + '）', '来店数とまとめ買いが増える', cost.ad(), state.ad >= MAX.ad));
    R.push(row('clerk', '', '🧑‍🍳 店員（' + state.clerk + '人）', '営業中、毎秒ランダムな棚へ自動補充（補充量は能力で上がる）。時給¥' + fmt(WAGE) + '（〜7時・22時〜は125%）・給料は月末払い', cost.clerk(), state.clerk >= MAX.clerk));
    PRODUCTS.forEach((p, id) => {
        if (false)
            R.push(row('new', id, p.e + ' ' + p.n + 'を扱う', '原価¥' + fmt(p.c) + ' → 売値¥' + fmt(priceOf(p)) + '（利益¥' + fmt(priceOf(p) - p.c) + '）', p.u, false));
    });
    const SECR = [];
    SECR.push(row('seclv', '', '🛡 セキュリティ Lv.' + (state.sl || 0) + '/10' + (state.sl ? ' ' + SECN[state.sl - 1] : ''), (state.sl >= 10 ? '最大レベル' : '次: ' + SECN[state.sl || 0] + '（' + SECX[state.sl || 0] + '）'), cost.seclv(), (state.sl || 0) >= 10));
    SECR.push(row('secbuy', '', '🛡 ストックを買う（' + (state.ss || 0) + '/5）', (state.sl > 0 ? SECN[state.sl - 1] + '：' + SECX[state.sl - 1] + '。破損まで' + ((state.ss || 0) > 0 ? Math.max(0, (state.sb || 0) - state.day) + '日' : (SECD[state.sl - 1] / 7) + 'ヶ月') + '（盗難1回ごとに1つ消費）' : 'まずレベルを上げてください'), cost.secbuy(), !(state.sl > 0) ? 1 : (state.ss || 0) >= 5));
    R.push(row('skill', '', '🧠 店員の能力（Lv.' + eff() + '/10）' + ((state.dn || 0) > 0 ? '<div class="meta">本来Lv.' + (state.sk || 0) + '・士気低下-' + state.dn + '（休業で回復）</div>' : ''), '1回の補充量: ' + (eff() >= 10 ? '満タン' : eff() < 0 ? '0（盗難中）' : 5 * Math.pow(2, eff()) + '個') + '。投資ごとに2倍、Lv10で満タン', cost.skill(), (state.sk || 0) >= 10));
    R.push(...SECR);
    PRODUCTS.forEach((p, i) => {
        if (!state.own.includes(i))
            return;
        const L = state.up[i];
        let d, pc = 0, dn = false;
        if (L >= 7) {
            d = '最大レベル';
            dn = true;
        }
        else if (state.sd[i] < TH[L]) {
            d = '解放まであと' + (TH[L] - state.sd[i]) + '個販売 → ' + NM[i][L];
            dn = 1;
        }
        else {
            pc = upCost(i, L);
            d = '→ ' + NM[i][L] + '（原価・売価アップ）';
        }
        R.push(row('upg', i, '⬆ ' + p.e + ' ' + p.n + ' Lv.' + L + '/7', d, pc, dn));
    });
    const ib = investBlock();
    byId('up').innerHTML = (ib ? '<div class="meta svwarn ivb">⚠ ' + ib + '</div>' : '') + R.join('');
}

/** 画面の組み替え（固定の上部・タブ・スクロール領域）。起動時に1回だけ呼ぶ */
/** タブバーを隠したかどうかの保存キー（端末ごと。ゲームのセーブには入れない。v2.0.0〜） */
const TBAR_KEY = 'shop-sim-tabbar';

/** タブバーを隠す（off=true）・出す。隠すときは取っ手だけ残して下へせり下げ、タブの中身を広げる */
function tabBar(off, init) {
    const tb = byId('tabs'), h = byId('tbh');
    if (!tb)
        return;
    tb.classList.toggle('off', off);
    if (init)
        tb.classList.add('noanim');
    // タブバーの高さ（＋PC の下の余白）だけ下へずらし、画面の外へ出す。取っ手はバーの上に付いているので残る
    const pad = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    tb.style.marginBottom = off ? -((tb.offsetHeight || 64) + pad) + 'px' : '';
    h.textContent = off ? '▲' : '▼';
    h.setAttribute('aria-label', off ? 'タブを出す' : 'タブを隠す');
    h.setAttribute('aria-expanded', String(!off));
    if (init)
        requestAnimationFrame(() => requestAnimationFrame(() => tb.classList.remove('noanim')));
}

<script>
/**
 * achv.js — 実績（v1.3.0〜）。
 *
 * 条件を満たすと解除される。所持金の行のバッジ「🏅 解除数/18」（#achb）をタップすると一覧のポップアップ（#achm）が開く（v1.4.0〜。
 * それまでは設定タブに置いていた）。解除の瞬間は画面下にお知らせ（CG.toast）。
 * 一覧の下の「実績をリセット」で、ページ内の確認画面を出してから ACH_KEY を消す（v1.4.0〜）。
 * 保存はゲームとは別の localStorage（ACH_KEY）なので、最初からやり直しても・倒産しても消えない。
 *   形：{ <実績のid>: { at: 解除した日時(ISO), diff: 難易度のキー } }
 * 判定（achCheck）は閉店のあと（endDay）と預金の操作のあと（svMove）。ほかの関数を包むだけで、ゲームの動きは変えない。
 * 1年＝12ヶ月＝84日（1ヶ月＝MD日）。
 * ui.js の後、debuglog.js の前に読み込むこと。
 */

const ACH_KEY = 'shop-sim-achv';

/** 1年の日数（12ヶ月） */
const YEAR = MD * 12;

/** 金額を「1億」「1000億」「1兆」の形にする */
const achYen = v => v >= 1e12 ? (v / 1e12) + '兆' : v >= 1e8 ? (v / 1e8) + '億' : (v / 1e4) + '万';

/** 期間（日数）を「6ヶ月」「10年」の形にする */
const achTerm = d => d % YEAR === 0 ? (d / YEAR) + '年' : (d / MD) + 'ヶ月';

/**
 * 実績の一覧。g：見出し、v()：いまの値、n：目標、ok()：追加の条件（なければ値が目標以上で解除）
 * id は保存に使うので、公開後は変えない
 */
const ACH_GROUPS = [
    { g: '💴 累計売上', e: '💴', v: () => state.tot || 0, ns: [1e8, 1e9, 1e10, 1e11, 1e12], id: n => 'tot' + n, name: n => '累計売上 ' + achYen(n), fmt: v => '¥' + fmt(v) },
    { g: '🏪 営業', e: '🏪', v: () => state.day || 0, ns: [10 * YEAR, 50 * YEAR, 100 * YEAR], id: n => 'day' + n, name: n => '営業 ' + achTerm(n), fmt: v => '通算' + fmt(v) + '日' },
    { g: '🏦 貯金', e: '🏦', v: () => state.sv || 0, ns: [1e7, 1e8, 1e9, 1e10, 1e11, 1e12], id: n => 'sv' + n, name: n => '貯金 ' + achYen(n), fmt: v => '預金 ¥' + fmt(v) },
    { g: '🔥 インフェルノ', e: '🔥', v: () => state.diff === 'inferno' && !state.over ? state.day || 0 : 0, ns: [6 * MD, YEAR, 5 * YEAR, 10 * YEAR], id: n => 'inf' + n, name: n => 'インフェルノで ' + achTerm(n), fmt: v => state.diff === 'inferno' ? '通算' + fmt(v) + '日' : 'インフェルノで遊ぶと進みます' }
];

/** すべての実績（並び順どおり） */
const ACHS = ACH_GROUPS.flatMap(G => G.ns.map(n => ({ id: G.id(n), G, n, name: G.name(n) })));

/** 解除済み */
let achGot = CG.ls.getJSON(ACH_KEY, {});
if (!achGot || typeof achGot !== 'object' || Array.isArray(achGot))
    achGot = {};

let achSig = '';

/** ポップアップを開いているか／リセットの確認画面を出しているか */
let achOpen = false, achAsk = false;

/** 条件を満たしたものを解除する（新しく解除したものの一覧を返す） */
function achCheck() {
    if (!state || !state.diff)
        return [];
    const nw = [];
    ACHS.forEach(a => {
        if (achGot[a.id] || a.G.v() < a.n)
            return;
        achGot[a.id] = { at: new Date().toISOString(), diff: state.diff };
        nw.push(a);
    });
    if (nw.length) {
        CG.ls.setJSON(ACH_KEY, achGot);
        CG.toast('🏅 実績解除：' + nw.map(a => a.name).join('・'), 3500);
        if (typeof dbgAdd === 'function')
            dbgAdd('achv', { got: nw.map(a => a.id) });
        syncAchBadge();
        syncAch(true);
    }
    return nw;
}

/** 所持金の行のバッジ（解除数） */
function syncAchBadge() {
    const b = byId('achb');
    if (!b)
        return;
    const t = '🏅 ' + ACHS.filter(a => achGot[a.id]).length + '/' + ACHS.length;
    if (b.textContent !== t)
        b.textContent = t;
}

/** 実績のポップアップ（開いているときだけ、内容が変わったら作り直す） */
function syncAch(force) {
    let el = byId('achm');
    if (!achOpen) {
        if (el)
            el.hidden = true;
        return;
    }
    if (!el) {
        el = document.createElement('div');
        el.id = 'achm';
        el.addEventListener('click', e => {
            if (e.target === el)
                achShow(false);
        });
        document.body.appendChild(el);
    }
    el.hidden = false;
    const got = ACHS.filter(a => achGot[a.id]).length;
    const sig = got + '|' + achAsk + '|' + state.day + '|' + Math.floor((state.tot || 0) / 1e6) + '|' + Math.floor((state.sv || 0) / 1e5);
    if (!force && sig === achSig && el.innerHTML)
        return;
    achSig = sig;
    const box = el.querySelector('.achbody'), st = box ? box.scrollTop : 0;
    let h = '<div class="ovbox achbox"><div class="achtop"><b>🏅 実績' + helpIcon('achv') + '</b><span class="achn">' + got + ' / ' + ACHS.length + '</span><button class="alt achx" data-a="achclose" aria-label="閉じる">✕</button></div><div class="achbody">';
    ACH_GROUPS.forEach(G => {
        const cur = G.v();
        h += '<div class="achg"><div class="achgh"><span>' + G.g + '</span><span class="meta">' + G.fmt(cur) + '</span></div><div class="achl">';
        G.ns.forEach(n => {
            const a = ACHS.find(x => x.id === G.id(n)), r = achGot[a.id];
            if (r) {
                const d = new Date(r.at), df = DF[r.diff];
                h += '<div class="ach on" title="' + (isNaN(d) ? '' : d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate()) + (df ? '・' + df.n : '') + '">' +
                    '<span class="achi">🏅</span><span class="acht">' + a.name + '</span><span class="achd">' + (isNaN(d) ? '' : (d.getMonth() + 1) + '/' + d.getDate()) + (df ? ' ' + df.n : '') + '</span></div>';
            }
            else {
                const pc = Math.max(0, Math.min(100, cur / n * 100));

<script>
/**
 * debuglog.js — バグ調査用のデバッグログ（記録と送信）。
 *
 * 記録・エラーの捕捉・送信は共通部品 common/v1/debug.js（CG.debug）。ここは「何を記録するか」と送信欄の見た目だけ。
 * 記録するもの（localStorage の DBG_KEY に直近 DBG_MAX 件。再読み込みしても残る）：
 *   - 操作（投資・融資・預金・開店・翌日・閉店・甘酒など）と、その前後のフェーズ・所持金
 *   - 投資ボタンが無視されたときの理由（investBlock）
 *   - イベントの文言（addEvent）
 *   - JavaScript のエラー（CG.debug が自動で記録）
 * 送信：「⚙設定」タブの「🐞 デバッグログを送る」。サーバー（worker/index.js の /shop-sim/debug）が
 *   D1（chikuwa-debug の debug_logs）に保存し、受付番号を返す。送る中身は state 全体＋上の記録。
 * ほかのファイルの関数を「包んで」記録するだけなので、ゲームの動きは変えない。
 * ui.js の後、main.js の前に読み込むこと。
 */

const DBG_KEY = 'shop-sim-debuglog';
const DBG_MAX = 300;

/** 送信欄の状態（null＝未送信、{busy}・{ok, code}・{ok:false, t}） */
let dbgMsg = null;
let dbgSig = '';

/** いまの状態の要約（1件の記録に付ける） */
const dbgSnap = () => typeof state !== 'undefined' && state ? {
    d: state.day, ph: state.phase, m: Math.round(state.money), sk: state.sick || 0, dp: state.dep || 0,
    ov: !!state.over, km: state.kama || 0, cl: state.clean || 0, sl: state.slots
} : {};

CG.debug.init({ key: DBG_KEY, max: DBG_MAX, snap: dbgSnap });

/** 1件記録する（ほかのファイルから呼んでもよい） */
const dbgAdd = (ev, extra) => CG.debug.add(ev, extra);

/** 関数を包んで、前後のフェーズ・所持金の変化を記録する。why：お金が動かなかったら「無視された理由」も残す */
function dbgWrap(name, opt) {
    CG.debug.wrap(name, {
        before: () => ({ ph0: state && state.phase, m0: state && state.money, l0: state && state.log[0] }),
        after: b => {
            const x = { ph0: b.ph0 };
            if (state && state.money !== b.m0)
                x.dm = Math.round(state.money - b.m0);
            else if (opt && opt.why)
                x.ign = investBlock() || 'お金不足か上限';
            if (state && state.log[0] !== b.l0)
                x.lg = state.log[0];
            return x;
        }
    });
}

['buy', 'upgrade', 'takeLoan', 'svMove'].forEach(n => dbgWrap(n, { why: true }));
['fillAll', 'openShop', 'nextDay', 'endDay', 'newGame', 'restart', 'applyLoad', 'amaStart', 'amaFinish', 'amaClose'].forEach(n => dbgWrap(n));
{
    const f = addEvent;
    window.addEvent = function (t) {
        dbgAdd('event', { lg: t });
        return f.apply(this, arguments);
    };
}

/** 送信する */
async function dbgSend() {
    if (dbgMsg && dbgMsg.busy)
        return;
    const nt = byId('dbgn');
    dbgMsg = { busy: true };
    syncDbg();
    const r = await CG.debug.send(nt ? nt.value : '', { why: investBlock(), state });
    dbgMsg = r.ok ? { ok: true, code: r.code } : { ok: false, t: r.t };
    if (r.ok) {
        const n2 = byId('dbgn');
        if (n2)
            n2.value = '';
    }
    syncDbg(true);
}

/** 「設定」タブのデバッグログ欄（内容が変わったときだけ作り直す。入力中のメモは消さない） */
function syncDbg(force) {
    const el = byId('dbg');
    if (!el)
        return;
    const sig = JSON.stringify(dbgMsg);
    if (!force && sig === dbgSig && el.innerHTML)
        return;
    dbgSig = sig;
    const old = byId('dbgn'), note = old ? old.value : '';
    let h = '<b>🐞 デバッグ</b>' + helpIcon('dbg') +
        '<textarea id="dbgn" rows="2" maxlength="500" placeholder="どんなことが起きた？（任意）例：2ヶ月目に投資ボタンが押せない" style="width:100%;box-sizing:border-box;margin:6px 0;font:inherit;font-size:13px;padding:6px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)"></textarea>' +
        '<button data-a="dbgsend"' + (dbgMsg && dbgMsg.busy ? ' disabled' : '') + '>' + (dbgMsg && dbgMsg.busy ? '送信中…' : '🐞 デバッグログを送る') + '</button>' +
        '<div class="meta">直近' + CG.debug.log.length + '件の操作と、いまのゲームの状態を開発者に送ります。</div>';
    if (dbgMsg && dbgMsg.ok)
        h += '<div class="meta svok">✅ 送信しました。受付番号 <b>' + dbgMsg.code + '</b>（開発者に伝えてください）</div>';
    else if (dbgMsg && dbgMsg.t)
        h += '<div class="meta svwarn">⚠ ' + dbgMsg.t + '</div>';
    el.innerHTML = h;
    byId('dbgn').value = note;
}

{
    const r0 = render;
    window.render = function () {
        r0.apply(this, arguments);
        syncDbg();
    };
}
document.addEventListener('click', e => {
    const b = e.target.closest('button[data-a="dbgsend"]');
    if (b && !b.disabled)
        dbgSend();
});
</script>
<script>
/**
 * tutorial.js — 遊び方（チュートリアル。v2.0.0〜）。
 * 画面を暗くして説明する場所だけを光らせ、ちくわくんの吹き出しで順に案内する。タブは自動で切り替える。
 * ・最初に難易度を選んだ直後に1回だけ出す（`newGame` を包む）。今遊んでいる人（セーブがある人）には自動では出さない
 * ・どの場面でも「すべてスキップ」で、そこから先の説明と練習をまとめて飛ばせる。難易度えらびの画面のチェック（#tutoff）で、最初から出さないこともできる。最後まで見るか飛ばしたら、端末に `TUT_KEY` を保存して次からは出さない（ゲームのセーブには入れない）
 * ・設定タブの「📖 遊び方を見る」（data-a="tutorial"）でいつでも見直せる。営業中に開いたら、その間は一時停止する
 * ・初めての人（難易度えらびの直後）だけ、説明のあとに1日目を実際にいっしょに進める（`TUT_PRACTICE`。開業→補充→開店→営業→閉店後）。
 *   見直しのときは説明だけ（実際のお金と日付が進むため）
 * 場面の種類（kind）：なし＝説明（全体を止めて、次へで進む）／'do'＝光っている所だけ押せる（done() を満たすと次へ）／
 *   'watch'＝画面を暗くせず、小さな吹き出しだけ出してゲームを動かしたまま待つ（done() を満たすと次へ）

 */

/** チュートリアルを見終わった（飛ばした）かの保存キー（'1'＝見た） */
const TUT_KEY = 'shop-sim-tutorial';

/**
 * 場面の一覧。q：光らせる場所（関数。null なら画面の真ん中に吹き出しだけ）、tab：先に開くタブ、t：見出し、m：説明（関数でもよい）
 */
const TUT_STEPS = [
    { q: null, tab: 0, t: 'ようこそ、ちいさなお店へ！', m: 'ぼくはちくわくん。お店のやり方を案内するよ。\n商品を仕入れて売って、稼いだお金でお店を大きくしよう。お金が足りなくなると倒産だから気をつけてね。' },
    { q: () => document.querySelector('.mrow'), tab: 0, t: '所持金', m: 'いま使えるお金だよ。仕入れ・投資・月末の支払いはここから出ていくよ。\n右の🏅は実績。条件を満たすと増えていくよ。' },
    { q: () => document.querySelector('details.shop'), tab: 0, t: 'お店の様子と1日の流れ', m: '1日は「① 開店準備 → ② 開店 → ③ 閉店後」の順に進むよ。\n季節や天気、お客さんの様子もこの絵でわかるよ。左下は月末に払うお金の予想だよ。' },
    { q: () => byId('gl').closest('.card'), tab: 0, t: '3つのゲージ', m: '購買欲：高いほどお客さんが来る。100になると来店ブースト！\nノルマ：月末までにこの売上を目指そう。\n幸福度：働きすぎると下がるよ。ときどき店休日で休もう。' },
    { q: () => byId('sh'), tab: 0, t: '陳列棚', m: '「+N」や「満タン」で商品を補充するよ。補充には原価がかかるから、売れる分だけ並べよう。\n在庫が0の棚は売れないよ。' },
    { q: () => byId('act'), tab: 0, t: '開業・開店', m: 'このボタンで1日を進めるよ。開店すると、お客さんが来て自動で売れていくよ。\n営業中は店の絵の右下で一時停止（⏸）と倍速（×1〜×8）ができるよ。' },
    { q: () => document.querySelector('#tabs [data-v="1"]'), tab: 1, t: '投資タブ', m: '閉店後に、棚を増やす・容量アップ・広告・店員・セキュリティなどにお金を使えるよ。\n棚を増やすと新しい商品も並べられるよ。' },
    { q: () => document.querySelector('#tabs [data-v="2"]'), tab: 2, t: 'お金タブ', m: () => difficulty().full ? '融資（お金を借りる）・預金・粗利率・自分の月収を決めるよ。借りたお金は毎月返していくよ。' : '預金や自分の月収を決めるよ。\n融資と粗利率の調整は、ハード・インフェルノで使えるよ。' },
    { q: () => document.querySelector('#tabs [data-v="3"]'), tab: 3, t: '設定タブ', m: 'セーブの書き出し・読み込みや、最初からやり直すのはここ。\n分からないところは小さな「？」を押すと説明が出るよ。遊び方は設定の「📖 遊び方を見る」から見直せるよ。' },
    { q: () => document.querySelector('[data-a="oh"]').closest('.card'), tab: 3, t: '営業時間', m: '開店と閉店の時間を決めるよ。長く開けるほどたくさん売れるけど、幸福度が下がりやすいよ（9時間なら増えも減りもしない）。\n7時前と22時以降は、店員さんの時給が125%になるよ。', end: 'それじゃあ、がんばってね！' }
];

/** 今日の「本日の結果」のカード（閉店後に出る） */
const tutResult = () => [...byId('pn').children].find(e => e.textContent.startsWith('本日の結果'));

/** 棚の在庫の合計（補充したかを見る） */
const tutStock = () => state.shelf.reduce((n, s) => n + (s ? s.st : 0), 0);

/** 1日目をいっしょに進める場面（初めての人だけ。説明のあとに続ける） */
const TUT_PRACTICE = [
    { kind: 'do', q: () => document.querySelector('#act [data-a="next"]'), tab: 0, t: '実際にやってみよう！', m: '「開業する」を押して、お店を開けよう。', done: () => state.day >= 1 },
    { kind: 'do', q: () => byId('sh'), tab: 0, t: '開店準備', m: '棚の「満タン」を押して、商品を並べよう（どの棚でもいいよ）。\n補充すると「次へ」が押せるようになるよ。', start: () => (tutBase = tutStock()), done: () => tutStock() > tutBase, manual: true },
    { kind: 'do', q: () => document.querySelector('#act [data-a="open"]'), tab: 0, t: '開店！', m: '準備ができたら「開店する」を押そう！', done: () => state.phase === 'open' },
    { kind: 'watch', q: () => byId('spd'), tab: 0, t: '営業中', m: 'お客さんが来て売れていくよ。売り切れそうな棚は補充しよう。\n右下の「×1」を押すと速くなるよ。閉店までようすを見てね。', done: () => state.phase === 'closed' },
    { q: () => tutResult(), tab: 0, t: '1日おつかれさま！', m: '今日の売上や来店した人数はここで見られるよ。\n閉店後は、投資やお金の管理ができるよ。「翌日へ進む」で次の日へ。\nそれじゃあ、がんばってね！' }
];

/** 1日目にお店を開けられなかったとき（病気・大雪・店休日など）の終わりの場面 */
const TUT_REST = { q: () => byId('act'), tab: 0, t: '今日はお休み…', m: '今日はお店を開けられない日みたい。お休みのあいだも、閉店後には投資やお金の管理ができるよ。\nそれじゃあ、がんばってね！' };

/** いま案内している場面の並び（説明だけ／説明＋1日目の練習） */
let tutList = TUT_STEPS, tutBase = 0, tutTimer = 0;

/** いまの場面（-1＝出していない）と、始める前の状態（一時停止・タブ・タブバー） */
let tutI = -1, tutPrev = null;

/** ちくわくん（吹き出しのアイコン。16×16 のドット絵を 2 倍で描く） */
function tutFace(c) {
    const g = c.getContext('2d'), R = (x, y, w, h, k) => {
        g.fillStyle = k;
        g.fillRect(x * 2, y * 2, w * 2, h * 2);
    };
    R(1, 5, 14, 7, '#E9A55B');
    R(2, 4, 12, 1, '#E9A55B');
    R(2, 12, 12, 1, '#E9A55B');
    R(3, 5, 3, 1, '#C9772E');
    R(9, 11, 4, 1, '#C9772E');
    R(11, 5, 2, 1, '#C9772E');
    R(1, 5, 2, 7, '#F3DDB2');
    R(1, 7, 1, 3, '#8a5a2e');
    R(6, 7, 1, 2, '#2a1a10');
    R(10, 7, 1, 2, '#2a1a10');
    R(7, 10, 3, 1, '#8a3a2a');
    R(5, 9, 1, 1, '#f4a6a0');
    R(11, 9, 1, 1, '#f4a6a0');
}

/** チュートリアルを始める（practice：説明のあとに1日目をいっしょに進める） */
function tutStart(practice) {
    if (tutI >= 0)
        return;
    // 練習は、開業前（0日目の閉店後）で倒産していないときだけ。最後の説明の「がんばってね」は練習の最後に回す
    practice = practice === true && state.day === 0 && state.phase === 'closed' && !state.over;
    tutList = practice ? TUT_STEPS.map((s, i) => i === TUT_STEPS.length - 1 ? Object.assign({}, s, { end: 'じゃあ次は、実際にお店を開けてみよう！' }) : s).concat(TUT_PRACTICE) : TUT_STEPS;
    hideHelp();
    tutPrev = { paused: state.paused, tab: state.tab || 0, bar: byId('tabs').classList.contains('off') };
    if (state.phase === 'open')
        state.paused = true;
    if (tutPrev.bar)
        tabBar(false, true);
    let o = byId('tut');
    if (!o) {
        o = document.createElement('div');
        o.id = 'tut';
        o.innerHTML = '<div class="tutk"></div><div class="tutk"></div><div class="tutk"></div><div class="tutk"></div><div class="tuth" id="tuth"></div><div class="tutb" id="tutb" role="dialog" aria-modal="true" aria-labelledby="tutt"><div class="tuthd"><canvas id="tutf" width="32" height="32" aria-hidden="true"></canvas><b id="tutt"></b><span class="tutn" id="tutn"></span></div><div class="tutm" id="tutm"></div><div class="tutbt"><button type="button" class="alt" data-a="tutskip">すべてスキップ</button><button type="button" data-a="tutnext" id="tutgo"></button></div></div>';
        document.body.append(o);

}

/** 操作を待つ場面：条件を満たしたか見る。光らせる位置も合わせ直す（ボタンは描き直されるため） */
function tutTick() {
    if (tutI < 0)
        return;
    const s = tutList[tutI];
    if (s.done) {
        const ok = s.done();
        if (ok && !s.manual)
            return tutNext();
        byId('tutgo').disabled = !ok;
    }
    tutPlace();
}

/** 次の場面へ（1日目に開業したのにお店を開けられなかったときは、お休みの場面で終える） */
function tutNext() {
    if (tutI >= tutList.length - 1)
        return tutEnd();
    tutI++;
    if (tutList === TUT_STEPS || tutList[tutI] === TUT_REST)
        return tutShow();
    if (tutList[tutI] === TUT_PRACTICE[1] && (state.phase !== 'prep' || ill())) {
        tutList = tutList.slice(0, tutI).concat([TUT_REST]);
    }
    tutShow();
}

/** いまの場面を出す（タブを切り替え、光らせる場所へスクロールしてから位置を合わせる） */
function tutShow() {
    const s = tutList[tutI];
    if ((state.tab || 0) !== s.tab) {
        state.tab = s.tab;
        render();
    }
    byId('tutt').textContent = s.t;
    const last = tutI === tutList.length - 1;
    byId('tutm').textContent = (typeof s.m === 'function' ? s.m() : s.m) + (s.end && (last || tutList !== TUT_STEPS) ? '\n' + s.end : '');
    byId('tutn').textContent = (tutI + 1) + ' / ' + tutList.length;
    byId('tutgo').textContent = last ? 'はじめる！' : '次へ ▶';
    // 操作を待つ場面は、操作するまで「次へ」を出さない（補充の場面だけは、補充すると押せる）
    byId('tutgo').hidden = !!s.done && !s.manual;
    byId('tutgo').disabled = !!s.done;
    byId('tut').className = s.kind || '';
    if (s.start)
        s.start();
    const el = s.q && s.q();
    if (el && byId('scr').contains(el))
        el.scrollIntoView({ block: 'center' });
    tutPlace();
    byId('tutgo').focus({ preventScroll: true });

/** 光らせる枠と吹き出しの位置を合わせる（画面の向きが変わったときも） */
function tutPlace() {
    if (tutI < 0)
        return;
    const s = tutList[tutI], el = s.q && s.q(), h = byId('tuth'), b = byId('tutb'), W = innerWidth, H = innerHeight, M = 12, K = byId('tut').querySelectorAll('.tutk');
    b.style.maxWidth = Math.min(380, W - M * 2) + 'px';
    K.forEach(k => k.hidden = true);
    if (s.kind === 'watch') {
        // 営業中：暗くせず、店の絵のすぐ下に小さな吹き出しだけ（下の陳列棚は見えたまま、補充もできる）
        h.hidden = true;
        b.classList.remove('mid');
        const tp = byId('top').getBoundingClientRect(), sc = byId('scr').getBoundingClientRect(), bw = b.offsetWidth;
        b.style.left = Math.max(M, Math.min(sc.left + (sc.width - bw) / 2, W - M - bw)) + 'px';
        b.style.top = Math.min(Math.max(M, sc.top + 8), H - M - b.offsetHeight) + 'px';
        return;
    }
    if (!el) {
        h.hidden = true;
        b.classList.add('mid');
        b.style.left = b.style.top = '';
        return;
    }
    b.classList.remove('mid');
    const r = el.getBoundingClientRect(), p = 6;
    // 光らせる枠は画面の中に収める（大きな棚の一覧などは、見えている部分だけ）
    const x = Math.max(4, r.left - p), y = Math.max(4, r.top - p), x2 = Math.min(W - 4, r.right + p), y2 = Math.min(H - 4, r.bottom + p);
    h.hidden = false;
    Object.assign(h.style, { left: x + 'px', top: y + 'px', width: (x2 - x) + 'px', height: (y2 - y) + 'px' });
    // 操作を待つ場面：光っている所だけ押せるよう、まわりの4か所をふさぐ
    if (s.kind === 'do')
        [[0, 0, W, y], [0, y2, W, H - y2], [0, y, x, y2 - y], [x2, y, W - x2, y2 - y]].forEach(([l, t, w, hh], i) => {
            K[i].hidden = false;
            Object.assign(K[i].style, { left: l + 'px', top: t + 'px', width: w + 'px', height: hh + 'px' });
        });
    // 吹き出しは、枠の下に入ればその下、入らなければ上、どちらも入らなければ枠の中の下の方
    const bh = b.offsetHeight, bw = b.offsetWidth;
    let top = y2 + 10;
    if (top + bh > H - M)
        top = y - 10 - bh >= M ? y - 10 - bh : Math.max(M, H - M - bh);
    const left = Math.min(Math.max(M, (x + x2) / 2 - bw / 2), W - M - bw);
    b.style.left = left + 'px';
    b.style.top = top + 'px';
}

/** チュートリアルを終える（最後まで見た・飛ばした）。次からは自動で出さない */
function tutEnd() {
    if (tutI < 0)
        return;
    tutI = -1;
    clearInterval(tutTimer);
    byId('tut').hidden = true;
    CG.ls.set(TUT_KEY, '1');
    tutSyncOff();
    state.tab = tutPrev.tab;
    if (state.phase === 'open')
        state.paused = tutPrev.paused;
    if (tutPrev.bar)
        tabBar(true, true);
    render();
    save();
    byId('scr').scrollTop = 0;
}

document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b)
        return;
    const a = b.dataset.a;
    if (a === 'tutorial')
        tutStart();
    if (a === 'tutskip')
        tutEnd();
    if (a === 'tutnext')
        tutNext();
});

/** 難易度えらびの画面の「遊び方を表示しない」のチェックを、保存した状態にそろえる（見た・飛ばした端末はチェック済み） */
function tutSyncOff() {
    const c = byId('tutoff');
    if (c)
        c.checked = CG.ls.get(TUT_KEY) === '1';
}

// チェックを入れると次の難易度えらびのあとに出さない。外すと、次に難易度を選んだときにもう一度出す
byId('tutoff').addEventListener('change', e => CG.ls.set(TUT_KEY, e.target.checked ? '1' : '0'));
tutSyncOff();

addEventListener('resize', () => requestAnimationFrame(tutPlace));
document.addEventListener('keydown', e => {
    if (tutI >= 0 && e.key === 'Escape')
        tutEnd();
});

// 最初に難易度を選んだ直後に1回だけ出す（まだ見ていない端末だけ）
{
    const ng = newGame;
    newGame = function (v) {
        ng(v);
        if (state.diff && CG.ls.get(TUT_KEY) !== '1')
            setTimeout(() => tutStart(true), 250);
    };
}
